name: Diagnose Plan 03a runtime probe

on:
  push:
    branches: [testing-codex]
    paths:
      - .github/workflows/diagnose-plan03a-runtime-probe.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      DARKNETRA_FIELD_ACTIVE_KEY_VERSION: v2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: testing-codex
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: '0.12.4'
      - id: keys
        name: Generate the same runtime-only key environment as the final gate
        continue-on-error: true
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import secrets
          from pathlib import Path

          def make_key():
              return base64.b64encode(secrets.token_bytes(32)).decode('ascii')

          jwt_key = make_key()
          v1 = make_key()
          v2 = make_key()
          blind = make_key()
          keyring = json.dumps({'v1': v1, 'v2': v2}, separators=(',', ':'))
          for value in (jwt_key, v1, v2, blind, keyring):
              print(f'::add-mask::{value}')
          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as output:
              output.write(f'DARKNETRA_JWT_SIGNING_KEY_B64={jwt_key}\n')
              output.write(f'DARKNETRA_FIELD_KEY_V1_B64={v1}\n')
              output.write(f'DARKNETRA_FIELD_KEYRING_B64_JSON={keyring}\n')
              output.write(f'DARKNETRA_FIELD_BLIND_INDEX_KEY_B64={blind}\n')
          PY
      - id: prepare
        if: steps.keys.outcome == 'success'
        continue-on-error: true
        run: uv sync --all-packages --dev --frozen
      - id: probe
        name: Capture non-secret settings and crypto-boundary diagnostics
        if: steps.prepare.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          uv run python - <<'PY' 2>&1 | tee /tmp/plan03a-runtime-probe.log
          import json
          from darknetra_api.config import Settings
          from darknetra_api.security.encryption import crypto_from_settings

          settings = Settings()
          parsed = json.loads(settings.field_keyring_b64_json)
          print('active_version=', settings.field_active_key_version)
          print('keyring_present=', bool(settings.field_keyring_b64_json))
          print('keyring_versions=', sorted(parsed))
          print('key_lengths=', {version: len(value) for version, value in parsed.items()})
          print('blind_key_present=', bool(settings.field_blind_index_key_b64))
          print('v1_compat_present=', bool(settings.field_key_v1_b64))
          service = crypto_from_settings(settings)
          print('service_active=', service.active_key_version)
          print('service_versions=', sorted(service.key_versions))
          envelope = service.encrypt(
              'runtime probe',
              purpose='evidence.notes',
              resource_id='probe-1',
          )
          print('envelope_version=', envelope.key_version)
          assert envelope.key_version == 'v2'
          assert service.key_versions == frozenset({'v1', 'v2'})
          assert service.decrypt(
              envelope,
              purpose='evidence.notes',
              resource_id='probe-1',
          ) == 'runtime probe'
          print('probe=success')
          PY
      - name: Record diagnostic evidence
        if: always()
        env:
          KEYS: ${{ steps.keys.outcome }}
          PREPARE: ${{ steps.prepare.outcome }}
          PROBE: ${{ steps.probe.outcome }}
        run: |
          mkdir -p docs/verification
          {
            echo '# Plan 03a runtime-probe diagnostic'
            echo
            echo "- runtime key setup: ${KEYS}"
            echo "- workspace preparation: ${PREPARE}"
            echo "- exact runtime probe: ${PROBE}"
            echo
            echo '```text'
            cat /tmp/plan03a-runtime-probe.log 2>/dev/null || true
            echo '```'
          } > docs/verification/plan03a-runtime-probe-diagnostic.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/verification/plan03a-runtime-probe-diagnostic.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs: capture Plan 03a runtime-probe diagnostics [skip ci]'
            git push origin HEAD:testing-codex
          fi
