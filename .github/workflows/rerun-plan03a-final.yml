name: Rerun Plan 03a final verification

on:
  push:
    branches: [testing-codex]
    paths:
      - .github/workflows/rerun-plan03a-final.yml

permissions:
  contents: write

jobs:
  retrigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: testing-codex
          fetch-depth: 0
      - name: Touch the final verification workflow after the key-version fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/plan03a-final.yml')
          text = path.read_text(encoding='utf-8')
          marker = '# Rerun after exposing loaded key versions to the runtime probe.\n'
          if marker not in text:
              text = text.replace(
                  'name: Plan 03a final sensitive-field encryption verification\n\n',
                  'name: Plan 03a final sensitive-field encryption verification\n\n' + marker,
                  1,
              )
              path.write_text(text, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/plan03a-final.yml
          if ! git diff --cached --quiet; then
            git commit -m 'ci: rerun complete Plan 03a verification'
            git push origin HEAD:testing-codex
          fi
