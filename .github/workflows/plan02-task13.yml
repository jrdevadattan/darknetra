name: Plan 02 Task 13 real auth E2E

# Browser RED gate: the real stack is migrated but intentionally unseeded.
on:
  push:
    branches: [testing-codex]
    paths:
      - .github/workflows/plan02-task13.yml

permissions:
  contents: write

jobs:
  verify-browser-red:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      DARKNETRA_E2E_DATABASE_URL: postgresql+psycopg://darknetra:darknetra-e2e@127.0.0.1:55432/darknetra_e2e_test
      DARKNETRA_E2E_ANALYST_A_PASSWORD: Synthetic-A-Password-42!
      DARKNETRA_E2E_ANALYST_B_PASSWORD: Synthetic-B-Password-42!
      DARKNETRA_E2E_BOOTSTRAP_PASSWORD: Synthetic-Bootstrap-42!
      DARKNETRA_E2E_BOOTSTRAP_NEW_PASSWORD: Synthetic-Bootstrap-Replaced-42!
    steps:
      - uses: actions/checkout@v4
        with:
          ref: testing-codex
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: '0.12.4'

      - id: prepare
        name: Prepare workspaces
        continue-on-error: true
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          pnpm install --frozen-lockfile
          uv sync --all-packages --dev --frozen

      - id: compose_config
        name: Validate isolated Compose profile
        continue-on-error: true
        run: |
          docker compose -p darknetra-plan02-task13-red \
            -f docker-compose.yml -f docker-compose.e2e.yml config >/dev/null

      - id: database
        name: Start disposable PostgreSQL volume
        if: steps.compose_config.outcome == 'success'
        continue-on-error: true
        run: |
          docker compose -p darknetra-plan02-task13-red \
            -f docker-compose.yml -f docker-compose.e2e.yml up -d postgres
          for attempt in $(seq 1 30); do
            if docker compose -p darknetra-plan02-task13-red \
              -f docker-compose.yml -f docker-compose.e2e.yml \
              exec -T postgres pg_isready -U darknetra -d darknetra_e2e_test; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - id: migrate
        name: Migrate empty disposable database
        if: steps.prepare.outcome == 'success' && steps.database.outcome == 'success'
        continue-on-error: true
        env:
          DARKNETRA_DATABASE_URL: ${{ env.DARKNETRA_E2E_DATABASE_URL }}
        run: uv run alembic -c apps/api/alembic.ini upgrade head

      - id: stack
        name: Build and start real API and web containers
        if: steps.migrate.outcome == 'success'
        continue-on-error: true
        run: |
          docker compose -p darknetra-plan02-task13-red \
            -f docker-compose.yml -f docker-compose.e2e.yml up -d --build api web
          curl --fail --retry 40 --retry-all-errors --retry-delay 2 \
            http://127.0.0.1:8000/api/v1/health/live
          curl --fail --retry 40 --retry-all-errors --retry-delay 2 \
            http://127.0.0.1:3000/auth/v2/login >/dev/null

      - id: playwright
        name: Install Chromium
        if: steps.prepare.outcome == 'success'
        continue-on-error: true
        run: pnpm --filter @darknetra/web exec playwright install --with-deps chromium

      - id: browser_tests
        name: Task 13 RED real browser tests
        if: steps.stack.outcome == 'success' && steps.playwright.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @darknetra/web test:e2e:real 2>&1 | tee /tmp/task13-browser.log

      - name: Tear down isolated stack and volume
        if: always()
        run: |
          docker compose -p darknetra-plan02-task13-red \
            -f docker-compose.yml -f docker-compose.e2e.yml down -v --remove-orphans || true

      - name: Record Task 13 browser RED outcome
        if: always()
        env:
          PREPARE: ${{ steps.prepare.outcome }}
          COMPOSE_CONFIG: ${{ steps.compose_config.outcome }}
          DATABASE: ${{ steps.database.outcome }}
          MIGRATE: ${{ steps.migrate.outcome }}
          STACK: ${{ steps.stack.outcome }}
          PLAYWRIGHT: ${{ steps.playwright.outcome }}
          BROWSER_TESTS: ${{ steps.browser_tests.outcome }}
        run: |
          mkdir -p docs/verification
          {
            echo '# Plan 02 Task 13 verification'
            echo
            echo 'Real browser RED phase outcomes:'
            echo
            echo "- prepare: ${PREPARE}"
            echo "- Compose profile: ${COMPOSE_CONFIG}"
            echo "- disposable PostgreSQL: ${DATABASE}"
            echo "- migration: ${MIGRATE}"
            echo "- real API/web stack: ${STACK}"
            echo "- Chromium install: ${PLAYWRIGHT}"
            echo "- real auth/authorization browser tests: ${BROWSER_TESTS}"
            echo
            echo '## Browser test tail'
            echo
            echo '```text'
            tail -n 180 /tmp/task13-browser.log 2>/dev/null || true
            echo '```'
          } > docs/verification/plan02-task13-real-e2e.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/verification/plan02-task13-real-e2e.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs: record Plan 02 Task 13 browser RED outcome [skip ci]'
            git push origin HEAD:testing-codex
          fi

      - name: Require browser RED before fixture wiring
        if: always()
        env:
          PREPARE: ${{ steps.prepare.outcome }}
          COMPOSE_CONFIG: ${{ steps.compose_config.outcome }}
          DATABASE: ${{ steps.database.outcome }}
          MIGRATE: ${{ steps.migrate.outcome }}
          STACK: ${{ steps.stack.outcome }}
          PLAYWRIGHT: ${{ steps.playwright.outcome }}
          BROWSER_TESTS: ${{ steps.browser_tests.outcome }}
        run: |
          test "$PREPARE" = success
          test "$COMPOSE_CONFIG" = success
          test "$DATABASE" = success
          test "$MIGRATE" = success
          test "$STACK" = success
          test "$PLAYWRIGHT" = success
          test "$BROWSER_TESTS" = failure
