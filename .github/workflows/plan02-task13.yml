name: Plan 02 Task 13 real auth E2E

on:
  push:
    branches: [testing-codex]
    paths:
      - .github/workflows/plan02-task13.yml

permissions:
  contents: write

jobs:
  verify-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: testing-codex
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: '0.12.4'
      - id: prepare
        name: Prepare Python workspace
        continue-on-error: true
        run: uv sync --all-packages --dev --frozen
      - id: safety_tests
        name: Task 13 RED fixture safety tests
        if: steps.prepare.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          uv run pytest apps/api/tests/unit/test_e2e_fixture_cli.py -v 2>&1 | tee /tmp/task13-safety.log
      - name: Record Task 13 RED outcome
        if: always()
        env:
          PREPARE: ${{ steps.prepare.outcome }}
          SAFETY_TESTS: ${{ steps.safety_tests.outcome }}
        run: |
          mkdir -p docs/verification
          {
            echo '# Plan 02 Task 13 verification'
            echo
            echo 'RED phase outcomes:'
            echo
            echo "- prepare: ${PREPARE}"
            echo "- fixture safety tests: ${SAFETY_TESTS}"
            echo
            echo '```text'
            tail -n 140 /tmp/task13-safety.log 2>/dev/null || true
            echo '```'
          } > docs/verification/plan02-task13-real-e2e.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/verification/plan02-task13-real-e2e.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs: record Plan 02 Task 13 safety RED outcome [skip ci]'
            git push origin HEAD:testing-codex
          fi
      - name: Require RED before fixture implementation
        if: always()
        env:
          PREPARE: ${{ steps.prepare.outcome }}
          SAFETY_TESTS: ${{ steps.safety_tests.outcome }}
        run: |
          test "$PREPARE" = success
          test "$SAFETY_TESTS" = failure
