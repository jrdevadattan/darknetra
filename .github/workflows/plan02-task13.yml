name: Plan 02 Task 13 real auth E2E

# Fixture GREEN gate before real browser authentication tests.
on:
  push:
    branches: [testing-codex]
    paths:
      - .github/workflows/plan02-task13.yml

permissions:
  contents: write

jobs:
  verify-fixture:
    runs-on: ubuntu-latest
    env:
      DARKNETRA_E2E_DATABASE_URL: postgresql+psycopg://darknetra:darknetra-e2e@127.0.0.1:5432/darknetra_e2e_test
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: darknetra_e2e_test
          POSTGRES_USER: darknetra
          POSTGRES_PASSWORD: darknetra-e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U darknetra -d darknetra_e2e_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: testing-codex
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: '0.12.4'
      - id: prepare
        name: Prepare Python workspace
        continue-on-error: true
        run: uv sync --all-packages --dev --frozen
      - id: migrate
        name: Migrate disposable E2E database
        if: steps.prepare.outcome == 'success'
        continue-on-error: true
        env:
          DARKNETRA_DATABASE_URL: ${{ env.DARKNETRA_E2E_DATABASE_URL }}
        run: uv run alembic -c apps/api/alembic.ini upgrade head
      - id: ruff
        name: Ruff fixture code
        if: steps.prepare.outcome == 'success'
        continue-on-error: true
        run: uv run ruff check scripts/create_e2e_fixture.py apps/api/tests/unit/test_e2e_fixture_cli.py apps/api/tests/integration/test_e2e_fixture_creation.py
      - id: safety_tests
        name: Fixture safety tests
        if: steps.prepare.outcome == 'success'
        continue-on-error: true
        run: uv run pytest apps/api/tests/unit/test_e2e_fixture_cli.py -v
      - id: fixture_test
        name: Deterministic fixture integration test
        if: steps.migrate.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          uv run pytest apps/api/tests/integration/test_e2e_fixture_creation.py -v 2>&1 | tee /tmp/task13-fixture.log
      - name: Record Task 13 fixture outcome
        if: always()
        env:
          PREPARE: ${{ steps.prepare.outcome }}
          MIGRATE: ${{ steps.migrate.outcome }}
          RUFF: ${{ steps.ruff.outcome }}
          SAFETY_TESTS: ${{ steps.safety_tests.outcome }}
          FIXTURE_TEST: ${{ steps.fixture_test.outcome }}
        run: |
          mkdir -p docs/verification
          {
            echo '# Plan 02 Task 13 verification'
            echo
            echo 'Deterministic fixture phase outcomes:'
            echo
            echo "- prepare: ${PREPARE}"
            echo "- disposable DB migration: ${MIGRATE}"
            echo "- Ruff fixture code: ${RUFF}"
            echo "- fixture safety tests: ${SAFETY_TESTS}"
            echo "- fixture integration test: ${FIXTURE_TEST}"
            echo
            echo '```text'
            tail -n 160 /tmp/task13-fixture.log 2>/dev/null || true
            echo '```'
          } > docs/verification/plan02-task13-real-e2e.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/verification/plan02-task13-real-e2e.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs: record Plan 02 Task 13 fixture outcome [skip ci]'
            git push origin HEAD:testing-codex
          fi
      - name: Enforce deterministic fixture gate
        if: always()
        env:
          PREPARE: ${{ steps.prepare.outcome }}
          MIGRATE: ${{ steps.migrate.outcome }}
          RUFF: ${{ steps.ruff.outcome }}
          SAFETY_TESTS: ${{ steps.safety_tests.outcome }}
          FIXTURE_TEST: ${{ steps.fixture_test.outcome }}
        run: |
          test "$PREPARE" = success
          test "$MIGRATE" = success
          test "$RUFF" = success
          test "$SAFETY_TESTS" = success
          test "$FIXTURE_TEST" = success
