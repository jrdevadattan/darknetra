name: Repair Plan 03 Task 4 policy lint findings

on:
  push:
    branches: [testing-codex]
    paths:
      - .github/workflows/repair-plan03-task4-policy-lint.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: testing-codex
          fetch-depth: 0

      - name: Apply only the evidence-driven Ruff corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/plan03-task4-policy-v2.yml')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'naive["captured_at"] = datetime(2026, 8, 19, 10, 30)':
                  'naive["captured_at"] = datetime.now(UTC).replace(tzinfo=None)',
              '_CONTROL_BYTES = frozenset(range(0, 9)) | frozenset(range(11, 13)) | frozenset(': 
                  '_CONTROL_BYTES = frozenset(range(9)) | frozenset(range(11, 13)) | frozenset(',
              'def validate_governance_and_time(self) -> "EvidenceSourceMetadata":':
                  'def validate_governance_and_time(self) -> EvidenceSourceMetadata:',
              'elif (\n                  lower.startswith(b"<!doctype html")\n                  or lower.startswith(b"<html")\n                  or b"<html" in lower\n              ):':
                  'elif lower.startswith((b"<!doctype html", b"<html")) or b"<html" in lower:',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'expected one occurrence of repair marker: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit the workflow correction and retrigger policy TDD
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/plan03-task4-policy-v2.yml
          git rm .github/workflows/repair-plan03-task4-policy-lint.yml
          git commit -m 'ci: satisfy Task 4 policy lint contract'
          git pull --rebase origin testing-codex
          git push origin HEAD:testing-codex
