name: Task 06 investigator route shell

on:
  push:
    branches: [testing-codex]
    paths:
      - .github/workflows/task06-investigator-shell.yml

permissions:
  contents: write

jobs:
  task06:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: testing-codex
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare workspace
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          pnpm install --frozen-lockfile

      - name: Write failing investigator component contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apps/web/src/components/darknetra apps/web/src/features/cases
          cat > apps/web/src/components/darknetra/investigator-primitives.test.tsx <<'EOF'
          import { render, screen } from '@testing-library/react';
          import { describe, expect, it } from 'vitest';

          import { AsyncState } from './async-state';
          import { MetricLinkCard } from './metric-link-card';
          import { SourceClassBadge } from './source-class-badge';
          import { StatusBadge } from './status-badge';

          describe('investigator primitives', () => {
            it('renders epistemic status as visible text', () => {
              render(<StatusBadge status="pending-review" />);
              expect(screen.getByText('Pending analyst review')).toBeInTheDocument();
            });

            it('renders source class as visible text', () => {
              render(<SourceClassBadge sourceClass="SYNTHETIC" />);
              expect(screen.getByText('SYNTHETIC')).toBeInTheDocument();
            });

            it('makes every metric card a real navigation link', () => {
              render(
                <MetricLinkCard
                  label="Pending link reviews"
                  value={4}
                  description="Requires analyst attention"
                  href="/cases?review=pending"
                />,
              );
              expect(screen.getByRole('link', { name: /Pending link reviews/i })).toHaveAttribute(
                'href',
                '/cases?review=pending',
              );
            });

            it.each(['loading', 'empty', 'error', 'partial', 'stale', 'offline'] as const)(
              'exposes %s as a visible state',
              (state) => {
                const { unmount } = render(<AsyncState state={state} />);
                expect(screen.getByTestId(`async-state-${state}`)).toBeInTheDocument();
                unmount();
              },
            );
          });
          EOF

          cat > apps/web/src/features/cases/cases-table.test.tsx <<'EOF'
          import { render, screen } from '@testing-library/react';
          import userEvent from '@testing-library/user-event';
          import { describe, expect, it } from 'vitest';

          import { CasesTable } from './cases-table';
          import { FIXTURE_CASES } from './fixtures';

          describe('CasesTable', () => {
            it('supports visible search and links rows to a case', async () => {
              const user = userEvent.setup();
              render(<CasesTable cases={FIXTURE_CASES} />);

              expect(screen.getByRole('textbox', { name: /search cases/i })).toBeInTheDocument();
              expect(screen.getByRole('combobox', { name: /status/i })).toBeInTheDocument();
              expect(screen.getByRole('combobox', { name: /sensitivity/i })).toBeInTheDocument();
              expect(screen.getByRole('combobox', { name: /sort/i })).toBeInTheDocument();

              await user.type(screen.getByRole('textbox', { name: /search cases/i }), 'SYN-DEMO-004');
              expect(screen.getByRole('link', { name: /Image reuse hard-negative/i })).toHaveAttribute(
                'href',
                '/cases/SYN-DEMO-004',
              );
              expect(screen.queryByText('Alias correlation training case')).not.toBeInTheDocument();
            });
          });
          EOF

          set +e
          pnpm --filter @darknetra/web test -- \
            src/components/darknetra/investigator-primitives.test.tsx \
            src/features/cases/cases-table.test.tsx > /tmp/task06-red.log 2>&1
          status=$?
          set -e
          cat /tmp/task06-red.log
          if [ "$status" -eq 0 ]; then
            echo 'Task 06 tests unexpectedly passed before implementation.' >&2
            exit 1
          fi

      - name: Implement DARKNETRA investigator primitives and fixtures
        shell: bash
        run: |
          set -euo pipefail

          cat > apps/web/src/components/darknetra/status-badge.tsx <<'EOF'
          import { Badge } from '@/components/ui/badge';

          export type InvestigatorStatus =
            | 'candidate'
            | 'lead'
            | 'pending-review'
            | 'analyst-confirmed'
            | 'rejected'
            | 'verified'
            | 'warning'
            | 'failed'
            | 'offline';

          const STATUS_COPY: Record<InvestigatorStatus, string> = {
            candidate: 'Candidate',
            lead: 'Lead',
            'pending-review': 'Pending analyst review',
            'analyst-confirmed': 'Analyst-confirmed',
            rejected: 'Rejected',
            verified: 'Verified',
            warning: 'Warning',
            failed: 'Failed',
            offline: 'Offline',
          };

          export function StatusBadge({ status }: { status: InvestigatorStatus }) {
            const destructive = status === 'failed' || status === 'rejected';
            const outline = status === 'candidate' || status === 'pending-review' || status === 'offline';
            return (
              <Badge variant={destructive ? 'destructive' : outline ? 'outline' : 'secondary'}>
                {STATUS_COPY[status]}
              </Badge>
            );
          }
          EOF

