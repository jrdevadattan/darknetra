name: Plan 02 Task 10 live cases

# Full GREEN gate: prove live case mapping, view states, no production fixture imports, and build health.
on:
  push:
    branches: [testing-codex]
    paths:
      - .github/workflows/plan02-task10.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          pnpm install --frozen-lockfile
      - name: Task 10 focused tests
        run: |
          pnpm --filter @darknetra/web test -- src/features/cases/queries.test.ts src/features/cases/live-case-views.test.tsx
      - name: Prove production routes do not import case fixtures
        run: |
          if grep -R "features/cases/fixtures" apps/web/src/app apps/web/src/features \
            --include='*.ts' --include='*.tsx' | grep -vE '\.(test|spec)\.(ts|tsx):'; then
            echo 'Production fixture import detected.' >&2
            exit 1
          fi
      - name: Web quality gate
        run: |
          pnpm --filter @darknetra/web lint
          pnpm --filter @darknetra/web typecheck
          pnpm --filter @darknetra/web test
          pnpm --filter @darknetra/web build
