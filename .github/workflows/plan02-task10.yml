name: Plan 02 Task 10 live cases

# GREEN mapper gate: live case transport is mapped into the retained UI contract.
on:
  push:
    branches: [testing-codex]
    paths:
      - .github/workflows/plan02-task10.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          pnpm install --frozen-lockfile
      - name: Task 10 mapper tests
        run: pnpm --filter @darknetra/web test -- src/features/cases/queries.test.ts
