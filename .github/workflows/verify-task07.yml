name: Verify Task 07

on:
  push:
    branches: [testing-codex]
    paths:
      - .github/workflows/verify-task07.yml

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: testing-codex
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: '0.12.4'

      - name: Verify Python workspace and API
        run: |
          uv lock
          uv sync --all-packages --dev
          uv run pytest apps/api/tests tests/repo -v
          uv run ruff check apps/api

      - name: Verify investigator frontend
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          pnpm install --frozen-lockfile
          pnpm --filter @darknetra/web test
          pnpm --filter @darknetra/web lint
          pnpm --filter @darknetra/web typecheck
          pnpm --filter @darknetra/web build

      - name: Persist verified Python lock update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uv.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: lock Task 07 API dependencies [skip ci]'
          git push origin HEAD:testing-codex

# Verification revision: API and frontend hygiene fixes applied on committed state.
