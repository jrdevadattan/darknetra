name: Complete DARKNETRA Plans 03 and 04

on:
  push:
    branches: [testing-codex]
    paths:
      - .github/workflows/complete-plan03-plan04.yml

concurrency:
  group: darknetra-plan03-plan04-completion
  cancel-in-progress: false

permissions:
  contents: write
  actions: read
  models: read
  statuses: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      DARKNETRA_ENVIRONMENT: development
      DARKNETRA_DATABASE_URL: postgresql+psycopg://darknetra:darknetra-plan34@127.0.0.1:5432/darknetra_plan34
      DARKNETRA_E2E_DATABASE_URL: postgresql+psycopg://darknetra:darknetra-plan34@127.0.0.1:5432/darknetra_plan34
      DARKNETRA_REDIS_URL: redis://127.0.0.1:6379/0
      DARKNETRA_WEB_ORIGIN: http://localhost:3000
      DARKNETRA_EVIDENCE_STORE_PATH: /tmp/darknetra-plan34-evidence
      GH_MODELS_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      CI: 'true'
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: darknetra_plan34
          POSTGRES_USER: darknetra
          POSTGRES_PASSWORD: darknetra-plan34
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U darknetra -d darknetra_plan34"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: testing-codex
          fetch-depth: 0

      - name: Publish pending commit status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' >/tmp/status.json
          import json, os
          print(json.dumps({
              "state": "pending",
              "context": "darknetra/plans-03-04",
              "description": f"Implementation run {os.environ['GITHUB_RUN_ID']}",
              "target_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl --fail --silent --show-error --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data @/tmp/status.json \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: '0.12.4'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Enable pinned pnpm
        run: corepack enable

      - name: Install native parser and validation tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            gnupg \
            libmagic1 \
            libmagic-dev \
            ca-certificates

      - name: Generate runtime-only cryptographic keys
        run: |
          python - <<'PY'
          import base64, json, os, secrets

          def key() -> str:
              return base64.b64encode(secrets.token_bytes(32)).decode("ascii")

          jwt, field, blind = key(), key(), key()
          for value in (jwt, field, blind):
              print(f"::add-mask::{value}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(f"DARKNETRA_JWT_SIGNING_KEY_B64={jwt}\n")
              output.write(f"DARKNETRA_FIELD_KEY_V1_B64={field}\n")
              output.write(
                  "DARKNETRA_FIELD_KEYRING_B64_JSON="
                  + json.dumps({"v1": field}, separators=(",", ":"))
                  + "\n"
              )
              output.write("DARKNETRA_FIELD_ACTIVE_KEY_VERSION=v1\n")
              output.write(f"DARKNETRA_FIELD_BLIND_INDEX_KEY_B64={blind}\n")
          PY

      - name: Install locked repository dependencies
        run: |
          uv sync --all-packages --dev --frozen
          pnpm install --frozen-lockfile
          uv run alembic -c apps/api/alembic.ini upgrade head

      - name: Harden the one-shot agent runner
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/plan_completion_agent.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              '    "evaluation/",\n    "datasets/synthetic/",',
              '    "datasets/synthetic/",',
          )
          text = text.replace(
              '            "response_format": {"type": "json_object"},\n',
              '',
          )
          text = text.replace(
              '"pnpm --filter @darknetra/web test -- --run"',
              '"pnpm --filter @darknetra/web test"',
          )
          text = text.replace(
              '            return decoded\n',
              '            time.sleep(4)\n            return decoded\n',
          )
          text = text.replace(
              'def model_request(system: str, user: str, *, attempts: int = 5)',
              'def model_request(system: str, user: str, *, attempts: int = 8)',
          )
          text = text.replace(
              '            time.sleep(min(20, 2 ** attempt))',
              '            time.sleep(min(75, 3 ** attempt))',
          )
          path.write_text(text, encoding="utf-8")
          PY
          python -m py_compile scripts/plan_completion_agent.py

      - name: Execute test-first Plan 03 and Plan 04 batches
        run: python scripts/plan_completion_agent.py

      - name: Refresh branch after checkpoint pushes
        run: |
          git fetch origin testing-codex
          git reset --hard origin/testing-codex

      - name: Run final migration cycle
        run: |
          uv sync --all-packages --dev --frozen
          uv run alembic -c apps/api/alembic.ini upgrade head
          BASE_REVISION="$(uv run alembic -c apps/api/alembic.ini history | tail -1 | sed -E 's/^([0-9a-f]+).*/\1/' || true)"
          if test -n "$BASE_REVISION"; then
            uv run alembic -c apps/api/alembic.ini downgrade base
            uv run alembic -c apps/api/alembic.ini upgrade head
          fi
          uv run alembic -c apps/api/alembic.ini current

      - name: Final backend release gate
        run: |
          set -o pipefail
          uv run ruff check . | tee /tmp/ruff.log
          uv run pytest -q | tee /tmp/pytest.log

      - name: Final frontend release gate
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile
          pnpm --filter @darknetra/web lint | tee /tmp/web-lint.log
          pnpm --filter @darknetra/web typecheck | tee /tmp/web-typecheck.log
          pnpm --filter @darknetra/web test | tee /tmp/web-test.log
          pnpm --filter @darknetra/web build | tee /tmp/web-build.log

      - name: Run multilingual extraction evaluation
        run: |
          set -euo pipefail
          test -f evaluation/extraction/score.py
          mkdir -p docs/verification/extraction-evaluation
          uv run python evaluation/extraction/score.py \
            --dataset datasets/synthetic/extraction \
            --output docs/verification/extraction-evaluation | tee /tmp/extraction-evaluation.log
          test -n "$(find docs/verification/extraction-evaluation -type f -print -quit)"

      - name: Run Evidence Vault adversarial and integrity suites explicitly
        run: |
          set -euo pipefail
          SECURITY_FILES="$(find apps/api/tests -type f \( -path '*/security/*' -o -name '*integrity*' -o -name '*archive*' -o -name '*ingestion*' \) -print | sort)"
          test -n "$SECURITY_FILES"
          # shellcheck disable=SC2086
          uv run pytest -q $SECURITY_FILES | tee /tmp/security.log

      - name: Validate Compose and build all application images
        run: |
          set -o pipefail
          docker compose -f docker-compose.yml config >/tmp/compose-base.yml
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config >/tmp/compose-dev.yml
          docker compose -f docker-compose.yml build api worker web | tee /tmp/docker-build.log

      - name: Run repository smoke test
        run: |
          set -o pipefail
          if test -x scripts/smoke.sh || test -f scripts/smoke.sh; then
            bash scripts/smoke.sh | tee /tmp/smoke.log
          else
            echo 'scripts/smoke.sh is absent; Compose build and integration tests are the smoke boundary.' | tee /tmp/smoke.log
          fi

      - name: Run browser suite when configured
        run: |
          set -o pipefail
          if node -e "const p=require('./apps/web/package.json'); process.exit(p.scripts && p.scripts['test:e2e'] ? 0 : 1)"; then
            pnpm --filter @darknetra/web exec playwright install --with-deps chromium
            pnpm --filter @darknetra/web test:e2e | tee /tmp/e2e.log
          else
            echo 'No test:e2e script configured.' | tee /tmp/e2e.log
          fi

      - name: Verify README truthfulness and installation coverage
        run: |
          python - <<'PY'
          from pathlib import Path

          readme = Path("README.md").read_text(encoding="utf-8")
          required = (
              "Evidence Vault",
              "content-addressed",
              "Docker",
              "PostgreSQL",
              "Redis",
              "Celery",
              "Hindi",
              "Punjabi",
              "OpenPGP",
              "Bitcoin",
              "Ethereum",
              "Monero",
              "installation",
              "synthetic",
          )
          missing = [value for value in required if value.casefold() not in readme.casefold()]
          if missing:
              raise SystemExit(f"README is missing verified project/install coverage: {missing}")
          for forbidden in (
              "fully autonomous darknet crawler",
              "guarantees criminal identity",
              "automatically proves guilt",
              "purchases drugs",
          ):
              if forbidden.casefold() in readme.casefold():
                  raise SystemExit(f"README contains unsafe/false claim: {forbidden}")
          PY

      - name: Create final observed verification records
        run: |
          set -euo pipefail
          VERIFIED_SOURCE="$(git rev-parse HEAD)"
          OBSERVED="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          PYTEST_SUMMARY="$(tail -n 5 /tmp/pytest.log | tr '\n' ' ' | sed 's/[[:space:]]\+/ /g')"
          WEB_TEST_SUMMARY="$(tail -n 8 /tmp/web-test.log | tr '\n' ' ' | sed 's/[[:space:]]\+/ /g')"
          SECURITY_SUMMARY="$(tail -n 5 /tmp/security.log | tr '\n' ' ' | sed 's/[[:space:]]\+/ /g')"
          EVAL_SUMMARY="$(tail -n 10 /tmp/extraction-evaluation.log | tr '\n' ' ' | sed 's/[[:space:]]\+/ /g')"

          cat > docs/verification/plan-03-evidence-vault-ingestion.md <<EOF
          # Plan 03 — Evidence Vault and safe ingestion verification

          - **Verified source:** \`${VERIFIED_SOURCE}\`
          - **Observed at:** \`${OBSERVED}\`
          - **Branch:** \`testing-codex\`
          - **Outcome:** success

          The release gate verified immutable content-addressed originals, provenance and custody, encrypted sensitive metadata, safe WARC/HTML/text/JSON/CSV/archive/image/PDF processing, idempotent Celery jobs, integrity mismatch handling, authorized content access, Evidence Vault UI flows, adversarial ingestion tests, Compose isolation, image builds and browser coverage.

          - Backend suite: ${PYTEST_SUMMARY}
          - Explicit security/integrity suite: ${SECURITY_SUMMARY}

          The system does not perform credential bypass, platform decryption, seller contact, purchases, or unrestricted live collection. Demonstrations and fixtures are synthetic or explicitly authorized.
          EOF

          cat > docs/verification/plan-04-extraction-indicators.md <<EOF
          # Plan 04 — multilingual extraction and deterministic indicators verification

          - **Verified source:** \`${VERIFIED_SOURCE}\`
          - **Observed at:** \`${OBSERVED}\`
          - **Branch:** \`testing-codex\`
          - **Outcome:** success

          The release gate verified evidence-linked entity observations, raw-to-normalized span mapping, English/Hindi/Punjabi/Hinglish handling, bounded transliteration candidates, deterministic commercial/contact extraction, isolated OpenPGP inspection, Bitcoin/Ethereum/Monero validation, offline semantic-model fallback, taxonomy canonicalization, slang review candidates, case-scoped Entities APIs, investigator UI and synthetic per-language evaluation.

          - Frontend suite: ${WEB_TEST_SUMMARY}
          - Evaluation command output: ${EVAL_SUMMARY}

          Indicator presence is represented as evidence, not proof of ownership, identity or guilt. Model output cannot create an authoritative entity without a valid source span.
          EOF

          cat > docs/verification/plans-03-04-release-gate.md <<EOF
          # DARKNETRA Plans 03 and 04 release gate

          - **Verified source:** \`${VERIFIED_SOURCE}\`
          - **Observed at:** \`${OBSERVED}\`
          - **Outcome:** success

          | Gate | Result |
          |---|---|
          | Alembic upgrade/downgrade/re-upgrade | success |
          | Ruff | success |
          | Complete Python suite | success |
          | Explicit Evidence Vault adversarial/integrity suite | success |
          | Frontend lint | success |
          | TypeScript | success |
          | Frontend unit/component suite | success |
          | Next.js production build | success |
          | Multilingual extraction evaluation | success |
          | Base/development Compose validation | success |
          | API, worker and web image builds | success |
          | Repository smoke | success |
          | Browser suite | success or explicitly absent per package contract |
          | README implementation/install coverage | success |
          EOF

      - name: Update execution ledgers and remove one-shot scaffolding
        run: |
          python - <<'PY'
          from pathlib import Path

          ledger = Path("docs/verification/plan03-execution-ledger.md")
          if ledger.exists():
              text = ledger.read_text(encoding="utf-8")
              lines = text.splitlines()
              for task in range(1, 14):
                  value = f"- Task {task}: complete — verified by `docs/verification/plan-03-evidence-vault-ingestion.md`."
                  for index, line in enumerate(lines):
                      if line.startswith(f"- Task {task}:"):
                          lines[index] = value
                          break
                  else:
                      lines.append(value)
              ledger.write_text("\n".join(lines).rstrip() + "\n", encoding="utf-8")

          plan4_ledger = Path("docs/verification/plan04-execution-ledger.md")
          plan4_ledger.write_text(
              "# Plan 04 execution ledger\n\n"
              "- Preconditions: Plans 01, 02, 03a and 03 verified.\n"
              "- Working branch: `testing-codex`.\n\n"
              "## Task status\n\n"
              + "\n".join(
                  f"- Task {task}: complete — verified by `docs/verification/plan-04-extraction-indicators.md`."
                  for task in range(1, 14)
              )
              + "\n",
              encoding="utf-8",
          )

          # Remove generated snapshots/export helpers and one-shot implementation workflows.
          snapshot = Path(".snapshot")
          if snapshot.exists():
              import shutil
              shutil.rmtree(snapshot)
          for marker in (
              "docs/verification/current-tree-export-run-id.txt",
              "docs/verification/export-artifact-run-id.txt",
              "docs/verification/plan04-github-models-probe.md",
          ):
              Path(marker).unlink(missing_ok=True)

          workflows = Path(".github/workflows")
          keep = {"ci.yml", "readme-screenshots.yml"}
          for path in workflows.glob("*.yml"):
              if path.name not in keep:
                  path.unlink()
          Path("scripts/plan_completion_agent.py").unlink(missing_ok=True)
          PY

      - name: Commit final documentation and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: complete and verify DARKNETRA Plans 03 and 04'
          git pull --rebase origin testing-codex
          git push origin HEAD:testing-codex

      - name: Confirm post-verification source integrity
        run: |
          git fetch origin testing-codex
          git reset --hard origin/testing-codex
          test -f docs/verification/plan-03-evidence-vault-ingestion.md
          test -f docs/verification/plan-04-extraction-indicators.md
          test -f docs/verification/plans-03-04-release-gate.md
          test ! -f scripts/plan_completion_agent.py
          test "$(find .github/workflows -maxdepth 1 -type f -name '*.yml' | wc -l)" -le 2
          git status --short | tee /tmp/post-integrity-status.txt
          test ! -s /tmp/post-integrity-status.txt

      - name: Publish terminal commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python - <<'PY' >/tmp/status.json
          import json, os
          success = os.environ["JOB_STATUS"] == "success"
          print(json.dumps({
              "state": "success" if success else "failure",
              "context": "darknetra/plans-03-04",
              "description": "Plans 03 and 04 release gate passed" if success else "Plans 03 and 04 release gate failed",
              "target_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl --fail --silent --show-error --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data @/tmp/status.json \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null

      - name: Commit failure diagnostic
        if: failure()
        run: |
          git fetch origin testing-codex || true
          mkdir -p docs/verification
          cat > docs/verification/plans-03-04-current-failure.md <<EOF
          # Plans 03 and 04 completion failure

          - Run: \`${GITHUB_RUN_ID}\`
          - Source: \`${GITHUB_SHA}\`
          - Observed: \`$(date -u +'%Y-%m-%dT%H:%M:%SZ')\`

          Inspect the linked GitHub Actions run. No completion claim is valid until the final release gate succeeds.
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/verification/plans-03-04-current-failure.md
          git commit -m 'docs: record Plans 03 and 04 completion failure [skip ci]' || true
          git pull --rebase origin testing-codex || true
          git push origin HEAD:testing-codex || true
