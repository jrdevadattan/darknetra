name: Plan 02 Task 12 administration reads

on:
  push:
    branches: [testing-codex]
    paths:
      - .github/workflows/plan02-task12.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: testing-codex
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: prepare
        name: Prepare pnpm
        continue-on-error: true
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          pnpm install --frozen-lockfile
      - id: admin_tests
        name: Task 12 RED admin tests
        if: steps.prepare.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @darknetra/web test -- src/features/admin 2>&1 | tee /tmp/task12-admin-tests.log
      - name: Record Task 12 RED outcome
        if: always()
        env:
          PREPARE: ${{ steps.prepare.outcome }}
          ADMIN_TESTS: ${{ steps.admin_tests.outcome }}
        run: |
          mkdir -p docs/verification
          {
            echo '# Plan 02 Task 12 verification'
            echo
            echo 'RED phase outcomes:'
            echo
            echo "- prepare: ${PREPARE}"
            echo "- focused administration tests: ${ADMIN_TESTS}"
            echo
            echo '```text'
            tail -n 120 /tmp/task12-admin-tests.log 2>/dev/null || true
            echo '```'
          } > docs/verification/plan02-task12-admin.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/verification/plan02-task12-admin.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs: record Plan 02 Task 12 RED outcome [skip ci]'
            git push origin HEAD:testing-codex
          fi
      - name: Require RED before implementation
        if: always()
        env:
          PREPARE: ${{ steps.prepare.outcome }}
          ADMIN_TESTS: ${{ steps.admin_tests.outcome }}
        run: |
          test "$PREPARE" = success
          test "$ADMIN_TESTS" = failure
