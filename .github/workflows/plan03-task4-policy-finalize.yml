name: Plan 03 Task 4 ingestion policy final verification

on:
  push:
    branches: [testing-codex]
    paths:
      - .github/workflows/plan03-task4-policy-finalize.yml

concurrency:
  group: plan03-task4-policy-finalize
  cancel-in-progress: false

permissions:
  contents: write
  statuses: write

jobs:
  verify-and-record:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DARKNETRA_ENVIRONMENT: development
      DARKNETRA_DATABASE_URL: postgresql+psycopg://darknetra:darknetra-task4-policy-final@127.0.0.1:5432/darknetra_plan03_task4_policy_final_test
      DARKNETRA_E2E_DATABASE_URL: postgresql+psycopg://darknetra:darknetra-task4-policy-final@127.0.0.1:5432/darknetra_plan03_task4_policy_final_test
      DARKNETRA_REDIS_URL: redis://127.0.0.1:6379/0
      DARKNETRA_WEB_ORIGIN: http://localhost:3000
      DARKNETRA_EVIDENCE_STORE_PATH: /tmp/darknetra-plan03-task4-policy-final
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: darknetra_plan03_task4_policy_final_test
          POSTGRES_USER: darknetra
          POSTGRES_PASSWORD: darknetra-task4-policy-final
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U darknetra -d darknetra_plan03_task4_policy_final_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: testing-codex
          fetch-depth: 0

      - name: Publish run locator
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' >/tmp/status.json
          import json, os
          print(json.dumps({
              "state": "pending",
              "context": "plan03/task4-policy-final",
              "description": f"GitHub Actions run {os.environ['GITHUB_RUN_ID']}",
              "target_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl --fail --silent --show-error --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data @/tmp/status.json \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: '0.12.4'

      - name: Generate runtime-only keys
        run: |
          python - <<'PY'
          import base64, json, os, secrets

          def key() -> str:
              return base64.b64encode(secrets.token_bytes(32)).decode("ascii")

          jwt, field, blind = key(), key(), key()
          for value in (jwt, field, blind):
              print(f"::add-mask::{value}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as out:
              out.write(f"DARKNETRA_JWT_SIGNING_KEY_B64={jwt}\n")
              out.write(f"DARKNETRA_FIELD_KEY_V1_B64={field}\n")
              out.write(
                  "DARKNETRA_FIELD_KEYRING_B64_JSON="
                  + json.dumps({"v1": field}, separators=(",", ":"))
                  + "\n"
              )
              out.write("DARKNETRA_FIELD_ACTIVE_KEY_VERSION=v1\n")
              out.write(f"DARKNETRA_FIELD_BLIND_INDEX_KEY_B64={blind}\n")
          PY

      - name: Install frozen workspace and migrate
        run: |
          uv sync --all-packages --dev --frozen
          uv run alembic -c apps/api/alembic.ini upgrade head

      - name: Verify policy and regressions
        run: |
          uv run ruff check .
          uv run pytest -q apps/api/tests/unit/policy/test_ingestion.py \
            | tee /tmp/task4-policy-focused.log
          uv run pytest -q | tee /tmp/task4-policy-full.log
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config >/dev/null

      - name: Verify fail-closed policy surface
        run: |
          uv run python - <<'PY'
          from datetime import UTC, datetime

          from pydantic import ValidationError

          from darknetra_api.policy.ingestion import (
              EvidenceSourceMetadata,
              IngestionLimits,
              MediaTypeMismatch,
              UnsupportedMediaType,
              detect_media_type,
          )

          assert IngestionLimits().max_upload_bytes == 100 * 1024 * 1024
          assert detect_media_type(b"%PDF-1.7\n").parser_family == "pdf"
          for payload in (b"", b"\x7fELFrest", b"MZrest", b"#!/bin/sh\n"):
              try:
                  detect_media_type(payload)
              except UnsupportedMediaType:
                  pass
              else:
                  raise AssertionError(f"unsafe payload was accepted: {payload[:8]!r}")
          try:
              detect_media_type(b"%PDF-1.7\n", declared_media_type="image/png")
          except MediaTypeMismatch:
              pass
          else:
              raise AssertionError("MIME mismatch was accepted")
          try:
              EvidenceSourceMetadata(
                  source_class="PUBLIC_OBSERVATION",
                  source_type="authorized.fixture",
                  acquisition_method="authorized_import",
                  captured_at=datetime.now(UTC),
                  original_timezone="UTC",
              )
          except ValidationError:
              pass
          else:
              raise AssertionError("governed source was accepted without authority_reference")
          PY

      - name: Record verification and remove one-shot policy workflows
        run: |
          source_sha="$(git rev-parse HEAD)"
          mkdir -p docs/verification
          cat > docs/verification/plan03-task4-ingestion-policy.md <<EOF
          # Plan 03 Task 4 — fail-closed ingestion policy verification

          - **Verified source:** \`${source_sha}\`
          - **Observed (UTC):** \`$(date -u +'%Y-%m-%dT%H:%M:%SZ')\`
          - **Runner:** GitHub Actions \`ubuntu-latest\`
          - **TDD RED evidence:** workflow run \`32261195196\` failed before production code existed with \`ingestion policy module is not implemented\`.

          | GREEN gate | Outcome |
          |---|---|
          | Frozen Python workspace | success |
          | Alembic upgrade | success |
          | Ruff | success |
          | Focused ingestion-policy suite | success |
          | Complete Python regression suite | success |
          | Docker Compose validation | success |
          | Independent fail-closed policy smoke | success |

          ## Verified boundary

          - Default artifact limit is 100 MiB; the absolute configurable ceiling is 500 MiB.
          - \`PUBLIC_OBSERVATION\` and \`AUTHORIZED_IMPORT\` require an authority reference.
          - Capture timestamps must be timezone-aware and unknown metadata fields are rejected.
          - Detection uses bytes rather than caller filenames.
          - Empty, NUL-bearing, non-UTF-8, ELF, PE and shebang executable payloads fail closed.
          - Concrete MIME declarations must match detected bytes.
          - Approved parser families are PDF, image, ZIP archive, WARC, WARC/GZIP candidate, HTML, JSON, CSV and UTF-8 text.
          EOF

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/verification/plan03-task4-ingestion-policy.md
          for workflow in \
            .github/workflows/plan03-task4-policy.yml \
            .github/workflows/plan03-task4-policy-green.yml \
            .github/workflows/plan03-task4-policy-v2.yml \
            .github/workflows/plan03-task4-policy-finalize.yml; do
            test ! -f "$workflow" || git rm "$workflow"
          done
          git commit -m 'docs: verify Task 4 ingestion policy [skip ci]'
          git pull --rebase origin testing-codex
          git push origin HEAD:testing-codex

      - name: Publish terminal status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python - <<'PY' >/tmp/status.json
          import json, os
          success = os.environ["JOB_STATUS"] == "success"
          print(json.dumps({
              "state": "success" if success else "failure",
              "context": "plan03/task4-policy-final",
              "description": "Task 4 policy passed" if success else "Task 4 policy failed",
              "target_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl --fail --silent --show-error --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data @/tmp/status.json \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null
