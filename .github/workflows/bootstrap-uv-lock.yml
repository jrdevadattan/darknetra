name: Bootstrap uv lock

on:
  push:
    branches: [testing-codex]
    paths:
      - pyproject.toml
      - .python-version
      - .github/workflows/bootstrap-uv-lock.yml

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: testing-codex
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: '0.12.4'
      - name: Generate and verify lock
        run: |
          uv lock
          uv sync --dev
          uv run pytest tests/repo -v
      - name: Commit generated lock
        run: |
          if git diff --quiet -- uv.lock; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uv.lock
          git commit -m 'chore: lock Python workspace [skip ci]'
          git push origin HEAD:testing-codex
