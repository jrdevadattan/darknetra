name: Export repository artifact

on:
  push:
    branches: [testing-codex]
    paths:
      - .github/workflows/export-artifact.yml

permissions:
  contents: write

env:
  SNAPSHOT_NAME: darknetra-working-tree

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: testing-codex
          fetch-depth: 0
      - name: Create tracked working-tree archive
        run: git archive --format=tar.gz --output=/tmp/darknetra-working-tree.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: darknetra-working-tree
          path: /tmp/darknetra-working-tree.tar.gz
          if-no-files-found: error
          retention-days: 1
      - name: Record run ID and remove one-shot workflow
        run: |
          mkdir -p docs/verification
          printf '%s\n' '${{ github.run_id }}' > docs/verification/export-artifact-run-id.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/verification/export-artifact-run-id.txt
          git rm .github/workflows/export-artifact.yml
          git commit -m 'chore: record temporary snapshot artifact [skip ci]'
          git push origin HEAD:testing-codex
