              fireEvent.click(screen.getByRole('button', { name: 'Preserve original' }))
              expect(await screen.findByText('Authority reference is required for this source class.')).toBeInTheDocument()
            })

            it('preserves an upload, reports delivery state, and refreshes the list', async () => {
              const fetchMock = vi
                .fn()
                .mockImplementationOnce(() => response({ items: [], next_cursor: null }))
                .mockImplementationOnce(() =>
