                  .mockImplementationOnce(() => response({ evidence, parents: [], children: [], custody: [] }))
                  .mockImplementationOnce(() =>
                    response({
                      evidence_id: evidence.id,
                      case_id: evidence.case_id,
                      outcome: 'MISMATCH',
                      state: 'INTEGRITY_MISMATCH',
                      expected_sha256: evidence.sha256,
                      observed_sha256: 'c'.repeat(64),
                      expected_sha512: null,
                      observed_sha512: null,
                      size_bytes: 8,
