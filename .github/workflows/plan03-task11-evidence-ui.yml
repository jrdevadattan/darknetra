              )
              render(<EvidenceWorkspace caseId={evidence.case_id} />)
              await screen.findByText('synthetic.fixture')
              fireEvent.click(screen.getByRole('button', { name: 'Review evidence synthetic.fixture' }))
              await screen.findByRole('dialog', { name: 'Evidence review' })
              fireEvent.click(screen.getByRole('button', { name: 'Verify stored bytes' }))
              expect(await screen.findByText('Integrity mismatch detected — downloads and processing are blocked.')).toBeInTheDocument()
            })
          })
