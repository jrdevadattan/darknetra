name: Plan 03 Task 11 investigator evidence workspace TDD

on:
  push:
    branches: [testing-codex]
    paths:
      - .github/workflows/plan03-task11-evidence-ui.yml

permissions:
  contents: write

jobs:
  red-green:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: testing-codex
          fetch-depth: 0

      - name: Require safe evidence read checkpoint
        run: test -f docs/verification/plan03-task10-evidence-reads.md

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install locked frontend workspace
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          pnpm install --frozen-lockfile

      - name: Write API and investigator-workspace contracts first
        run: |
          mkdir -p apps/web/src/features/evidence
          cat > apps/web/src/features/evidence/evidence-api.test.ts <<'TS'
          import { afterEach, describe, expect, it, vi } from 'vitest'
          import {
            EvidenceApiError,
            buildEvidenceContentUrl,
            buildEvidencePreviewUrl,
            fetchEvidenceDetail,
            listEvidence,
            uploadEvidence,
            verifyEvidenceIntegrity,
          } from './evidence-api'

          afterEach(() => {
            vi.unstubAllGlobals()
          })

          describe('evidence API client', () => {
            it('encodes list filters and sends credentialed no-store GET', async () => {
              const fetchMock = vi.fn().mockResolvedValue({
                ok: true,
                json: async () => ({ items: [], next_cursor: null }),
              })
              vi.stubGlobal('fetch', fetchMock)
              await listEvidence('case id', {
                state: 'READY',
                sourceClass: 'SYNTHETIC',
                cursor: 'cursor+/=',
                limit: 25,
              })
              const [url, init] = fetchMock.mock.calls[0]
              expect(String(url)).toContain('/api/v1/cases/case%20id/evidence?')
              expect(String(url)).toContain('state=READY')
              expect(String(url)).toContain('source_class=SYNTHETIC')
              expect(String(url)).toContain('cursor=cursor%2B%2F%3D')
              expect(init).toMatchObject({
                method: 'GET',
                credentials: 'include',
                cache: 'no-store',
              })
            })

            it('sends multipart without manually setting Content-Type and includes CSRF', async () => {
              const fetchMock = vi.fn().mockResolvedValue({
                ok: true,
                json: async () => ({
                  evidence: { id: 'e1' },
                  job_id: 'j1',
                  job_state: 'PENDING',
                  delivery_state: 'QUEUED',
                }),
              })
              vi.stubGlobal('fetch', fetchMock)
              Object.defineProperty(document, 'cookie', {
                configurable: true,
                value: 'darknetra_csrf=csrf-value',
              })
              await uploadEvidence('case-1', new File(['safe'], 'safe.txt', { type: 'text/plain' }), {
                sourceClass: 'SYNTHETIC',
                sourceType: 'synthetic.fixture',
                acquisitionMethod: 'authorized_test_generation',
                capturedAt: '2026-01-01T00:00:00.000Z',
                originalTimezone: 'UTC',
              })
              const [, init] = fetchMock.mock.calls[0]
              expect(init.method).toBe('POST')
              expect(init.body).toBeInstanceOf(FormData)
              expect(new Headers(init.headers).get('content-type')).toBeNull()
              expect(new Headers(init.headers).get('x-csrf-token')).toBe('csrf-value')
              expect(init.credentials).toBe('include')
            })

            it('maps structured API failures without exposing raw HTML', async () => {
              vi.stubGlobal(
                'fetch',
                vi.fn().mockResolvedValue({
                  ok: false,
                  status: 413,
                  headers: new Headers({ 'content-type': 'application/json' }),
                  json: async () => ({ detail: 'declared upload size exceeds policy' }),
                }),
