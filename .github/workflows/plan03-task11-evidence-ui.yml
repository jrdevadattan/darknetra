              await expect(fetchEvidenceDetail('case', 'evidence')).rejects.toEqual(
                expect.objectContaining<EvidenceApiError>({
                  status: 413,
                  message: 'declared upload size exceeds policy',
                }),
              )
            })

            it('builds encoded content and preview URLs', () => {
              expect(buildEvidenceContentUrl('case/a', 'evidence+b')).toContain(
                '/cases/case%2Fa/evidence/evidence%2Bb/content',
              )
              expect(buildEvidencePreviewUrl('case/a', 'parent', 'child')).toContain(
                '/cases/case%2Fa/evidence/parent/derivatives/child/preview',
              )
            })

            it('posts integrity verification with CSRF and credentials', async () => {
              const fetchMock = vi.fn().mockResolvedValue({
                ok: true,
                json: async () => ({ outcome: 'VERIFIED', state: 'READY' }),
              })
              vi.stubGlobal('fetch', fetchMock)
              Object.defineProperty(document, 'cookie', {
                configurable: true,
                value: 'darknetra_csrf=csrf-verify',
              })
              await verifyEvidenceIntegrity('case', 'evidence')
              const [, init] = fetchMock.mock.calls[0]
              expect(init.method).toBe('POST')
              expect(new Headers(init.headers).get('x-csrf-token')).toBe('csrf-verify')
              expect(init.credentials).toBe('include')
            })
          })
