name: Plan 02 Task 14 verification environment fix

on:
  push:
    branches: [testing-codex]
    paths:
      - .github/workflows/plan02-task14-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: testing-codex
          fetch-depth: 0
      - name: Align build-version contract and retrigger final gate
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/plan02-task14.yml')
          text = workflow.read_text(encoding='utf-8')
          old = '      DARKNETRA_BUILD_VERSION: plan02-final-verification\n'
          new = '      DARKNETRA_BUILD_VERSION: dev\n'
          if old not in text:
              if new in text:
                  raise SystemExit(0)
              raise SystemExit('expected build-version line was not found')
          workflow.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/plan02-task14.yml
          git commit -m 'ci: align Plan 02 health contract verification'
          git push origin HEAD:testing-codex
