name: Plan 02 Task 11 authenticated session UX

# RED gate: persist the focused auth-test outcome before production implementation.
on:
  push:
    branches: [testing-codex]
    paths:
      - .github/workflows/plan02-task11.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: testing-codex
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: prepare
        name: Prepare pnpm
        continue-on-error: true
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          pnpm install --frozen-lockfile
      - id: auth_tests
        name: Task 11 RED auth tests
        if: steps.prepare.outcome == 'success'
        continue-on-error: true
        run: pnpm --filter @darknetra/web test -- src/features/auth
      - name: Record Task 11 RED outcome
        if: always()
        env:
          PREPARE: ${{ steps.prepare.outcome }}
          AUTH_TESTS: ${{ steps.auth_tests.outcome }}
        run: |
          mkdir -p docs/verification
          cat > docs/verification/plan02-task11-auth.md <<EOF
          # Plan 02 Task 11 verification

          RED phase outcomes:

          - prepare: ${PREPARE}
          - focused auth tests: ${AUTH_TESTS}
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/verification/plan02-task11-auth.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs: record Plan 02 Task 11 RED outcome [skip ci]'
            git push origin HEAD:testing-codex
          fi
      - name: Require RED before implementation
        if: always()
        env:
          PREPARE: ${{ steps.prepare.outcome }}
          AUTH_TESTS: ${{ steps.auth_tests.outcome }}
        run: |
          test "$PREPARE" = success
          test "$AUTH_TESTS" = failure
