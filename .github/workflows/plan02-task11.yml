name: Plan 02 Task 11 authenticated session UX

# GREEN component gate: persist each outcome, then fail if any required frontend check is non-green.
on:
  push:
    branches: [testing-codex]
    paths:
      - .github/workflows/plan02-task11.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: testing-codex
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - id: prepare
        name: Prepare pnpm
        continue-on-error: true
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          pnpm install --frozen-lockfile

      - id: auth_tests
        name: Focused auth tests
        if: steps.prepare.outcome == 'success'
        continue-on-error: true
        run: pnpm --filter @darknetra/web test -- src/features/auth

      - id: lint
        name: Biome lint
        if: steps.prepare.outcome == 'success'
        continue-on-error: true
        run: pnpm --filter @darknetra/web lint

      - id: typecheck
        name: TypeScript typecheck
        if: steps.prepare.outcome == 'success'
        continue-on-error: true
        run: pnpm --filter @darknetra/web typecheck

      - id: full_tests
        name: Full frontend tests
        if: steps.prepare.outcome == 'success'
        continue-on-error: true
        run: pnpm --filter @darknetra/web test

      - id: build
        name: Production build
        if: steps.prepare.outcome == 'success'
        continue-on-error: true
        run: pnpm --filter @darknetra/web build

      - name: Persist Task 11 diagnostic record
        if: always()
        env:
          PREPARE: ${{ steps.prepare.outcome }}
          AUTH_TESTS: ${{ steps.auth_tests.outcome }}
          LINT: ${{ steps.lint.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          FULL_TESTS: ${{ steps.full_tests.outcome }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          mkdir -p docs/verification
          cat > docs/verification/plan02-task11-auth.md <<EOF
          # Plan 02 Task 11 verification

          GitHub Actions outcomes for authenticated session UX:

          - prepare: ${PREPARE}
          - focused auth tests: ${AUTH_TESTS}
          - Biome lint: ${LINT}
          - TypeScript typecheck: ${TYPECHECK}
          - full frontend tests: ${FULL_TESTS}
          - Next.js production build: ${BUILD}
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/verification/plan02-task11-auth.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs: record Plan 02 Task 11 verification [skip ci]'
            git push origin HEAD:testing-codex
          fi

      - name: Enforce Task 11 component gate
        if: always()
        env:
          PREPARE: ${{ steps.prepare.outcome }}
          AUTH_TESTS: ${{ steps.auth_tests.outcome }}
          LINT: ${{ steps.lint.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          FULL_TESTS: ${{ steps.full_tests.outcome }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          test "$PREPARE" = success
          test "$AUTH_TESTS" = success
          test "$LINT" = success
          test "$TYPECHECK" = success
          test "$FULL_TESTS" = success
          test "$BUILD" = success
