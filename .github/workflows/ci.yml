name: CI

on:
  push:
    branches: [main, testing-codex]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      DARKNETRA_DATABASE_URL: postgresql+psycopg://darknetra:darknetra-ci@127.0.0.1:5432/darknetra
      DARKNETRA_WEB_ORIGIN: http://localhost:3000
      DARKNETRA_ENVIRONMENT: development
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: darknetra
          POSTGRES_USER: darknetra
          POSTGRES_PASSWORD: darknetra-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U darknetra -d darknetra"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: '0.12.4'
      - name: Generate runtime-only auth signing key
        run: |
          KEY="$(python - <<'PY'
          import base64
          import secrets
          print(base64.b64encode(secrets.token_bytes(32)).decode("ascii"))
          PY
          )"
          echo "::add-mask::$KEY"
          echo "DARKNETRA_JWT_SIGNING_KEY_B64=$KEY" >> "$GITHUB_ENV"
      - name: Sync Python workspace
        run: uv sync --all-packages --dev --frozen
      - name: Migrate database
        run: uv run alembic -c apps/api/alembic.ini upgrade head
      - name: Ruff
        run: uv run ruff check .
      - name: Pytest
        run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter @darknetra/web lint
      - name: Typecheck
        run: pnpm --filter @darknetra/web typecheck
      - name: Unit tests
        run: pnpm --filter @darknetra/web test
      - name: Production build
        run: pnpm --filter @darknetra/web build

  docker:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml config >/dev/null
      - name: Build Compose images
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml build
