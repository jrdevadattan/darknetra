          # Evidence Vault backup and reconciliation runbook

          ## Non-destructive reconciliation

          ```bash
          uv run python scripts/evidence_vault_maintenance.py reconcile
          ```

          The report distinguishes referenced, present, missing, mismatched and unreferenced content-addressed objects. It never deletes an object. An unreferenced object can be the safe result of a database rollback after verified promotion; removal requires a future legal-hold-aware, explicitly authorized retention process.

          ## Case-scoped verified backup

          ```bash
          uv run python scripts/evidence_vault_maintenance.py backup-case <case-uuid> /secure/offline/destination
          uv run python scripts/evidence_vault_maintenance.py verify-backup /secure/offline/destination
          ```

          The destination must be empty. Every object is independently verified before and after copying, written through a staging path, atomically promoted and made read-only. The deterministic manifest includes safe case, manifest, lineage and custody fields. It deliberately excludes encrypted envelopes, blind indexes, object-store keys, credentials, host paths and plaintext sensitive metadata.

          Store the completed backup on access-controlled encrypted media according to police retention and chain-of-custody policy. A backup is not a substitute for database backups, encryption-key escrow or a tested full-system disaster-recovery procedure.
