name: Resume DARKNETRA Plans 03 and 04

on:
  push:
    branches: [testing-codex]
    paths:
      - .github/workflows/resume-plan03-plan04.yml

concurrency:
  group: darknetra-plan03-plan04-completion
  cancel-in-progress: false

permissions:
  contents: write
  actions: read
  models: read
  statuses: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      DARKNETRA_ENVIRONMENT: development
      DARKNETRA_DATABASE_URL: postgresql+psycopg://darknetra:darknetra-plan34-resume@127.0.0.1:5432/darknetra_plan34_resume
      DARKNETRA_E2E_DATABASE_URL: postgresql+psycopg://darknetra:darknetra-plan34-resume@127.0.0.1:5432/darknetra_plan34_resume
      DARKNETRA_REDIS_URL: redis://127.0.0.1:6379/0
      DARKNETRA_WEB_ORIGIN: http://localhost:3000
      DARKNETRA_EVIDENCE_STORE_PATH: /tmp/darknetra-plan34-resume-evidence
      GH_MODELS_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      CI: 'true'
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: darknetra_plan34_resume
          POSTGRES_USER: darknetra
          POSTGRES_PASSWORD: darknetra-plan34-resume
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U darknetra -d darknetra_plan34_resume"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: testing-codex
          fetch-depth: 0

      - name: Record live run identifier
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cat > docs/verification/PLAN34_RESUME_STATUS.md <<EOF
          # DARKNETRA Plans 03 and 04 — resumed execution status

          - **Outcome:** IN_PROGRESS
          - **Branch:** \`testing-codex\`
          - **Run:** \`${GITHUB_RUN_ID}\`
          - **Run attempt:** \`${GITHUB_RUN_ATTEMPT}\`
          - **Starting source:** \`$(git rev-parse HEAD)\`
          - **Started:** \`$(date -u +'%Y-%m-%dT%H:%M:%SZ')\`
          - **Completion claimed:** \`false\`

          The replacement push-only gate is running with Node 24 and pnpm 10.15.0 installed before dependency caching or installation. Completion remains unclaimed until all canonical records are committed.
          EOF
          git add docs/verification/PLAN34_RESUME_STATUS.md
          git commit -m 'docs: record live Plans 03 and 04 resume run [skip ci]' || true
          git pull --rebase origin testing-codex
          git push origin HEAD:testing-codex

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: '0.12.4'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable pinned pnpm before use
        id: pnpm
        run: |
          set -euo pipefail
          if command -v corepack >/dev/null 2>&1; then
            corepack enable
            corepack prepare pnpm@10.15.0 --activate
          else
            npm install --global pnpm@10.15.0
          fi
          node --version | tee /tmp/node-version.log
          pnpm --version | tee /tmp/pnpm-version.log
          test "$(node -p 'process.versions.node.split(`.`)[0]')" = 24
          test "$(pnpm --version)" = 10.15.0

      - name: Install native parser and validation tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            gnupg \
            libmagic1 \
            libmagic-dev \
            ca-certificates

      - name: Generate runtime-only cryptographic keys
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import secrets

          def key() -> str:
              return base64.b64encode(secrets.token_bytes(32)).decode('ascii')

          jwt, field, blind = key(), key(), key()
          for value in (jwt, field, blind):
              print(f'::add-mask::{value}')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write(f'DARKNETRA_JWT_SIGNING_KEY_B64={jwt}\n')
              output.write(f'DARKNETRA_FIELD_KEY_V1_B64={field}\n')
              output.write(
                  'DARKNETRA_FIELD_KEYRING_B64_JSON='
                  + json.dumps({'v1': field}, separators=(',', ':'))
                  + '\n'
              )
              output.write('DARKNETRA_FIELD_ACTIVE_KEY_VERSION=v1\n')
              output.write(f'DARKNETRA_FIELD_BLIND_INDEX_KEY_B64={blind}\n')
          PY

      - name: Install locked repository dependencies
        id: dependencies
        run: |
          set -euo pipefail
          uv sync --all-packages --dev --frozen
          pnpm install --frozen-lockfile
          uv run alembic -c apps/api/alembic.ini upgrade head

      - name: Harden the guarded implementation runner
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/plan_completion_agent.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '    "evaluation/",\n    "datasets/synthetic/",',
              '    "datasets/synthetic/",',
          )
          text = text.replace(
              '            "response_format": {"type": "json_object"},\n',
              '',
          )
          text = text.replace(
              '"pnpm --filter @darknetra/web test -- --run"',
              '"pnpm --filter @darknetra/web test"',
          )
          text = text.replace(
              '            return decoded\n',
              '            time.sleep(4)\n            return decoded\n',
          )
          text = text.replace(
              'def model_request(system: str, user: str, *, attempts: int = 5)',
              'def model_request(system: str, user: str, *, attempts: int = 8)',
          )
          text = text.replace(
              '            time.sleep(min(20, 2 ** attempt))',
              '            time.sleep(min(75, 3 ** attempt))',
          )
          path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile scripts/plan_completion_agent.py

      - name: Execute test-first Plan 03 and Plan 04 batches
        id: implementation
        run: python scripts/plan_completion_agent.py

      - name: Refresh authoritative branch after checkpoint pushes
        run: |
          git fetch origin testing-codex
          git reset --hard origin/testing-codex

      - name: Run fresh reversible migration gate
        id: migrations
        run: |
          set -euo pipefail
          uv sync --all-packages --dev --frozen
          uv run alembic -c apps/api/alembic.ini upgrade head
          uv run alembic -c apps/api/alembic.ini downgrade base
          uv run alembic -c apps/api/alembic.ini upgrade head
          uv run alembic -c apps/api/alembic.ini current | tee /tmp/alembic-current.log

      - name: Run complete backend gate
        id: backend
        run: |
          set -o pipefail
          uv run ruff check . | tee /tmp/ruff.log
          uv run pytest -q | tee /tmp/pytest.log

      - name: Run complete frontend gate
        id: frontend
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile
          pnpm --filter @darknetra/web lint | tee /tmp/web-lint.log
          pnpm --filter @darknetra/web typecheck | tee /tmp/web-typecheck.log
          pnpm --filter @darknetra/web test | tee /tmp/web-test.log
          pnpm --filter @darknetra/web build | tee /tmp/web-build.log

      - name: Run multilingual extraction evaluation
        id: evaluation
        run: |
          set -euo pipefail
          test -f evaluation/extraction/score.py
          rm -rf docs/verification/extraction-evaluation
          mkdir -p docs/verification/extraction-evaluation
          uv run python evaluation/extraction/score.py \
            --dataset datasets/synthetic/extraction \
            --output docs/verification/extraction-evaluation \
            | tee /tmp/extraction-evaluation.log
          test -n "$(find docs/verification/extraction-evaluation -type f -print -quit)"

      - name: Run Evidence Vault adversarial and integrity suites
        id: security
        run: |
          set -euo pipefail
          mapfile -t security_files < <(
            find apps/api/tests -type f \
              \( -path '*/security/*' -o -name '*integrity*' -o -name '*archive*' -o -name '*ingestion*' \) \
              -print | sort
          )
          test "${#security_files[@]}" -gt 0
          uv run pytest -q "${security_files[@]}" | tee /tmp/security.log

      - name: Validate Compose and build application images
        id: containers
        run: |
          set -o pipefail
          docker compose -f docker-compose.yml config >/tmp/compose-base.yml
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config >/tmp/compose-dev.yml
          docker compose -f docker-compose.yml build api worker web | tee /tmp/docker-build.log

      - name: Run repository smoke test
        id: smoke
        run: |
          set -o pipefail
          if test -f scripts/smoke.sh; then
            bash scripts/smoke.sh | tee /tmp/smoke.log
          else
            echo 'scripts/smoke.sh is absent; integration tests and image builds are the smoke boundary.' | tee /tmp/smoke.log
          fi

      - name: Run browser suite when configured
        id: browser
        run: |
          set -o pipefail
          if node -e "const p=require('./apps/web/package.json'); process.exit(p.scripts && p.scripts['test:e2e'] ? 0 : 1)"; then
            pnpm --filter @darknetra/web exec playwright install --with-deps chromium
            pnpm --filter @darknetra/web test:e2e | tee /tmp/e2e.log
          else
            echo 'No test:e2e script configured by the package contract.' | tee /tmp/e2e.log
          fi

      - name: Create canonical completion records only after every gate
        id: certify
        run: |
          set -euo pipefail
          for marker in \
            docs/verification/plan03-gap-audit.md \
            docs/verification/plan04-foundation.md \
            docs/verification/plan04-indicators.md \
            docs/verification/plan04-pipeline.md \
            docs/verification/plan04-product.md \
            docs/verification/plan04-final-docs.md; do
            test -f "$marker"
            grep -q 'Outcome: success' "$marker"
          done

          VERIFIED_SOURCE="$(git rev-parse HEAD)"
          OBSERVED="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          PYTEST_SUMMARY="$(tail -n 6 /tmp/pytest.log | tr '\n' ' ' | sed 's/[[:space:]]\+/ /g')"
          WEB_SUMMARY="$(tail -n 8 /tmp/web-test.log | tr '\n' ' ' | sed 's/[[:space:]]\+/ /g')"
          SECURITY_SUMMARY="$(tail -n 6 /tmp/security.log | tr '\n' ' ' | sed 's/[[:space:]]\+/ /g')"
          EVALUATION_SUMMARY="$(tail -n 12 /tmp/extraction-evaluation.log | tr '\n' ' ' | sed 's/[[:space:]]\+/ /g')"

          cat > docs/verification/plan-03-evidence-vault-ingestion.md <<EOF
          # Plan 03 — Evidence Vault and safe ingestion verification

          - **Verified source:** \`${VERIFIED_SOURCE}\`
          - **Observed at:** \`${OBSERVED}\`
          - **Branch:** \`testing-codex\`
          - **Outcome:** success

          Fresh verification covered immutable content-addressed originals, provenance and custody, encrypted sensitive metadata, approved safe parsers, idempotent durable jobs, integrity mismatch handling, case-scoped access, investigator UI, adversarial fixtures, migration reversibility, Compose validation and built application images.

          - Complete backend suite: ${PYTEST_SUMMARY}
          - Explicit security/integrity suite: ${SECURITY_SUMMARY}
          EOF

          cat > docs/verification/plan-04-extraction-indicators.md <<EOF
          # Plan 04 — multilingual extraction and deterministic indicators verification

          - **Verified source:** \`${VERIFIED_SOURCE}\`
          - **Observed at:** \`${OBSERVED}\`
          - **Branch:** \`testing-codex\`
          - **Outcome:** success

          Fresh verification covered evidence-linked observations, exact source spans, English/Hindi/Punjabi/Hinglish normalization, bounded transliteration, deterministic commercial/contact extraction, isolated OpenPGP inspection, Bitcoin/Ethereum/Monero validation, taxonomy, offline semantic fallback, review candidates, case-scoped APIs, investigator UI and synthetic per-language evaluation.

          - Frontend suite: ${WEB_SUMMARY}
          - Evaluation: ${EVALUATION_SUMMARY}
          EOF

          cat > docs/verification/plans-03-04-release-gate.md <<EOF
          # DARKNETRA Plans 03 and 04 release gate

          - **Verified source:** \`${VERIFIED_SOURCE}\`
          - **Observed at:** \`${OBSERVED}\`
          - **Outcome:** success

          | Gate | Result |
          |---|---|
          | Node 24 and pnpm 10.15.0 preflight | success |
          | Alembic upgrade/downgrade/re-upgrade | success |
          | Ruff | success |
          | Complete Python suite | success |
          | Explicit adversarial/integrity suite | success |
          | Frontend lint/typecheck/tests/build | success |
          | Multilingual extraction evaluation | success |
          | Base/development Compose validation | success |
          | API, worker and web image builds | success |
          | Repository smoke boundary | success |
          | Browser suite | success or explicitly absent per package contract |
          EOF

          cat > docs/verification/PLANS_03_04_COMPLETE.md <<EOF
          # DARKNETRA Plans 03 and 04 completion certificate

          - **Outcome:** COMPLETE
          - **Verified source:** \`${VERIFIED_SOURCE}\`
          - **Observed at:** \`${OBSERVED}\`
          - **Canonical run:** \`${GITHUB_RUN_ID}\`
          - **Branch:** \`testing-codex\`

          This certificate was generated only after the fresh canonical release gate succeeded. Indicator observations remain evidence-linked investigative leads, not proof of ownership, identity or guilt. Demonstrations and evaluation fixtures are synthetic or explicitly authorized.
          EOF

          python - <<'PY'
          from pathlib import Path

          verified_source = __import__('subprocess').check_output(
              ['git', 'rev-parse', 'HEAD'], text=True
          ).strip()
          observed = __import__('datetime').datetime.now(
              __import__('datetime').UTC
          ).strftime('%Y-%m-%dT%H:%M:%SZ')

          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          start = '<!-- PLAN34_VERIFIED_START -->'
          end = '<!-- PLAN34_VERIFIED_END -->'
          block = f'''{start}
## Verified Evidence Vault and multilingual extraction milestones

Plans 03 and 04 were verified on `testing-codex` at `{verified_source}`. The release gate covers content-addressed immutable evidence, provenance and custody, safe bounded ingestion, integrity checks, authorized investigator access, evidence-linked multilingual entity observations, deterministic indicator validation, the investigator UI, synthetic evaluation, reversible migrations, Compose validation, and API/worker/web image builds.

Install with the pinned Node 24 / pnpm 10.15.0 and Python 3.12 / uv toolchains described in this repository. PostgreSQL is authoritative; Redis and Celery provide transient delivery. The project does not perform credential bypass, seller contact, purchases, platform decryption bypass, or unrestricted live collection.

Verified at `{observed}`.
{end}'''
          if start in readme and end in readme:
              before, rest = readme.split(start, 1)
              _, after = rest.split(end, 1)
              readme = before.rstrip() + '\n\n' + block + after
          else:
              readme = readme.rstrip() + '\n\n' + block + '\n'
          readme_path.write_text(readme, encoding='utf-8')

          ledger = Path('docs/verification/plan03-execution-ledger.md')
          if ledger.exists():
              lines = ledger.read_text(encoding='utf-8').splitlines()
              for task in range(1, 14):
                  value = (
                      f'- Task {task}: complete — verified by '
                      '`docs/verification/plan-03-evidence-vault-ingestion.md`.'
                  )
                  for index, line in enumerate(lines):
                      if line.startswith(f'- Task {task}:'):
                          lines[index] = value
                          break
                  else:
                      lines.append(value)
              ledger.write_text('\n'.join(lines).rstrip() + '\n', encoding='utf-8')

          Path('docs/verification/CURRENT_PLAN34_STATUS.md').write_text(
              '# DARKNETRA Plans 03 and 04 — authoritative current status\n\n'
              '- **Outcome:** COMPLETE\n'
              f'- **Observed:** `{observed}`\n'
              f'- **Verified source:** `{verified_source}`\n'
              f'- **Canonical run:** `{__import__("os").environ["GITHUB_RUN_ID"]}`\n'
              '- **Canonical release record present:** `true`\n'
              '- **Independent certificate present:** `true`\n'
              '- **Verified README block present:** `true`\n',
              encoding='utf-8',
          )
          Path('docs/verification/PLAN34_RESUME_STATUS.md').write_text(
              '# DARKNETRA Plans 03 and 04 — resumed execution status\n\n'
              '- **Outcome:** COMPLETE\n'
              f'- **Observed:** `{observed}`\n'
              f'- **Verified source:** `{verified_source}`\n'
              f'- **Canonical run:** `{__import__("os").environ["GITHUB_RUN_ID"]}`\n'
              '- **Completion claimed:** `true`\n',
              encoding='utf-8',
          )
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/resume-plan03-plan04.yml
          git add -A
          git commit -m 'docs: certify Plans 03 and 04 completion'
          git pull --rebase origin testing-codex
          git push origin HEAD:testing-codex

      - name: Record actionable failure diagnostic
        if: failure()
        env:
          PPNPM: ${{ steps.pnpm.outcome }}
          DEPENDENCIES: ${{ steps.dependencies.outcome }}
          IMPLEMENTATION: ${{ steps.implementation.outcome }}
          MIGRATIONS: ${{ steps.migrations.outcome }}
          BACKEND: ${{ steps.backend.outcome }}
          FRONTEND: ${{ steps.frontend.outcome }}
          EVALUATION: ${{ steps.evaluation.outcome }}
          SECURITY: ${{ steps.security.outcome }}
          CONTAINERS: ${{ steps.containers.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
          CERTIFY: ${{ steps.certify.outcome }}
        run: |
          set -euo pipefail
          git fetch origin testing-codex
          git reset --hard origin/testing-codex
          mkdir -p docs/verification
          {
            echo '# Plans 03 and 04 resumed execution failure'
            echo
            echo "- Run: \`${GITHUB_RUN_ID}\`"
            echo "- Attempt: \`${GITHUB_RUN_ATTEMPT}\`"
            echo "- Source after checkpoint refresh: \`$(git rev-parse HEAD)\`"
            echo "- Observed: \`$(date -u +'%Y-%m-%dT%H:%M:%SZ')\`"
            echo "- pnpm preflight: \`${PPNPM}\`"
            echo "- dependency install: \`${DEPENDENCIES}\`"
            echo "- implementation batches: \`${IMPLEMENTATION}\`"
            echo "- migrations: \`${MIGRATIONS}\`"
            echo "- backend: \`${BACKEND}\`"
            echo "- frontend: \`${FRONTEND}\`"
            echo "- evaluation: \`${EVALUATION}\`"
            echo "- security: \`${SECURITY}\`"
            echo "- containers: \`${CONTAINERS}\`"
            echo "- smoke: \`${SMOKE}\`"
            echo "- browser: \`${BROWSER}\`"
            echo "- certification: \`${CERTIFY}\`"
            for log in \
              /tmp/node-version.log \
              /tmp/pnpm-version.log \
              /tmp/ruff.log \
              /tmp/pytest.log \
              /tmp/web-lint.log \
              /tmp/web-typecheck.log \
              /tmp/web-test.log \
              /tmp/web-build.log \
              /tmp/extraction-evaluation.log \
              /tmp/security.log \
              /tmp/docker-build.log \
              /tmp/smoke.log \
              /tmp/e2e.log; do
              if test -f "$log"; then
                echo
                echo "## $(basename "$log")"
                echo
                echo '```text'
                tail -n 180 "$log"
                echo '```'
              fi
            done
          } > docs/verification/plans-03-04-resume-failure.md
          cat > docs/verification/PLAN34_RESUME_STATUS.md <<EOF
          # DARKNETRA Plans 03 and 04 — resumed execution status

          - **Outcome:** BLOCKED
          - **Run:** \`${GITHUB_RUN_ID}\`
          - **Attempt:** \`${GITHUB_RUN_ATTEMPT}\`
          - **Observed:** \`$(date -u +'%Y-%m-%dT%H:%M:%SZ')\`
          - **Branch head:** \`$(git rev-parse HEAD)\`
          - **Completion claimed:** \`false\`

          See \`docs/verification/plans-03-04-resume-failure.md\` for the first failing gate and available log tails.
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/verification/PLAN34_RESUME_STATUS.md docs/verification/plans-03-04-resume-failure.md
          git commit -m 'docs: record resumed Plans 03 and 04 failure [skip ci]' || true
          git pull --rebase origin testing-codex || true
          git push origin HEAD:testing-codex || true
