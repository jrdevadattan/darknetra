name: Record authoritative Plans 03 and 04 status

on:
  push:
    branches: [testing-codex]
    paths:
      - .github/workflows/record-plan34-authoritative-status.yml

permissions:
  contents: write
  actions: read

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: testing-codex
          fetch-depth: 0

      - name: Inspect branch and latest canonical run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin testing-codex
          git reset --hard origin/testing-codex
          RUN_JSON="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/complete-plan03-plan04.yml/runs?branch=testing-codex&per_page=1" --jq '.workflow_runs[0] // {}' 2>/dev/null || echo '{}')"
          RUN_ID="$(jq -r '.id // "none"' <<<"$RUN_JSON")"
          RUN_STATUS="$(jq -r '.status // "none"' <<<"$RUN_JSON")"
          RUN_CONCLUSION="$(jq -r '.conclusion // "none"' <<<"$RUN_JSON")"
          FAILED_STEPS="none"
          if test "$RUN_ID" != none; then
            FAILED_STEPS="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" \
              --jq '[.jobs[].steps[] | select(.conclusion == "failure") | .name] | unique | if length == 0 then ["none"] else . end | join(", ")' \
              2>/dev/null || echo unavailable)"
          fi

          CERT=false
          RELEASE=false
          README_FINAL=false
          test -f docs/verification/PLANS_03_04_COMPLETE.md && CERT=true
          test -f docs/verification/plans-03-04-release-gate.md && grep -q 'Outcome: success' docs/verification/plans-03-04-release-gate.md && RELEASE=true
          grep -q '<!-- PLAN34_VERIFIED_START -->' README.md && README_FINAL=true || true

          if test "$CERT" = true && test "$RELEASE" = true && test "$README_FINAL" = true; then
            OUTCOME=COMPLETE
            EXPLANATION='The canonical release gate, independent completion certificate, and verified README are all present.'
          elif test "$RUN_STATUS" = completed; then
            OUTCOME=BLOCKED
            EXPLANATION='The latest canonical run is terminal but the complete certificate set is absent. Inspect the failed steps below; no completion claim is valid.'
          else
            OUTCOME=IN_PROGRESS
            EXPLANATION='The latest canonical run is not terminal and the complete certificate set is not yet present.'
          fi

          mkdir -p docs/verification
          cat > docs/verification/CURRENT_PLAN34_STATUS.md <<EOF
          # DARKNETRA Plans 03 and 04 — authoritative current status

          - **Outcome:** ${OUTCOME}
          - **Observed:** \`$(date -u +'%Y-%m-%dT%H:%M:%SZ')\`
          - **Branch head:** \`$(git rev-parse HEAD)\`
          - **Latest canonical run:** \`${RUN_ID}\`
          - **Run status:** \`${RUN_STATUS}\`
          - **Run conclusion:** \`${RUN_CONCLUSION}\`
          - **Failed steps:** ${FAILED_STEPS}
          - **Canonical release record present:** \`${RELEASE}\`
          - **Independent certificate present:** \`${CERT}\`
          - **Verified README block present:** \`${README_FINAL}\`

          ${EXPLANATION}
          EOF

      - name: Commit status snapshot and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/verification/CURRENT_PLAN34_STATUS.md
          git rm .github/workflows/record-plan34-authoritative-status.yml
          git commit -m 'docs: record authoritative Plans 03 and 04 status [skip ci]'
          git pull --rebase origin testing-codex
          git push origin HEAD:testing-codex
