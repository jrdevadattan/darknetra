name: Plan 03 Task 9 integrity re-verification TDD

on:
  push:
    branches: [testing-codex]
    paths:
      - .github/workflows/plan03-task9-integrity-service.yml

permissions:
  contents: write

jobs:
  red-green:
    runs-on: ubuntu-latest
    env:
      DARKNETRA_ENVIRONMENT: development
      DARKNETRA_DATABASE_URL: postgresql+psycopg://darknetra:darknetra-task9-integrity@127.0.0.1:5432/darknetra_plan03_task9_integrity
      DARKNETRA_REDIS_URL: redis://127.0.0.1:6379/0
      DARKNETRA_WEB_ORIGIN: http://localhost:3000
      DARKNETRA_EVIDENCE_STORE_PATH: /tmp/darknetra-plan03-task9-integrity
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: darknetra_plan03_task9_integrity
          POSTGRES_USER: darknetra
          POSTGRES_PASSWORD: darknetra-task9-integrity
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U darknetra -d darknetra_plan03_task9_integrity"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: testing-codex
          fetch-depth: 0

      - name: Require completed Task 8
        run: test -f docs/verification/plan03-task8-final.md

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: '0.12.4'

      - name: Generate runtime-only keys
        run: |
          python - <<'PY'
          import base64, json, os, secrets
          def key(): return base64.b64encode(secrets.token_bytes(32)).decode("ascii")
          jwt, field, blind = key(), key(), key()
          for value in (jwt, field, blind): print(f"::add-mask::{value}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as out:
              out.write(f"DARKNETRA_JWT_SIGNING_KEY_B64={jwt}\n")
              out.write(f"DARKNETRA_FIELD_KEY_V1_B64={field}\n")
              out.write("DARKNETRA_FIELD_KEYRING_B64_JSON=" + json.dumps({"v1": field}, separators=(",", ":")) + "\n")
              out.write("DARKNETRA_FIELD_ACTIVE_KEY_VERSION=v1\n")
              out.write(f"DARKNETRA_FIELD_BLIND_INDEX_KEY_B64={blind}\n")
          PY

      - name: Install and migrate
        run: |
          uv sync --all-packages --dev --frozen
          uv run alembic -c apps/api/alembic.ini upgrade head

      - name: Write integrity contracts before production code
        run: |
          cat > apps/api/tests/integration/test_evidence_integrity.py <<'PY'
          from __future__ import annotations

          import hashlib
          import importlib
          import importlib.util
          import io
          import os
          from datetime import UTC, datetime
          from pathlib import Path
          from uuid import uuid4

          import pytest
          import sqlalchemy as sa
          from darknetra_api.authz.policy import CaseNotFound
          from darknetra_api.db.session import async_session_factory
          from darknetra_api.models.audit import AuditEvent
          from darknetra_api.models.auth_session import AuthSession
          from darknetra_api.models.case import Case
          from darknetra_api.models.case_membership import CaseMembership, CaseMembershipRole
          from darknetra_api.models.custody import CustodyEvent
          from darknetra_api.models.enums import CaseSensitivity
          from darknetra_api.models.evidence import EvidenceArtifact, EvidenceDerivation, EvidenceSourceClass, EvidenceState
          from darknetra_api.models.job import Job
          from darknetra_api.models.user import User
          from darknetra_api.services.evidence import preserve_evidence_manifest
          from darknetra_api.storage.local import LocalObjectStore


          def module():
              spec = importlib.util.find_spec("darknetra_api.services.integrity")
              assert spec is not None, "evidence integrity service is not implemented"
              return importlib.import_module("darknetra_api.services.integrity")


          async def clean_database() -> None:
              async with async_session_factory() as session:
                  await session.execute(sa.delete(CustodyEvent))
                  await session.execute(sa.delete(EvidenceDerivation))
                  await session.execute(sa.delete(EvidenceArtifact))
                  await session.execute(sa.delete(Job))
                  await session.execute(sa.delete(CaseMembershipRole))
                  await session.execute(sa.delete(CaseMembership))
                  await session.execute(sa.delete(AuditEvent))
                  await session.execute(sa.delete(Case))
                  await session.execute(sa.delete(AuthSession))
                  await session.execute(sa.delete(User))
                  await session.commit()


          @pytest.fixture(autouse=True)
          async def clean() -> None:
              await clean_database()
              yield
              await clean_database()


          async def seed_artifact(
              store: LocalObjectStore,
              *,
              data: bytes = b"immutable authorized evidence",
              state: EvidenceState = EvidenceState.READY,
          ) -> tuple[User, Case, EvidenceArtifact, Path]:
              stored = store.put_verified(io.BytesIO(data))
              object_path = store.root / stored.object_key
              async with async_session_factory() as session:
                  suffix = uuid4().hex[:10]
                  owner = User(
                      username=f"integrity-owner-{suffix}",
                      username_normalized=f"integrity-owner-{suffix}",
                      display_name="Integrity Owner",
                      password_hash="unused",
                      global_roles=[],
                      is_active=True,
                      must_change_password=False,
                  )
                  session.add(owner)
                  await session.flush()
                  case = Case(
                      case_code=f"INT-{suffix.upper()}",
                      title="Authorized integrity fixture",
                      sensitivity=CaseSensitivity.RESTRICTED,
                      owner_user_id=owner.id,
                      source_authority_summary="Authorized synthetic integrity fixture",
                  )
                  session.add(case)
                  await session.flush()
                  artifact = EvidenceArtifact(
                      case_id=case.id,
                      source_class=EvidenceSourceClass.SYNTHETIC,
                      source_type="synthetic.integrity",
                      acquisition_method="authorized_test_generation",
                      collector_user_id=owner.id,
                      captured_at=datetime.now(UTC),
                      original_timezone="UTC",
                      state=EvidenceState.STAGING,
                  )
                  preserve_evidence_manifest(
                      artifact,
                      media_type="text/plain",
                      size_bytes=stored.size_bytes,
                      sha256=stored.sha256,
                      sha512=hashlib.sha512(data).hexdigest(),
                      object_key=stored.object_key,
                  )
                  artifact.state = state
                  session.add(artifact)
                  await session.commit()
                  await session.refresh(owner)
                  await session.refresh(case)
                  await session.refresh(artifact)
                  return owner, case, artifact, object_path


          @pytest.mark.integration
          @pytest.mark.asyncio
          async def test_matching_object_records_verification_without_changing_ready_state(tmp_path: Path) -> None:
              integrity = module()
              store = LocalObjectStore(tmp_path / "vault")
              owner, case, artifact, _path = await seed_artifact(store)
              async with async_session_factory() as session:
                  result = await integrity.verify_evidence_integrity(
                      session=session,
                      actor=owner,
                      case_id=case.id,
                      evidence_id=artifact.id,
                      object_store=store,
                      request_id="integrity-success",
                  )
                  await session.commit()
                  assert result.outcome == "VERIFIED"
                  assert result.expected_sha256 == artifact.sha256
                  assert result.observed_sha256 == artifact.sha256
                  assert result.state is EvidenceState.READY
              async with async_session_factory() as session:
                  refreshed = await session.get(EvidenceArtifact, artifact.id)
                  custody = (
                      await session.execute(
                          sa.select(CustodyEvent).where(CustodyEvent.evidence_id == artifact.id)
                      )
                  ).scalar_one()
                  audit = (
                      await session.execute(
                          sa.select(AuditEvent).where(
                              AuditEvent.resource_type == "evidence",
                              AuditEvent.resource_id == str(artifact.id),
                          )
                      )
                  ).scalar_one()
                  assert refreshed is not None and refreshed.state is EvidenceState.READY
                  assert custody.event_type == "INTEGRITY_VERIFIED"
                  assert audit.event_type == "EVIDENCE_INTEGRITY_VERIFIED"
                  assert audit.request_id == "integrity-success"


          @pytest.mark.integration
          @pytest.mark.asyncio
          async def test_modified_bytes_set_integrity_mismatch_without_rewriting_expected_hashes(tmp_path: Path) -> None:
              integrity = module()
              original = b"immutable original"
              tampered = b"tampered bytes"
              store = LocalObjectStore(tmp_path / "vault")
              owner, case, artifact, object_path = await seed_artifact(store, data=original)
              expected_sha256 = artifact.sha256
              expected_sha512 = artifact.sha512
              object_path.chmod(0o600)
              object_path.write_bytes(tampered)
              object_path.chmod(0o400)
              async with async_session_factory() as session:
                  result = await integrity.verify_evidence_integrity(
                      session=session,
                      actor=owner,
                      case_id=case.id,
                      evidence_id=artifact.id,
                      object_store=store,
                      request_id="integrity-mismatch",
                  )
                  await session.commit()
                  assert result.outcome == "MISMATCH"
                  assert result.observed_sha256 == hashlib.sha256(tampered).hexdigest()
                  assert result.state is EvidenceState.INTEGRITY_MISMATCH
              async with async_session_factory() as session:
                  refreshed = await session.get(EvidenceArtifact, artifact.id)
                  assert refreshed is not None
                  assert refreshed.sha256 == expected_sha256
                  assert refreshed.sha512 == expected_sha512
                  assert refreshed.state is EvidenceState.INTEGRITY_MISMATCH
                  assert refreshed.quarantine_reason == "HASH_MISMATCH"
                  custody = (
                      await session.execute(
                          sa.select(CustodyEvent).where(CustodyEvent.evidence_id == artifact.id)
                      )
                  ).scalar_one()
                  assert custody.event_type == "INTEGRITY_MISMATCH_DETECTED"


          @pytest.mark.integration
          @pytest.mark.asyncio
          async def test_missing_object_sets_mismatch_and_does_not_disclose_filesystem_path(tmp_path: Path) -> None:
              integrity = module()
              store = LocalObjectStore(tmp_path / "vault")
              owner, case, artifact, object_path = await seed_artifact(store)
              object_path.unlink()
              async with async_session_factory() as session:
                  result = await integrity.verify_evidence_integrity(
                      session=session,
                      actor=owner,
                      case_id=case.id,
                      evidence_id=artifact.id,
                      object_store=store,
                      request_id=str(uuid4()),
                  )
                  await session.commit()
                  assert result.outcome == "OBJECT_MISSING"
                  assert result.observed_sha256 is None
                  assert result.state is EvidenceState.INTEGRITY_MISMATCH
                  assert str(tmp_path) not in repr(result)


          @pytest.mark.integration
          @pytest.mark.asyncio
          async def test_match_after_prior_mismatch_never_silently_clears_forensic_state(tmp_path: Path) -> None:
              integrity = module()
              original = b"original bytes"
              store = LocalObjectStore(tmp_path / "vault")
              owner, case, artifact, object_path = await seed_artifact(store, data=original)
              object_path.chmod(0o600)
              object_path.write_bytes(b"changed")
              object_path.chmod(0o400)
              async with async_session_factory() as session:
                  await integrity.verify_evidence_integrity(
                      session=session,
                      actor=owner,
                      case_id=case.id,
                      evidence_id=artifact.id,
                      object_store=store,
                      request_id=str(uuid4()),
                  )
                  await session.commit()
              object_path.chmod(0o600)
              object_path.write_bytes(original)
              object_path.chmod(0o400)
              async with async_session_factory() as session:
                  result = await integrity.verify_evidence_integrity(
                      session=session,
                      actor=owner,
                      case_id=case.id,
                      evidence_id=artifact.id,
                      object_store=store,
                      request_id=str(uuid4()),
                  )
                  await session.commit()
                  assert result.outcome == "VERIFIED_PREVIOUS_MISMATCH"
                  assert result.state is EvidenceState.INTEGRITY_MISMATCH


          @pytest.mark.integration
          @pytest.mark.asyncio
          async def test_wrong_case_and_unknown_evidence_are_non_enumerating(tmp_path: Path) -> None:
              integrity = module()
              store = LocalObjectStore(tmp_path / "vault")
              owner, case, artifact, _path = await seed_artifact(store)
              async with async_session_factory() as session:
                  with pytest.raises(CaseNotFound):
                      await integrity.verify_evidence_integrity(
                          session=session,
                          actor=owner,
                          case_id=uuid4(),
                          evidence_id=artifact.id,
                          object_store=store,
                          request_id=str(uuid4()),
                      )
              async with async_session_factory() as session:
                  with pytest.raises(CaseNotFound):
                      await integrity.verify_evidence_integrity(
                          session=session,
                          actor=owner,
                          case_id=case.id,
                          evidence_id=uuid4(),
                          object_store=store,
                          request_id=str(uuid4()),
                      )
          PY

      - name: Prove RED before implementation
        run: |
          set +e
          uv run pytest -q apps/api/tests/integration/test_evidence_integrity.py >/tmp/task9-integrity-red.log 2>&1
          code=$?
          set -e
          test "$code" -ne 0
          grep -q 'evidence integrity service is not implemented' /tmp/task9-integrity-red.log

      - name: Implement streaming integrity verification and tamper response
        run: |
          cat > apps/api/darknetra_api/services/integrity.py <<'PY'
          from __future__ import annotations

          import hashlib
          from dataclasses import dataclass
          from typing import Literal
          from uuid import UUID

          import sqlalchemy as sa
          from sqlalchemy.ext.asyncio import AsyncSession
          from starlette.concurrency import run_in_threadpool

          from darknetra_api.authz.permissions import Permission
          from darknetra_api.authz.policy import CaseNotFound, authorize_case
          from darknetra_api.models.custody import CustodyEvent
          from darknetra_api.models.evidence import EvidenceArtifact, EvidenceState
          from darknetra_api.models.user import User
          from darknetra_api.services.audit import append_audit_event
          from darknetra_api.storage.base import InvalidObjectKey, ObjectStore

          IntegrityOutcome = Literal[
              "VERIFIED",
              "VERIFIED_PREVIOUS_MISMATCH",
              "MISMATCH",
              "OBJECT_MISSING",
          ]


          @dataclass(frozen=True, slots=True)
          class IntegrityVerification:
              evidence_id: UUID
              case_id: UUID
              outcome: IntegrityOutcome
              state: EvidenceState
              expected_sha256: str
              observed_sha256: str | None
              expected_sha512: str | None
              observed_sha512: str | None
              size_bytes: int | None


          def _hash_object(
              object_store: ObjectStore,
              object_key: str,
          ) -> tuple[str, str, int] | None:
              sha256 = hashlib.sha256()
              sha512 = hashlib.sha512()
              size = 0
              try:
                  source = object_store.open(object_key)
              except (FileNotFoundError, InvalidObjectKey):
                  return None
              with source:
                  while chunk := source.read(1024 * 1024):
                      sha256.update(chunk)
                      sha512.update(chunk)
                      size += len(chunk)
              return sha256.hexdigest(), sha512.hexdigest(), size


          async def verify_evidence_integrity(
              *,
              session: AsyncSession,
              actor: User,
              case_id: UUID,
              evidence_id: UUID,
              object_store: ObjectStore,
              request_id: str,
          ) -> IntegrityVerification:
              await authorize_case(actor, case_id, Permission.CASE_UPDATE, session)
              artifact = (
                  await session.execute(
                      sa.select(EvidenceArtifact).where(
                          EvidenceArtifact.id == evidence_id,
                          EvidenceArtifact.case_id == case_id,
                      )
                  )
              ).scalar_one_or_none()
              if artifact is None or not artifact.sha256 or not artifact.object_key:
                  raise CaseNotFound("resource not found")

              observed = await run_in_threadpool(
                  _hash_object,
                  object_store,
                  artifact.object_key,
              )
              previous_mismatch = artifact.state is EvidenceState.INTEGRITY_MISMATCH
              if observed is None:
                  outcome: IntegrityOutcome = "OBJECT_MISSING"
                  observed_sha256 = None
                  observed_sha512 = None
                  observed_size = None
                  mismatch_reason = "OBJECT_MISSING"
                  matches = False
              else:
                  observed_sha256, observed_sha512, observed_size = observed
                  matches = (
                      observed_sha256 == artifact.sha256
                      and observed_size == artifact.size_bytes
                      and (
                          artifact.sha512 is None
                          or observed_sha512 == artifact.sha512
                      )
                  )
                  mismatch_reason = "HASH_MISMATCH"
                  if matches:
                      outcome = (
                          "VERIFIED_PREVIOUS_MISMATCH"
                          if previous_mismatch
                          else "VERIFIED"
                      )
                  else:
                      outcome = "MISMATCH"

              if matches:
                  event_type = (
                      "INTEGRITY_VERIFIED_AFTER_PRIOR_MISMATCH"
                      if previous_mismatch
                      else "INTEGRITY_VERIFIED"
                  )
                  audit_type = (
                      "EVIDENCE_INTEGRITY_VERIFIED_AFTER_MISMATCH"
                      if previous_mismatch
                      else "EVIDENCE_INTEGRITY_VERIFIED"
                  )
                  # A prior mismatch is a forensic fact and is never silently cleared.
                  result_state = artifact.state
              else:
                  artifact.state = EvidenceState.INTEGRITY_MISMATCH
                  artifact.quarantine_reason = mismatch_reason
                  event_type = "INTEGRITY_MISMATCH_DETECTED"
                  audit_type = "EVIDENCE_INTEGRITY_MISMATCH"
                  result_state = artifact.state

              metadata = {
                  "outcome": outcome,
                  "expected_sha256": artifact.sha256,
                  "observed_sha256": observed_sha256,
                  "expected_size_bytes": artifact.size_bytes,
                  "observed_size_bytes": observed_size,
                  "sha512_checked": artifact.sha512 is not None,
              }
              session.add(
                  CustodyEvent(
                      evidence_id=artifact.id,
                      case_id=case_id,
                      actor_user_id=actor.id,
                      event_type=event_type,
                      request_id=request_id,
                      reason="Evidence object integrity re-verification completed",
                      metadata_json=metadata,
                  )
              )
              append_audit_event(
                  session,
                  actor_user_id=actor.id,
                  event_type=audit_type,
                  resource_type="evidence",
                  resource_id=str(artifact.id),
                  case_id=case_id,
                  request_id=request_id,
                  metadata=metadata,
              )
              await session.flush()
              return IntegrityVerification(
                  evidence_id=artifact.id,
                  case_id=case_id,
                  outcome=outcome,
                  state=result_state,
                  expected_sha256=artifact.sha256,
                  observed_sha256=observed_sha256,
                  expected_sha512=artifact.sha512,
                  observed_sha512=observed_sha512,
                  size_bytes=observed_size,
              )
          PY

      - name: Verify GREEN and complete regression
        run: |
          uv run ruff check .
          uv run pytest -q apps/api/tests/integration/test_evidence_integrity.py
          uv run pytest -q
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config >/dev/null
          docker compose -f docker-compose.yml build api worker

      - name: Record Task 9 integrity service checkpoint
        run: |
          mkdir -p docs/verification
          cat > docs/verification/plan03-task9-integrity-service.md <<EOF
          # Plan 03 Task 9 — integrity re-verification service TDD checkpoint

          - **Source before implementation:** \`$(git rev-parse HEAD)\`
          - **Observed at (UTC):** \`$(date -u +'%Y-%m-%dT%H:%M:%SZ')\`
          - **Runner:** GitHub Actions \`ubuntu-latest\`

          ## RED

          Verification, mutation detection, missing-object and prior-mismatch contracts were written first and failed with \`evidence integrity service is not implemented\`.

          ## GREEN

          | Gate | Outcome |
          |---|---|
          | Ruff | success |
          | Streaming SHA-256/SHA-512/size verification | success |
          | Matching-object custody/audit test | success |
          | Modified-byte mismatch and immutable expected digest test | success |
          | Missing-object mismatch test | success |
          | Prior mismatch never silently cleared | success |
          | Wrong-case/unknown anti-enumeration tests | success |
          | Complete Python suite | success |
          | Compose validation and API/worker image build | success |

          A mismatch changes only the processing/quarantine state and records append-only custody/audit evidence. Expected hashes, object keys and original bytes are never rewritten. A later matching observation does not erase the historical mismatch state.
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/darknetra_api/services/integrity.py apps/api/tests/integration/test_evidence_integrity.py docs/verification/plan03-task9-integrity-service.md
          git rm .github/workflows/plan03-task9-integrity-service.yml
          git commit -m 'feat: add tamper evident evidence re-verification'
          git push origin HEAD:testing-codex
