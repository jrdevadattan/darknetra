name: Snapshot Plans 03 and 04 completion status

on:
  push:
    branches: [testing-codex]
    paths:
      - .github/workflows/snapshot-plan34-status.yml

permissions:
  contents: write
  actions: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: testing-codex
          fetch-depth: 0
      - name: Write latest primary run status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_JSON="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/complete-plan03-plan04.yml/runs?branch=testing-codex&per_page=1" --jq '.workflow_runs[0]')"
          RUN_ID="$(jq -r '.id' <<<"$RUN_JSON")"
          STATUS="$(jq -r '.status' <<<"$RUN_JSON")"
          CONCLUSION="$(jq -r '.conclusion // "pending"' <<<"$RUN_JSON")"
          CREATED="$(jq -r '.created_at' <<<"$RUN_JSON")"
          UPDATED="$(jq -r '.updated_at' <<<"$RUN_JSON")"
          JOBS="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" --jq '[.jobs[] | {name,status,conclusion,started_at,completed_at,steps:[.steps[] | {name,status,conclusion,number}]}]')"
          mkdir -p docs/verification
          jq -n \
            --argjson run "$RUN_JSON" \
            --argjson jobs "$JOBS" \
            '{run:$run,jobs:$jobs}' \
            > docs/verification/plans-03-04-live-status.json
          cat > docs/verification/plans-03-04-live-status.md <<EOF
          # Plans 03 and 04 live completion status

          - Run ID: \`${RUN_ID}\`
          - Status: **${STATUS}**
          - Conclusion: **${CONCLUSION}**
          - Created: \`${CREATED}\`
          - Updated: \`${UPDATED}\`
          - Snapshot observed: \`$(date -u +'%Y-%m-%dT%H:%M:%SZ')\`
          EOF
      - name: Commit snapshot and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/verification/plans-03-04-live-status.json docs/verification/plans-03-04-live-status.md
          git rm .github/workflows/snapshot-plan34-status.yml
          git commit -m 'docs: snapshot Plans 03 and 04 completion status [skip ci]'
          git pull --rebase origin testing-codex
          git push origin HEAD:testing-codex
