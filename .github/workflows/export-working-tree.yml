name: Export working tree snapshot

on:
  push:
    branches: [testing-codex]
    paths:
      - .github/workflows/export-working-tree.yml

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: testing-codex
          fetch-depth: 0
      - name: Commit a temporary chunked snapshot
        run: |
          rm -rf .snapshot
          mkdir -p .snapshot
          git archive --format=tar.gz --output=/tmp/darknetra-working-tree.tar.gz HEAD
          split -b 600000 -d -a 3 /tmp/darknetra-working-tree.tar.gz /tmp/darknetra-part-
          for part in /tmp/darknetra-part-*; do
            name="$(basename "$part")"
            base64 -w 0 "$part" > ".snapshot/${name}.b64"
          done
          sha256sum /tmp/darknetra-working-tree.tar.gz | awk '{print $1}' > .snapshot/sha256.txt
          stat -c '%s' /tmp/darknetra-working-tree.tar.gz > .snapshot/size.txt
          ls .snapshot/*.b64 | sort | xargs -n1 basename > .snapshot/parts.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .snapshot
          git rm .github/workflows/export-working-tree.yml
          git commit -m 'chore: export temporary working-tree snapshot [skip ci]'
          git push origin HEAD:testing-codex
