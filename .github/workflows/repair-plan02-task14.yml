name: Repair Plan 02 Task 14 environment

on:
  push:
    branches: [testing-codex]
    paths:
      - .github/workflows/repair-plan02-task14.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: testing-codex
          fetch-depth: 0
      - name: Scope verification build version to runtime-only contexts
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/plan02-task14.yml')
          text = path.read_text(encoding='utf-8')
          needle = '      DARKNETRA_BUILD_VERSION: plan02-final-verification\n'
          if text.count(needle) != 1:
              raise SystemExit('expected exactly one job-wide build-version assignment')
          path.write_text(text.replace(needle, ''), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/plan02-task14.yml
          git commit -m 'ci: isolate Task 14 runtime build version'
          git push origin HEAD:testing-codex
