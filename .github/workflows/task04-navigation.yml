name: Task 04 DARKNETRA navigation

on:
  push:
    branches: [testing-codex]
    paths:
      - .github/workflows/task04-navigation.yml

permissions:
  contents: write

jobs:
  task04:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: testing-codex
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare pnpm workspace
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          pnpm install --frozen-lockfile
          pnpm --filter @darknetra/web add -D @vitejs/plugin-react @testing-library/user-event
          pnpm --filter @darknetra/web exec playwright install chromium

      - name: Write failing Task 04 contracts
        shell: bash
        run: |
          set -euo pipefail
          cat > apps/web/src/config/metadata-contract.test.ts <<'EOF'
          import { describe, expect, it } from 'vitest';
          import { metadata } from '@/app/layout';

          describe('root metadata', () => {
            it('uses the approved DARKNETRA metadata', () => {
              expect(metadata.title).toBe('DARKNETRA — Investigator Intelligence');
              expect(metadata.description).toBe('Evidence-first narcotics intelligence for authorized investigators.');
            });
          });
          EOF

          mkdir -p apps/web/src/navigation
          cat > apps/web/src/navigation/darknetra-navigation.test.ts <<'EOF'
          import { describe, expect, it } from 'vitest';
          import {
            CASE_NAVIGATION,
            DARKNETRA_NAVIGATION,
            canSeeNavigationItem,
            type DarknetraRole,
          } from './darknetra-navigation';

          const flattenHrefs = (items: typeof DARKNETRA_NAVIGATION): string[] =>
            items.flatMap((item) => [item.href, ...(item.children?.map((child) => child.href) ?? [])]);

          describe('DARKNETRA navigation contract', () => {
            it('contains approved global routes and no rejected showcase routes', () => {
              const hrefs = flattenHrefs(DARKNETRA_NAVIGATION);
              expect(hrefs).toEqual(expect.arrayContaining([
                '/dashboard',
                '/cases',
                '/intelligence/trends',
                '/admin/roles',
                '/audit',
                '/system/health',
              ]));
              expect(hrefs.join(' ')).not.toMatch(/ecommerce|crm|finance|academy|mail|calendar|chat/i);
            });

            it('contains all nine case tabs', () => {
              expect(CASE_NAVIGATION.map((item) => item.title)).toEqual([
                'Overview',
                'Evidence',
                'Entities',
                'Activity Candidates',
                'Link Analysis',
                'NarcoGraph',
                'Timeline',
                'Alerts',
                'Reports',
              ]);
            });

            it('applies role visibility using any-role matching', () => {
              const adminOnly = { title: 'Admin', href: '/admin', roles: ['ADMIN'] as DarknetraRole[] };
              expect(canSeeNavigationItem(adminOnly, ['ADMIN'])).toBe(true);
              expect(canSeeNavigationItem(adminOnly, ['AUDITOR'])).toBe(false);
              expect(canSeeNavigationItem({ title: 'Open', href: '/open' }, ['AUDITOR'])).toBe(true);
            });
          });
          EOF

      - name: Confirm Task 04 contracts are red
        shell: bash
        run: |
          set +e
          pnpm --filter @darknetra/web test -- src/config/metadata-contract.test.ts src/navigation/darknetra-navigation.test.ts > /tmp/task04-red.log 2>&1
          status=$?
          set -e
          cat /tmp/task04-red.log
          if [ "$status" -eq 0 ]; then
            echo 'Task 04 contracts unexpectedly passed before implementation.' >&2
            exit 1
          fi

      - name: Implement approved metadata and typed navigation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/app/layout.tsx')
          text = path.read_text()
          text = text.replace('import { APP_CONFIG } from "@/config/app-config";\n', '')
          old = '''export const metadata: Metadata = {\n  title: APP_CONFIG.meta.title,\n  description: APP_CONFIG.meta.description,\n};'''
          new = '''export const metadata: Metadata = {\n  title: "DARKNETRA — Investigator Intelligence",\n  description: "Evidence-first narcotics intelligence for authorized investigators.",\n};'''
          if old not in text:
              raise SystemExit('root metadata block not found')
          path.write_text(text.replace(old, new))
          PY

          cat > apps/web/src/navigation/darknetra-navigation.ts <<'EOF'
          import {
            Activity,
            BellRing,
            BookOpenCheck,
            Boxes,
            FileSearch,
            Gauge,
            GitBranch,
            HeartPulse,
            ListChecks,
            Network,
            ScanSearch,
            Settings,
            ShieldCheck,
            SlidersHorizontal,
            Tags,
            Timeline,
            UserRoundCog,
            Users,
          } from 'lucide-react';
          import type { LucideIcon } from 'lucide-react';

          export type DarknetraRole =
            | 'ADMIN'
            | 'CASE_OWNER'
            | 'COLLECTOR'
            | 'ANALYST'
            | 'REVIEWER'
            | 'AUDITOR'
            | 'VIEWER';

          export interface NavigationItem {
            title: string;
            href: string;
            icon?: LucideIcon;
            roles?: DarknetraRole[];
            children?: NavigationItem[];
          }

          export interface CaseNavigationItem {
            title: string;
            segment: string;
            icon?: LucideIcon;
          }

          export function canSeeNavigationItem(item: Pick<NavigationItem, 'roles'>, roles: DarknetraRole[]): boolean {
            return !item.roles?.length || item.roles.some((role) => roles.includes(role));
          }

          export const DARKNETRA_NAVIGATION: NavigationItem[] = [
            { title: 'Overview', href: '/dashboard', icon: Gauge },
            { title: 'Cases', href: '/cases', icon: FileSearch },
            {
              title: 'Intelligence',
              href: '/intelligence/trends',
              icon: ScanSearch,
              children: [
                { title: 'Emerging Trends', href: '/intelligence/trends', icon: Activity },
                { title: 'Source Registry', href: '/intelligence/sources', icon: Boxes },
              ],
            },
            {
              title: 'Administration',
              href: '/admin/users',
              icon: UserRoundCog,
              roles: ['ADMIN'],
              children: [
                { title: 'Users', href: '/admin/users', icon: Users, roles: ['ADMIN'] },
                { title: 'Roles & Permissions', href: '/admin/roles', icon: ShieldCheck, roles: ['ADMIN'] },
                { title: 'Taxonomies', href: '/admin/taxonomies', icon: Tags, roles: ['ADMIN'] },
                { title: 'System Settings', href: '/admin/settings', icon: Settings, roles: ['ADMIN'] },
              ],
            },
            { title: 'Audit', href: '/audit', icon: BookOpenCheck, roles: ['ADMIN', 'AUDITOR', 'REVIEWER'] },
            { title: 'System Health', href: '/system/health', icon: HeartPulse, roles: ['ADMIN', 'AUDITOR'] },
          ];

          export const CASE_NAVIGATION: CaseNavigationItem[] = [
            { title: 'Overview', segment: '', icon: Gauge },
            { title: 'Evidence', segment: 'evidence', icon: FileSearch },
            { title: 'Entities', segment: 'entities', icon: Boxes },
            { title: 'Activity Candidates', segment: 'activity', icon: ListChecks },
            { title: 'Link Analysis', segment: 'links', icon: GitBranch },
            { title: 'NarcoGraph', segment: 'graph', icon: Network },
            { title: 'Timeline', segment: 'timeline', icon: Timeline },
            { title: 'Alerts', segment: 'alerts', icon: BellRing },
            { title: 'Reports', segment: 'reports', icon: SlidersHorizontal },
          ];
          EOF

          cat > apps/web/src/navigation/sidebar/sidebar-items.ts <<'EOF'
          import type { LucideIcon } from 'lucide-react';
          import { DARKNETRA_NAVIGATION } from '@/navigation/darknetra-navigation';

          export type NavBadge = 'new' | 'soon';

          export interface NavSubItem {
            id: string;
            title: string;
            url: string;
            icon?: LucideIcon;
            badge?: NavBadge;
            disabled?: boolean;
            newTab?: boolean;
          }

          interface NavItemBase {
            id: string;
            title: string;
            icon?: LucideIcon;
            badge?: NavBadge;
            disabled?: boolean;
            newTab?: boolean;
          }

          export interface NavMainLinkItem extends NavItemBase {
            url: string;
            subItems?: never;
          }

          export interface NavMainParentItem extends NavItemBase {
            subItems: NavSubItem[];
          }

          export type NavMainItem = NavMainLinkItem | NavMainParentItem;

          export interface NavGroup {
            id: number;
            label?: string;
            items: NavMainItem[];
          }

          const toId = (value: string) => value.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');

          export const sidebarItems: NavGroup[] = [
            {
              id: 1,
              label: 'Investigation',
              items: DARKNETRA_NAVIGATION.map((item): NavMainItem => {
                const base = { id: toId(item.title), title: item.title, icon: item.icon };
                if (item.children?.length) {
                  return {
                    ...base,
                    subItems: item.children.map((child) => ({
                      id: toId(child.title),
                      title: child.title,
                      url: child.href,
                      icon: child.icon,
                    })),
                  };
                }
                return { ...base, url: item.href };
              }),
            },
          ];
          EOF

          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/app/(main)/dashboard/_components/sidebar/app-sidebar.tsx')
          text = path.read_text().replace('href="/dashboard/default"', 'href="/dashboard"')
          path.write_text(text)
          PY

          cat > apps/web/vitest.config.ts <<'EOF'
          import path from 'node:path';
          import react from '@vitejs/plugin-react';
          import { defineConfig } from 'vitest/config';

          export default defineConfig({
            plugins: [react()],
            test: {
              environment: 'jsdom',
              setupFiles: ['./src/test/setup.ts'],
            },
            resolve: {
              alias: {
                '@': path.resolve(__dirname, './src'),
              },
            },
          });
          EOF

      - name: Verify Task 04
        run: |
          pnpm --filter @darknetra/web test
          pnpm --filter @darknetra/web lint
          pnpm --filter @darknetra/web typecheck
          pnpm --filter @darknetra/web build

      - name: Commit Task 04
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web pnpm-lock.yaml
          git commit -m 'test: establish DARKNETRA dashboard navigation contract [skip ci]'
          git push origin HEAD:testing-codex
