name: Plan 03 Task 1 durable job boundary

on:
  push:
    branches: [testing-codex]
    paths:
      - .github/workflows/plan03-task1-apply.yml

permissions:
  contents: write
  statuses: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    env:
      DARKNETRA_ENVIRONMENT: test
      DARKNETRA_DATABASE_URL: postgresql+psycopg://darknetra:darknetra-task1@127.0.0.1:5432/darknetra_plan03_task1_test
      DARKNETRA_E2E_DATABASE_URL: postgresql+psycopg://darknetra:darknetra-task1@127.0.0.1:5432/darknetra_plan03_task1_test
      DARKNETRA_REDIS_URL: redis://127.0.0.1:6379/0
      DARKNETRA_WEB_ORIGIN: http://localhost:3000
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: darknetra_plan03_task1_test
          POSTGRES_USER: darknetra
          POSTGRES_PASSWORD: darknetra-task1
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U darknetra -d darknetra_plan03_task1_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: testing-codex
          fetch-depth: 0
      - name: Publish workflow-run locator
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > /tmp/plan03-task1-status.json
          import json
          import os

          print(json.dumps({
              "state": "pending",
              "context": "plan03/task1",
              "description": f"GitHub Actions run {os.environ['GITHUB_RUN_ID']}",
              "target_url": (
                  f"{os.environ['GITHUB_SERVER_URL']}/"
                  f"{os.environ['GITHUB_REPOSITORY']}/actions/runs/"
                  f"{os.environ['GITHUB_RUN_ID']}"
              ),
          }))
          PY
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data @/tmp/plan03-task1-status.json \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: '0.12.4'
      - id: task
        name: Execute reviewed Task 1 implementation and release gate
        shell: bash
        run: |
          set -euo pipefail
          echo '17511b8f90ac5971aea924109a381bbe9849d1e34bf945ce135749744e76b19b  .automation/plan03-task1-run.sh.gz' | sha256sum -c -
          echo '3ad632bef88d519c815cd5951199eead92b62f3139b280272b35408bc764a6e2  .automation/plan03-task1.patch.gz' | sha256sum -c -
          gzip -dc .automation/plan03-task1-run.sh.gz > /tmp/plan03-task1-run.sh
          echo 'da542a8488d72f9687d0dd3563bb241b05ab972b304a8b9396332ef8698a42ab  /tmp/plan03-task1-run.sh' | sha256sum -c -
          bash -n /tmp/plan03-task1-run.sh
          chmod 700 /tmp/plan03-task1-run.sh
          /tmp/plan03-task1-run.sh
      - name: Publish terminal workflow status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TASK_OUTCOME: ${{ steps.task.outcome }}
        run: |
          python - <<'PY' > /tmp/plan03-task1-terminal-status.json
          import json
          import os

          success = os.environ.get('TASK_OUTCOME') == 'success'
          print(json.dumps({
              "state": "success" if success else "failure",
              "context": "plan03/task1",
              "description": "Task 1 release gate passed" if success else "Task 1 release gate failed",
              "target_url": (
                  f"{os.environ['GITHUB_SERVER_URL']}/"
                  f"{os.environ['GITHUB_REPOSITORY']}/actions/runs/"
                  f"{os.environ['GITHUB_RUN_ID']}"
              ),
          }))
          PY
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data @/tmp/plan03-task1-terminal-status.json \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null
