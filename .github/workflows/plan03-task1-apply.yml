name: Plan 03 Task 1 durable job boundary

# Canonicalize and verify the staged runner before executing the TDD and release gates.
on:
  push:
    branches: [testing-codex]
    paths:
      - .github/workflows/plan03-task1-apply.yml

permissions:
  contents: write
  statuses: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    env:
      DARKNETRA_ENVIRONMENT: test
      DARKNETRA_DATABASE_URL: postgresql+psycopg://darknetra:darknetra-task1@127.0.0.1:5432/darknetra_plan03_task1_test
      DARKNETRA_E2E_DATABASE_URL: postgresql+psycopg://darknetra:darknetra-task1@127.0.0.1:5432/darknetra_plan03_task1_test
      DARKNETRA_REDIS_URL: redis://127.0.0.1:6379/0
      DARKNETRA_WEB_ORIGIN: http://localhost:3000
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: darknetra_plan03_task1_test
          POSTGRES_USER: darknetra
          POSTGRES_PASSWORD: darknetra-task1
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U darknetra -d darknetra_plan03_task1_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: testing-codex
          fetch-depth: 0
      - name: Publish workflow-run locator
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > /tmp/plan03-task1-status.json
          import json
          import os
          print(json.dumps({
              "state": "pending",
              "context": "plan03/task1",
              "description": f"GitHub Actions run {os.environ['GITHUB_RUN_ID']}",
              "target_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data @/tmp/plan03-task1-status.json \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: '0.12.4'
      - name: Execute reviewed Task 1 implementation and release gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path

          source = Path('.automation/plan03-task1-run.sh.gz.b64')
          raw = source.read_text(encoding='ascii')
          compact = ''.join(raw.split())
          padding = compact.find('=')
          if padding >= 0:
              compact = compact[:padding] + ('==' if compact[padding:padding + 2] == '==' else '=')
          expected = 'e4cf8f5bf83f2af00acf07fe1f3c4c99bc3c730d7d78646c45f09468b7b50935'
          observed = hashlib.sha256(compact.encode('ascii')).hexdigest()
          if observed != expected:
              raise SystemExit(
                  f'canonical runner payload mismatch: raw_length={len(raw)} '
                  f'canonical_length={len(compact)} sha256={observed} tail={raw[-16:]!r}'
              )
          Path('/tmp/plan03-task1-run.b64').write_text(compact, encoding='ascii')
          PY
          base64 --decode /tmp/plan03-task1-run.b64 | gzip --decompress > /tmp/plan03-task1-run.sh
          chmod 700 /tmp/plan03-task1-run.sh
          /tmp/plan03-task1-run.sh
