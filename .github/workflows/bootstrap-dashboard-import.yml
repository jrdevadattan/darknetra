name: Bootstrap pinned dashboard import

on:
  push:
    branches: [testing-codex]
    paths:
      - .github/workflows/bootstrap-dashboard-import.yml

permissions:
  contents: write

jobs:
  import-dashboard:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: testing-codex
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          node --version
          pnpm --version

      - name: Import exact upstream snapshot
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/darknetra-dashboard-upstream
          git clone --filter=blob:none https://github.com/arhamkhnz/next-shadcn-admin-dashboard.git /tmp/darknetra-dashboard-upstream
          git -C /tmp/darknetra-dashboard-upstream checkout --detach 0c668859c4fdeaa0279c951c178b965cce62a125
          test "$(git -C /tmp/darknetra-dashboard-upstream rev-parse HEAD)" = "0c668859c4fdeaa0279c951c178b965cce62a125"
          rm -rf apps/web
          mkdir -p apps/web
          rsync -a --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.next' \
            /tmp/darknetra-dashboard-upstream/ apps/web/
          rm -rf apps/web/.github apps/web/.husky
          rm -f apps/web/package-lock.json

      - name: Rebrand workspace package and configure tests
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = 'apps/web/package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.name = '@darknetra/web';
          pkg.private = true;
          pkg.scripts = {
            dev: 'next dev',
            build: 'next build',
            start: 'next start',
            lint: 'biome lint .',
            format: 'biome format --write .',
            check: 'biome check .',
            typecheck: 'tsc --noEmit',
            test: 'vitest run',
            'test:watch': 'vitest',
            'test:e2e': 'playwright test'
          };
          delete pkg['lint-staged'];
          if (pkg.devDependencies) {
            delete pkg.devDependencies.husky;
            delete pkg.devDependencies['lint-staged'];
          }
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          NODE

          cat > apps/web/UPSTREAM.md <<'EOF'
          # Upstream dashboard snapshot

          - Repository: `arhamkhnz/next-shadcn-admin-dashboard`
          - Commit: `0c668859c4fdeaa0279c951c178b965cce62a125`
          - License: MIT
          - Import date: 2026-08-17
          - Repository license copy: `../../LICENSES/next-shadcn-admin-dashboard-MIT.txt`

          This pinned snapshot is the visual/component baseline only. DARKNETRA must not depend on the upstream repository at build time or runtime.
          EOF

          mkdir -p apps/web/src/test
          cat > apps/web/src/test/setup.ts <<'EOF'
          import '@testing-library/jest-dom/vitest';
          EOF

          cat > apps/web/vitest.config.ts <<'EOF'
          import path from 'node:path';
          import { defineConfig } from 'vitest/config';

          export default defineConfig({
            test: {
              environment: 'jsdom',
              setupFiles: ['./src/test/setup.ts'],
            },
            resolve: {
              alias: {
                '@': path.resolve(__dirname, './src'),
              },
            },
          });
          EOF

          cat > apps/web/src/config/app-config.test.ts <<'EOF'
          import { describe, expect, it } from 'vitest';
          import { APP_CONFIG } from './app-config';

          describe('DARKNETRA brand contract', () => {
            it('uses the DARKNETRA investigator product identity', () => {
              expect(APP_CONFIG.name).toBe('DARKNETRA');
              expect(APP_CONFIG.meta.title).toContain('DARKNETRA');
              expect(APP_CONFIG.meta.description).toContain('investigator');
            });
          });
          EOF

      - name: Install workspace and test tooling
        run: |
          pnpm install
          pnpm --filter @darknetra/web add -D vitest @testing-library/react @testing-library/jest-dom jsdom @playwright/test

      - name: Confirm red test before brand implementation
        shell: bash
        run: |
          set +e
          pnpm --filter @darknetra/web test -- src/config/app-config.test.ts > /tmp/darknetra-red.log 2>&1
          status=$?
          set -e
          cat /tmp/darknetra-red.log
          if [ "$status" -eq 0 ]; then
            echo 'Expected brand contract test to fail before implementation.' >&2
            exit 1
          fi

      - name: Implement DARKNETRA brand contract
        shell: bash
        run: |
          cat > apps/web/src/config/app-config.ts <<'EOF'
          import packageJson from '../../package.json';

          const currentYear = new Date().getFullYear();

          export const APP_CONFIG = {
            name: 'DARKNETRA',
            version: packageJson.version,
            copyright: `© ${currentYear}, DARKNETRA.`,
            meta: {
              title: 'DARKNETRA — Investigator Intelligence Dashboard',
              description:
                'DARKNETRA is an evidence-first investigator dashboard for authorized narcotics intelligence, evidence review, cross-platform correlation, and explainable analysis.',
            },
          };
          EOF

      - name: Verify imported frontend baseline
        run: |
          pnpm --filter @darknetra/web typecheck
          pnpm --filter @darknetra/web lint
          pnpm --filter @darknetra/web test
          pnpm --filter @darknetra/web build

      - name: Commit verified dashboard baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web pnpm-lock.yaml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: import pinned dashboard frontend baseline [skip ci]'
          git push origin HEAD:testing-codex
