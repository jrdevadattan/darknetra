name: Plan 03 Task 4 final evidence preservation gate

on:
  push:
    branches: [testing-codex]
    paths:
      - .github/workflows/plan03-task4-final-verification.yml

permissions:
  contents: write
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DARKNETRA_ENVIRONMENT: development
      DARKNETRA_DATABASE_URL: postgresql+psycopg://darknetra:darknetra-task4-final@127.0.0.1:5432/darknetra_plan03_task4_final
      DARKNETRA_E2E_DATABASE_URL: postgresql+psycopg://darknetra:darknetra-task4-final@127.0.0.1:5432/darknetra_plan03_task4_final
      DARKNETRA_REDIS_URL: redis://127.0.0.1:6379/0
      DARKNETRA_WEB_ORIGIN: http://localhost:3000
      DARKNETRA_EVIDENCE_STORE_PATH: /tmp/darknetra-plan03-task4-final
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: darknetra_plan03_task4_final
          POSTGRES_USER: darknetra
          POSTGRES_PASSWORD: darknetra-task4-final
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U darknetra -d darknetra_plan03_task4_final"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: testing-codex
          fetch-depth: 0

      - name: Publish run locator
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' >/tmp/status.json
          import json, os
          print(json.dumps({
            "state": "pending",
            "context": "plan03/task4-final",
            "description": f"GitHub Actions run {os.environ['GITHUB_RUN_ID']}",
            "target_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl --fail --silent --show-error --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data @/tmp/status.json \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: '0.12.4'

      - name: Generate runtime-only keys
        run: |
          python - <<'PY'
          import base64, json, os, secrets
          def key():
              return base64.b64encode(secrets.token_bytes(32)).decode("ascii")
          jwt, field, blind = key(), key(), key()
          for value in (jwt, field, blind):
              print(f"::add-mask::{value}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as out:
              out.write(f"DARKNETRA_JWT_SIGNING_KEY_B64={jwt}\n")
              out.write(f"DARKNETRA_FIELD_KEY_V1_B64={field}\n")
              out.write("DARKNETRA_FIELD_KEYRING_B64_JSON=" + json.dumps({"v1": field}, separators=(",", ":")) + "\n")
              out.write("DARKNETRA_FIELD_ACTIVE_KEY_VERSION=v1\n")
              out.write(f"DARKNETRA_FIELD_BLIND_INDEX_KEY_B64={blind}\n")
          PY

      - name: Verify locked dependencies and migration reversibility
        run: |
          uv sync --all-packages --dev --frozen
          uv run alembic -c apps/api/alembic.ini upgrade head
          uv run alembic -c apps/api/alembic.ini downgrade 3f21c6d4a901
          uv run alembic -c apps/api/alembic.ini upgrade head
          uv run alembic -c apps/api/alembic.ini current

      - name: Static and focused verification
        run: |
          uv run ruff check .
          uv run pytest -q \
            apps/api/tests/unit/test_ingestion_policy.py \
            apps/api/tests/integration/test_evidence_preservation.py \
            apps/api/tests/integration/test_evidence_upload_route.py

      - name: Complete Python regression suite
        run: uv run pytest -q

      - name: Verify OpenAPI and response boundary in-process
        run: |
          uv run python - <<'PY'
          from darknetra_api.main import app
          schema = app.openapi()
          path = "/api/v1/cases/{case_id}/evidence"
          assert path in schema["paths"]
          operation = schema["paths"][path]["post"]
          assert "multipart/form-data" in operation["requestBody"]["content"]
          assert "202" in operation["responses"]
          payload = str(operation).lower()
          for forbidden in ("source_locator_ciphertext", "authority_reference_ciphertext", "notes_ciphertext", "object_key"):
              assert forbidden not in payload
          PY

      - name: Validate container topology and build images
        run: |
          docker compose -f docker-compose.yml config --format json >/tmp/base-compose.json
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          doc = json.loads(Path("/tmp/base-compose.json").read_text(encoding="utf-8"))
          target = "/var/lib/darknetra/evidence"
          for service in ("api", "worker"):
              assert any(v.get("target") == target for v in doc["services"][service].get("volumes", []))
          assert not any(v.get("target") == target for v in doc["services"]["web"].get("volumes", []))
          PY
          docker compose -f docker-compose.yml build api worker

      - name: Record final Task 4 contract
        run: |
          mkdir -p docs/architecture docs/verification
          cat > docs/architecture/evidence-upload-boundary.md <<'EOF'
          # Evidence upload and preservation boundary

          ## Accepted inputs

          The authenticated API accepts a single multipart artifact and one strict JSON metadata object. The source class, source type, acquisition method and capture time are mandatory. `PUBLIC_OBSERVATION` and `AUTHORIZED_IMPORT` additionally require an authority reference. The endpoint does not perform live collection, authenticate to third-party services, bypass encryption or contact a seller.

          ## Order of operations

          1. Resolve the authenticated actor and apply case-scoped `CASE_UPDATE` authorization using the existing non-enumerating policy.
          2. Reject malformed metadata and declared or streamed size violations.
          3. Detect the parser family from bytes; an uploaded filename is never used for trust or storage placement.
          4. Stream the original into random same-filesystem staging, compute SHA-256, verify and atomically promote it to content-addressed storage.
          5. Encrypt source locator, authority reference and notes at the application layer.
          6. Add the immutable manifest, custody event, audit event and durable processing job to the caller-owned PostgreSQL transaction.
          7. Commit metadata, then publish only when the named processing task is registered. Until Task 8 installs that pipeline, the API returns `PENDING_PIPELINE`; it does not send a message that Celery would discard.

          ## Failure semantics

          Policy failure occurs before database metadata is committed. A database failure after content promotion may leave an unreferenced content-addressed object; it is safe and must be reconciled by future garbage-collection tooling rather than blindly deleted because another artifact may reference identical bytes. Responses set `Cache-Control: no-store` and never contain ciphertext envelopes, object keys or unrestricted filesystem paths.
          EOF

          cat > docs/verification/plan03-task4-final.md <<EOF
          # Plan 03 Task 4 — upload and preservation final verification

          - **Verified source commit:** \`$(git rev-parse HEAD)\`
          - **Observed at (UTC):** \`$(date -u +'%Y-%m-%dT%H:%M:%SZ')\`
          - **Runner:** GitHub Actions \`ubuntu-latest\`

          | Gate | Outcome |
          |---|---|
          | Frozen dependencies | success |
          | Alembic upgrade/downgrade/re-upgrade | success |
          | Ruff | success |
          | Focused policy, preservation and route tests | success |
          | Complete Python suite | success |
          | OpenAPI multipart/202 contract | success |
          | Sensitive/internal fields absent from API schema | success |
          | API/worker-only Evidence Vault mount | success |
          | API and worker image build | success |

          Task 4 is complete for safe preservation. The durable job is created atomically and remains `PENDING_PIPELINE` until Task 8 registers the idempotent derivative-processing task; this fail-closed handoff is intentional and documented rather than publishing an unregistered Celery message.
          EOF

          python - <<'PY'
          from pathlib import Path
          ledger = Path("docs/verification/plan03-execution-ledger.md")
          if ledger.exists():
              lines = ledger.read_text(encoding="utf-8").splitlines()
              value = "- Task 4: complete — authenticated safe multipart preservation, policy enforcement, immutable manifest, encrypted metadata, custody/audit and durable pending pipeline handoff verified."
              for index, line in enumerate(lines):
                  if line.startswith("- Task 4:"):
                      lines[index] = value
                      break
              else:
                  lines += ["", value]
              ledger.write_text("\n".join(lines).rstrip() + "\n", encoding="utf-8")
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/architecture/evidence-upload-boundary.md docs/verification/plan03-task4-final.md
          if test -f docs/verification/plan03-execution-ledger.md; then git add docs/verification/plan03-execution-ledger.md; fi
          git rm .github/workflows/plan03-task4-final-verification.yml
          git commit -m 'docs: verify safe evidence preservation boundary [skip ci]'
          git push origin HEAD:testing-codex

      - name: Publish terminal status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python - <<'PY' >/tmp/status.json
          import json, os
          success = os.environ["JOB_STATUS"] == "success"
          print(json.dumps({
            "state": "success" if success else "failure",
            "context": "plan03/task4-final",
            "description": "Task 4 final gate passed" if success else "Task 4 final gate failed",
            "target_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl --fail --silent --show-error --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data @/tmp/status.json \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null
