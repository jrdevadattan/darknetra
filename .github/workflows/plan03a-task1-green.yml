name: Plan 03a Task 1 encryption GREEN gate

# Final rerun after lint fixes with a disposable PostgreSQL service for the complete regression suite.
on:
  push:
    branches: [testing-codex]
    paths:
      - .github/workflows/plan03a-task1-green.yml

permissions:
  contents: write

jobs:
  verify-green:
    runs-on: ubuntu-latest
    env:
      DARKNETRA_DATABASE_URL: postgresql+psycopg://darknetra:darknetra-plan03a@127.0.0.1:5432/darknetra_plan03a_test
      DARKNETRA_E2E_DATABASE_URL: postgresql+psycopg://darknetra:darknetra-plan03a@127.0.0.1:5432/darknetra_plan03a_test
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: darknetra_plan03a_test
          POSTGRES_USER: darknetra
          POSTGRES_PASSWORD: darknetra-plan03a
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U darknetra -d darknetra_plan03a_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: testing-codex
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: '0.12.4'
      - id: lock
        name: Resolve and lock cryptographic dependencies
        continue-on-error: true
        run: uv lock
      - id: prepare
        name: Install locked workspace
        if: steps.lock.outcome == 'success'
        continue-on-error: true
        run: uv sync --all-packages --dev --frozen
      - id: migrate
        name: Migrate disposable regression database
        if: steps.prepare.outcome == 'success'
        continue-on-error: true
        run: uv run alembic -c apps/api/alembic.ini upgrade head
      - id: focused
        name: Sensitive-field encryption tests
        if: steps.prepare.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          uv run pytest apps/api/tests/unit/test_sensitive_field_encryption.py -v 2>&1 | tee /tmp/plan03a-task1-focused.log
      - id: ruff
        name: Ruff encryption boundary
        if: steps.prepare.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          uv run ruff check apps/api/darknetra_api/security/encryption.py apps/api/darknetra_api/config.py apps/api/tests/unit/test_sensitive_field_encryption.py 2>&1 | tee /tmp/plan03a-task1-ruff.log
      - id: regression
        name: Complete Python regression suite
        if: steps.migrate.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          uv run pytest -q 2>&1 | tee /tmp/plan03a-task1-regression.log
      - name: Persist lock and observed verification
        if: always()
        env:
          LOCK: ${{ steps.lock.outcome }}
          PREPARE: ${{ steps.prepare.outcome }}
          MIGRATE: ${{ steps.migrate.outcome }}
          FOCUSED: ${{ steps.focused.outcome }}
          RUFF: ${{ steps.ruff.outcome }}
          REGRESSION: ${{ steps.regression.outcome }}
        run: |
          mkdir -p docs/verification
          {
            echo '# Plan 03a Task 1 encryption verification'
            echo
            echo "- dependency lock: ${LOCK}"
            echo "- locked installation: ${PREPARE}"
            echo "- disposable DB migration: ${MIGRATE}"
            echo "- focused encryption tests: ${FOCUSED}"
            echo "- Ruff: ${RUFF}"
            echo "- complete Python regression: ${REGRESSION}"
            echo
            echo '## Focused test tail'
            echo
            echo '```text'
            tail -n 100 /tmp/plan03a-task1-focused.log 2>/dev/null || true
            echo '```'
            echo
            echo '## Ruff output'
            echo
            echo '```text'
            cat /tmp/plan03a-task1-ruff.log 2>/dev/null || true
            echo '```'
            echo
            echo '## Regression tail'
            echo
            echo '```text'
            tail -n 50 /tmp/plan03a-task1-regression.log 2>/dev/null || true
            echo '```'
          } > docs/verification/plan03a-task1-encryption.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uv.lock docs/verification/plan03a-task1-encryption.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs: verify Plan 03a encryption boundary [skip ci]'
            git push origin HEAD:testing-codex
          fi
      - name: Enforce GREEN gate
        if: always()
        env:
          LOCK: ${{ steps.lock.outcome }}
          PREPARE: ${{ steps.prepare.outcome }}
          MIGRATE: ${{ steps.migrate.outcome }}
          FOCUSED: ${{ steps.focused.outcome }}
          RUFF: ${{ steps.ruff.outcome }}
          REGRESSION: ${{ steps.regression.outcome }}
        run: |
          test "$LOCK" = success
          test "$PREPARE" = success
          test "$MIGRATE" = success
          test "$FOCUSED" = success
          test "$RUFF" = success
          test "$REGRESSION" = success
