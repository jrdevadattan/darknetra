name: Repair Plan 03 Task 1 transient Redis service

on:
  push:
    branches: [testing-codex]
    paths:
      - .github/workflows/plan03-task1-redis-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: testing-codex
          fetch-depth: 0
      - name: Disable persistence before the broker restart experiment
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/plan03-task1-apply.yml')
          text = path.read_text(encoding='utf-8')
          marker = '''      - id: task
        name: Execute reviewed Task 1 implementation and release gate
'''
          insertion = '''      - name: Configure the service Redis as an explicitly transient broker
        shell: bash
        run: |
          set -euo pipefail
          REDIS_CONTAINER="$(docker ps --filter ancestor=redis:7.4-alpine --format '{{.ID}}' | head -n 1)"
          test -n "$REDIS_CONTAINER"
          docker exec "$REDIS_CONTAINER" redis-cli FLUSHALL | grep -q OK
          docker exec "$REDIS_CONTAINER" redis-cli CONFIG SET save "" | grep -q OK
          docker exec "$REDIS_CONTAINER" redis-cli CONFIG SET appendonly no | grep -q OK
          docker exec "$REDIS_CONTAINER" rm -f /data/dump.rdb /data/appendonly.aof

'''
          if insertion not in text:
              if marker not in text:
                  raise SystemExit('Task 1 workflow marker was not found')
              text = text.replace(marker, insertion + marker, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/plan03-task1-apply.yml
          git rm .github/workflows/plan03-task1-redis-repair.yml
          git commit -m 'ci: make Task 1 broker restart explicitly transient'
          git push origin HEAD:testing-codex
