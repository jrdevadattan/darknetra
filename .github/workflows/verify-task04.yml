name: Verify Task 04

on:
  push:
    branches: [testing-codex]
    paths:
      - .github/workflows/verify-task04.yml

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: testing-codex
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install exact workspace tooling
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          pnpm install --frozen-lockfile
          pnpm --filter @darknetra/web add -D @vitejs/plugin-react @testing-library/user-event
      - name: Verify Task 04 product state
        run: |
          pnpm --filter @darknetra/web test
          pnpm --filter @darknetra/web lint
          pnpm --filter @darknetra/web typecheck
          pnpm --filter @darknetra/web build
      - name: Commit resolved test-tool dependencies
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/package.json pnpm-lock.yaml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'test: lock DARKNETRA dashboard test tooling [skip ci]'
          git push origin HEAD:testing-codex
