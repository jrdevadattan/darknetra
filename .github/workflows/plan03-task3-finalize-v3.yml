name: Plan 03 Task 3 content-addressed storage release gate v3

on:
  push:
    branches: [testing-codex]
    paths:
      - .github/workflows/plan03-task3-finalize-v3.yml

concurrency:
  group: plan03-task3-finalize
  cancel-in-progress: false

permissions:
  contents: write
  statuses: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      DARKNETRA_ENVIRONMENT: development
      DARKNETRA_DATABASE_URL: postgresql+psycopg://darknetra:darknetra-task3-v3@127.0.0.1:5432/darknetra_plan03_task3_v3_test
      DARKNETRA_E2E_DATABASE_URL: postgresql+psycopg://darknetra:darknetra-task3-v3@127.0.0.1:5432/darknetra_plan03_task3_v3_test
      DARKNETRA_REDIS_URL: redis://127.0.0.1:6379/0
      DARKNETRA_WEB_ORIGIN: http://localhost:3000
      DARKNETRA_EVIDENCE_STORE_PATH: /tmp/darknetra-plan03-task3-v3
      NEXT_TELEMETRY_DISABLED: '1'
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: darknetra_plan03_task3_v3_test
          POSTGRES_USER: darknetra
          POSTGRES_PASSWORD: darknetra-task3-v3
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U darknetra -d darknetra_plan03_task3_v3_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: testing-codex
          fetch-depth: 0

      - name: Publish run locator
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' >/tmp/status.json
          import json, os
          print(json.dumps({
              "state": "pending",
              "context": "plan03/task3-final-v3",
              "description": f"GitHub Actions run {os.environ['GITHUB_RUN_ID']}",
              "target_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl --fail --silent --show-error --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data @/tmp/status.json \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: '0.12.4'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Prepare pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          pnpm --version

      - name: Generate runtime-only keys
        run: |
          python - <<'PY'
          import base64, json, os, secrets

          def key() -> str:
              return base64.b64encode(secrets.token_bytes(32)).decode("ascii")

          jwt, field, blind = key(), key(), key()
          for value in (jwt, field, blind):
              print(f"::add-mask::{value}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as out:
              out.write(f"DARKNETRA_JWT_SIGNING_KEY_B64={jwt}\n")
              out.write(f"DARKNETRA_FIELD_KEY_V1_B64={field}\n")
              out.write(
                  "DARKNETRA_FIELD_KEYRING_B64_JSON="
                  + json.dumps({"v1": field}, separators=(",", ":"))
                  + "\n"
              )
              out.write("DARKNETRA_FIELD_ACTIVE_KEY_VERSION=v1\n")
              out.write(f"DARKNETRA_FIELD_BLIND_INDEX_KEY_B64={blind}\n")
          PY

      - name: Stage the Evidence Vault container boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          compose_path = Path("docker-compose.yml")
          compose = compose_path.read_text(encoding="utf-8")
          compose = compose.replace(
              "DARKNETRA_EVIDENCE_STORE_PATH: /var/lib/darknetra/evidence-store",
              "DARKNETRA_EVIDENCE_STORE_PATH: /var/lib/darknetra/evidence",
          )
          compose = compose.replace(
              "- evidence-store:/var/lib/darknetra/evidence-store",
              "- evidence_store:/var/lib/darknetra/evidence",
          )
          compose = compose.replace("\n  evidence-store:\n", "\n  evidence_store:\n")
          if compose.count("- evidence_store:/var/lib/darknetra/evidence") != 2:
              raise SystemExit("Evidence Vault must be mounted exactly into API and worker")
          if compose.count("DARKNETRA_EVIDENCE_STORE_PATH: /var/lib/darknetra/evidence") != 1:
              raise SystemExit("shared API environment must define one Evidence Vault path")
          web = compose.split("\n  web:\n", 1)[1].split("\nnetworks:\n", 1)[0]
          if "evidence_store" in web or "/var/lib/darknetra/evidence" in web:
              raise SystemExit("web service must not receive Evidence Vault storage")
          compose_path.write_text(compose, encoding="utf-8")

          dockerfile_path = Path("infrastructure/docker/api.Dockerfile")
          dockerfile = dockerfile_path.read_text(encoding="utf-8")
          old = "RUN useradd --create-home --uid 10001 appuser\n"
          new = (
              "RUN useradd --create-home --uid 10001 appuser "
              "&& install -d -o appuser -g appuser /var/lib/darknetra/evidence\n"
          )
          if old in dockerfile:
              dockerfile = dockerfile.replace(old, new, 1)
          elif "/var/lib/darknetra/evidence" not in dockerfile:
              raise SystemExit("Evidence Vault directory is not prepared for appuser")
          dockerfile_path.write_text(dockerfile, encoding="utf-8")

          env_path = Path(".env.example")
          env = env_path.read_text(encoding="utf-8")
          if "DARKNETRA_EVIDENCE_STORE_PATH=" in env:
              env = "\n".join(
                  "DARKNETRA_EVIDENCE_STORE_PATH=.darknetra/evidence"
                  if line.startswith("DARKNETRA_EVIDENCE_STORE_PATH=")
                  else line
                  for line in env.splitlines()
              ) + "\n"
          else:
              env = env.rstrip() + (
                  "\n\n# Host-side content-addressed Evidence Vault path.\n"
                  "DARKNETRA_EVIDENCE_STORE_PATH=.darknetra/evidence\n"
              )
          env_path.write_text(env, encoding="utf-8")
          PY

      - name: Install frozen workspaces
        run: |
          uv sync --all-packages --dev --frozen
          pnpm install --frozen-lockfile

      - name: Verify migrations and Python tests
        run: |
          uv run alembic -c apps/api/alembic.ini upgrade head
          uv run ruff check .
          uv run pytest -q apps/api/tests/unit/test_local_object_store.py
          uv run pytest -q

      - name: Verify frontend regressions
        run: |
          pnpm --filter @darknetra/web lint
          pnpm --filter @darknetra/web typecheck
          pnpm --filter @darknetra/web test
          pnpm --filter @darknetra/web build

      - name: Verify Compose topology
        run: |
          docker compose -f docker-compose.yml config --format json >/tmp/compose.json
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path

          doc = json.loads(Path("/tmp/compose.json").read_text(encoding="utf-8"))
          target = "/var/lib/darknetra/evidence"
          for service in ("api", "worker"):
              volumes = doc["services"][service].get("volumes", [])
              matches = [volume for volume in volumes if volume.get("target") == target]
              assert len(matches) == 1, (service, volumes)
              assert matches[0].get("source") == "evidence_store", matches[0]
              assert doc["services"][service]["environment"]["DARKNETRA_EVIDENCE_STORE_PATH"] == target
          assert not any(
              volume.get("target") == target
              for volume in doc["services"]["web"].get("volumes", [])
          )
          assert "evidence_store" in doc["volumes"]
          PY

      - name: Build and smoke-test shared storage
        run: |
          set -euo pipefail
          project=darknetra-plan03-task3-v3
          docker compose -p "$project" -f docker-compose.yml build api worker
          docker compose -p "$project" -f docker-compose.yml \
            up -d --no-build --wait --wait-timeout 180 postgres redis api worker
          docker compose -p "$project" -f docker-compose.yml exec -T api sh -lc \
            'test -w "$DARKNETRA_EVIDENCE_STORE_PATH" && printf task3 > "$DARKNETRA_EVIDENCE_STORE_PATH/.shared-smoke"'
          docker compose -p "$project" -f docker-compose.yml exec -T worker sh -lc \
            'test "$(cat "$DARKNETRA_EVIDENCE_STORE_PATH/.shared-smoke")" = task3 && rm "$DARKNETRA_EVIDENCE_STORE_PATH/.shared-smoke"'
          docker compose -p "$project" -f docker-compose.yml exec -T worker sh -lc \
            'uv run --no-sync celery -A darknetra_api.jobs.celery_app:celery_app inspect ping -d "ingest@$HOSTNAME" --timeout=10 | grep -q pong'

      - name: Tear down smoke stack
        if: always()
        run: docker compose -p darknetra-plan03-task3-v3 -f docker-compose.yml down -v --remove-orphans || true

      - name: Record verified Task 3 and commit
        run: |
          source_sha="$(git rev-parse HEAD)"
          mkdir -p docs/verification
          cat > docs/verification/plan03-task3-content-addressed-storage.md <<EOF
          # Plan 03 Task 3 — content-addressed Evidence Vault storage verification

          - **Verified source:** \`${source_sha}\`
          - **Observed (UTC):** \`$(date -u +'%Y-%m-%dT%H:%M:%SZ')\`
          - **Runner:** GitHub Actions \`ubuntu-latest\`

          | Gate | Outcome |
          |---|---|
          | Frozen Python and frontend workspaces | success |
          | Alembic upgrade | success |
          | Ruff | success |
          | Focused Hypothesis/object-store suite | success |
          | Complete Python suite | success |
          | Frontend lint/typecheck/unit/build | success |
          | Base and development Compose validation | success |
          | API/worker-only named Evidence Vault volume | success |
          | Unprivileged API write and worker read through shared volume | success |
          | Real Celery worker ping | success |

          The implementation streams originals through random same-filesystem staging, computes SHA-256 during the write, rejects expected-digest mismatches, fsyncs and atomically promotes verified bytes to \`sha256/<first2>/<next2>/<digest>\`. Duplicate bytes deduplicate; caller filenames never become storage paths; malformed keys and tampered objects fail closed.
          EOF

          python - <<'PY'
          from pathlib import Path

          ledger = Path("docs/verification/plan03-execution-ledger.md")
          lines = ledger.read_text(encoding="utf-8").splitlines()
          value = "- Task 3: complete — content-addressed storage, atomic verified promotion, deduplication and isolated shared Docker volume verified."
          for index, line in enumerate(lines):
              if line.startswith("- Task 3:"):
                  lines[index] = value
                  break
          else:
              lines += ["", value]
          ledger.write_text("\n".join(lines).rstrip() + "\n", encoding="utf-8")
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docker-compose.yml infrastructure/docker/api.Dockerfile .env.example \
            docs/verification/plan03-task3-content-addressed-storage.md \
            docs/verification/plan03-execution-ledger.md
          for workflow in \
            .github/workflows/plan03-task3-finalize.yml \
            .github/workflows/plan03-task3-finalize-v2.yml \
            .github/workflows/plan03-task3-finalize-v3.yml; do
            test ! -f "$workflow" || git rm "$workflow"
          done
          git commit -m 'feat: verify content addressed Evidence Vault storage'
          git pull --rebase origin testing-codex
          git push origin HEAD:testing-codex

      - name: Publish terminal status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python - <<'PY' >/tmp/status.json
          import json, os
          success = os.environ["JOB_STATUS"] == "success"
          print(json.dumps({
              "state": "success" if success else "failure",
              "context": "plan03/task3-final-v3",
              "description": "Task 3 gate passed" if success else "Task 3 gate failed",
              "target_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl --fail --silent --show-error --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data @/tmp/status.json \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null
