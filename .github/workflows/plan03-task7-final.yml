name: Plan 03 Task 7 final media derivative gate

on:
  push:
    branches: [testing-codex]
    paths:
      - .github/workflows/plan03-task7-final.yml

permissions:
  contents: write
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DARKNETRA_ENVIRONMENT: development
      DARKNETRA_DATABASE_URL: postgresql+psycopg://darknetra:darknetra-task7-final@127.0.0.1:5432/darknetra_plan03_task7_final
      DARKNETRA_REDIS_URL: redis://127.0.0.1:6379/0
      DARKNETRA_WEB_ORIGIN: http://localhost:3000
      DARKNETRA_EVIDENCE_STORE_PATH: /tmp/darknetra-plan03-task7-final
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: darknetra_plan03_task7_final
          POSTGRES_USER: darknetra
          POSTGRES_PASSWORD: darknetra-task7-final
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U darknetra -d darknetra_plan03_task7_final"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: testing-codex
          fetch-depth: 0

      - name: Require Task 7 checkpoints
        run: |
          test -f docs/verification/plan03-task7-image.md
          test -f docs/verification/plan03-task7-pdf.md

      - name: Publish run locator
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' >/tmp/status.json
          import json, os
          print(json.dumps({
            "state": "pending",
            "context": "plan03/task7-final",
            "description": f"GitHub Actions run {os.environ['GITHUB_RUN_ID']}",
            "target_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl --fail --silent --show-error --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data @/tmp/status.json \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: '0.12.4'

      - name: Generate runtime-only keys
        run: |
          python - <<'PY'
          import base64, json, os, secrets
          def key(): return base64.b64encode(secrets.token_bytes(32)).decode("ascii")
          jwt, field, blind = key(), key(), key()
          for value in (jwt, field, blind): print(f"::add-mask::{value}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as out:
              out.write(f"DARKNETRA_JWT_SIGNING_KEY_B64={jwt}\n")
              out.write(f"DARKNETRA_FIELD_KEY_V1_B64={field}\n")
              out.write("DARKNETRA_FIELD_KEYRING_B64_JSON=" + json.dumps({"v1": field}, separators=(",", ":")) + "\n")
              out.write("DARKNETRA_FIELD_ACTIVE_KEY_VERSION=v1\n")
              out.write(f"DARKNETRA_FIELD_BLIND_INDEX_KEY_B64={blind}\n")
          PY

      - name: Verify dependencies migrations and suites
        run: |
          uv sync --all-packages --dev --frozen
          uv run alembic -c apps/api/alembic.ini upgrade head
          uv run alembic -c apps/api/alembic.ini downgrade 3f21c6d4a901
          uv run alembic -c apps/api/alembic.ini upgrade head
          uv run ruff check .
          uv run pytest -q \
            apps/api/tests/unit/test_image_parser.py \
            apps/api/tests/unit/test_pdf_parser.py
          uv run pytest -q

      - name: Static no-execution and privacy inspection
        run: |
          python - <<'PY'
          from pathlib import Path
          image = Path("apps/api/darknetra_api/parsers/image.py").read_text(encoding="utf-8")
          pdf = Path("apps/api/darknetra_api/parsers/pdf.py").read_text(encoding="utf-8")
          combined = image + "\n" + pdf
          for forbidden in (
              "subprocess", "requests.", "httpx.", "urllib.request", "socket.",
              "pytesseract", "easyocr", "ocrmypdf", "pdf2image", "fitz.open",
              ".decrypt(", "password=", "launch(", "eval(", "exec(",
          ):
              assert forbidden not in combined, forbidden
          assert 'format="PNG"' in image
          assert '"metadata_copied_to_preview": False' in image
          assert '"ocr_used": False' in pdf
          assert '"javascript_executed": False' in pdf
          assert '"actions_executed": False' in pdf
          assert '"password_attempted": False' in pdf
          PY

      - name: Validate and build API/worker images
        run: |
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config >/dev/null
          docker compose -f docker-compose.yml build api worker

      - name: Record Task 7 completion
        run: |
          mkdir -p docs/architecture docs/verification
          cat > docs/architecture/safe-image-and-pdf-derivatives.md <<'EOF'
          # Safe image and PDF derivatives

          ## Images

          DARKNETRA validates PNG, JPEG and WebP bytes with Pillow under explicit byte, dimension and pixel limits. EXIF orientation may be applied to the derivative, but private EXIF values are not copied or exposed. The preview is a newly encoded, bounded PNG with no EXIF, remote references, scripts or source metadata. The immutable original remains untouched.

          ## PDFs

          DARKNETRA parses the PDF object graph and extracts text without page rendering. It does not execute JavaScript, document actions, launch actions or embedded files. It does not attempt passwords. Encrypted PDFs remain preserved and return `TEXT_NOT_AVAILABLE` with an explicit warning. Blank and image-only PDFs also return `TEXT_NOT_AVAILABLE`; OCR is intentionally absent from this milestone. Active-feature marker names may be reported, but script bodies and embedded payloads are never copied into parser metadata or normalized text.

          ## Pipeline handoff

          These parsers only produce in-memory derivative results. Task 8 is responsible for storing preview/text bytes as separate child evidence objects, recording transformation lineage and applying `READY`, `PARTIAL`, `FAILED` or `QUARANTINED` semantics without changing the preserved original.
          EOF
          cat > docs/verification/plan03-task7-final.md <<EOF
          # Plan 03 Task 7 — final media derivative verification

          - **Verified source commit:** \`$(git rev-parse HEAD)\`
          - **Observed at (UTC):** \`$(date -u +'%Y-%m-%dT%H:%M:%SZ')\`
          - **Runner:** GitHub Actions \`ubuntu-latest\`

          | Gate | Outcome |
          |---|---|
          | Frozen dependencies and reversible migrations | success |
          | Ruff | success |
          | PNG/JPEG/WebP and EXIF/privacy tests | success |
          | Pixel/dimension/preview limit tests | success |
          | Text-bearing/image-only/encrypted PDF tests | success |
          | PDF action detection and no-execution tests | success |
          | Complete Python suite | success |
          | Static no-network/no-OCR/no-password/no-execution inspection | success |
          | Compose validation and API/worker image build | success |
          EOF
          python - <<'PY'
          from pathlib import Path
          ledger = Path("docs/verification/plan03-execution-ledger.md")
          if ledger.exists():
              lines = ledger.read_text(encoding="utf-8").splitlines()
              value = "- Task 7: complete — bounded metadata-stripping image previews and non-rendering, no-OCR, no-password PDF text derivatives verified."
              for index, line in enumerate(lines):
                  if line.startswith("- Task 7:"):
                      lines[index] = value
                      break
              else:
                  lines += ["", value]
              ledger.write_text("\n".join(lines).rstrip() + "\n", encoding="utf-8")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/architecture/safe-image-and-pdf-derivatives.md docs/verification/plan03-task7-final.md
          if test -f docs/verification/plan03-execution-ledger.md; then git add docs/verification/plan03-execution-ledger.md; fi
          git rm .github/workflows/plan03-task7-final.yml
          git commit -m 'docs: verify safe image and PDF derivatives [skip ci]'
          git push origin HEAD:testing-codex

      - name: Publish terminal status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python - <<'PY' >/tmp/status.json
          import json, os
          success = os.environ["JOB_STATUS"] == "success"
          print(json.dumps({
            "state": "success" if success else "failure",
            "context": "plan03/task7-final",
            "description": "Task 7 final gate passed" if success else "Task 7 final gate failed",
            "target_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl --fail --silent --show-error --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data @/tmp/status.json \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null
