          def _content_headers(*, evidence_id: UUID, disposition: str, media_type: str) -> dict[str, str]:
              extension = {
                  "text/plain": ".txt",
                  "text/html": ".html",
                  "image/png": ".png",
                  "image/jpeg": ".jpg",
                  "image/webp": ".webp",
                  "application/pdf": ".pdf",
                  "application/json": ".json",
                  "text/csv": ".csv",
                  "application/zip": ".zip",
              }.get(media_type, ".bin")
              return {
                  "Content-Disposition": f'{disposition}; filename="evidence-{evidence_id}{extension}"',
                  "Cache-Control": "no-store",
                  "Pragma": "no-cache",
                  "X-Content-Type-Options": "nosniff",
                  "Content-Security-Policy": "sandbox" if disposition == "attachment" else "default-src 'none'; img-src 'self' data:; style-src 'none'; script-src 'none'; frame-ancestors 'none'; sandbox",
              }


          @router.get("/cases/{case_id}/evidence/{evidence_id}/content")
          async def download_evidence_content(
              case_id: UUID,
              evidence_id: UUID,
              actor: Annotated[User, Depends(AUTH_DEPENDENCY)],
              session: Annotated[AsyncSession, Depends(SESSION_DEPENDENCY)],
