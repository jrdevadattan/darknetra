          python - <<'PY'
          from pathlib import Path

          route = Path("apps/api/darknetra_api/routes/evidence.py")
          text = route.read_text(encoding="utf-8")
          text = text.replace(
              "from fastapi import APIRouter, Depends, File, Form, HTTPException, Request, Response, UploadFile, status\n",
              "from fastapi import APIRouter, Depends, File, Form, HTTPException, Query, Request, Response, UploadFile, status\n",
              1,
          )
          streaming = "from fastapi.responses import StreamingResponse\n"
          if streaming not in text:
              marker = "from fastapi import "
              line_end = text.find("\n", text.find(marker)) + 1
              text = text[:line_end] + streaming + text[line_end:]
          old_schema = "from darknetra_api.schemas.evidence import EvidenceArtifactRead, EvidenceIntegrityRead\n"
          new_schema = '''from darknetra_api.schemas.evidence import (
              EvidenceArtifactRead,
              EvidenceDetailRead,
              EvidenceIntegrityRead,
              EvidenceListRead,
          )
          '''
          new_schema = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in new_schema.splitlines()
          ) + "\n"
          if old_schema in text:
              text = text.replace(old_schema, new_schema, 1)
          elif "EvidenceDetailRead" not in text:
              raise SystemExit("evidence schema import marker missing")
          model_import = "from darknetra_api.models.evidence import EvidenceSourceClass, EvidenceState\n"
          if model_import not in text:
              marker = "from darknetra_api.models.job import JobState\n"
              if marker not in text:
                  raise SystemExit("job state import marker missing")
              text = text.replace(marker, marker + model_import, 1)
          service_import = '''from darknetra_api.services.evidence_reads import (
              EvidenceIntegrityBlocked,
              InvalidEvidenceCursor,
              get_evidence_detail,
              list_case_evidence,
              open_guarded_content,
          )
          '''
          service_import = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in service_import.splitlines()
          ) + "\n"
          if service_import not in text:
              marker = "from darknetra_api.services.integrity import verify_evidence_integrity\n"
              if marker not in text:
                  raise SystemExit("integrity service import marker missing")
              text = text.replace(marker, marker + service_import, 1)
          route.write_text(text, encoding="utf-8")

          schema = Path("apps/api/darknetra_api/schemas/evidence.py")
          schema_text = schema.read_text(encoding="utf-8")
          if "from datetime import datetime" not in schema_text:
              marker = "from __future__ import annotations\n"
              schema_text = schema_text.replace(marker, marker + "\nfrom datetime import datetime\n", 1)
          schema.write_text(schema_text, encoding="utf-8")
          PY

