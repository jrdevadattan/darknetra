name: Plan 03 Task 5 chat adapter and archive lineage TDD

on:
  push:
    branches: [testing-codex]
    paths:
      - .github/workflows/plan03-task5-chat-lineage.yml

permissions:
  contents: write

jobs:
  red-green:
    runs-on: ubuntu-latest
    env:
      DARKNETRA_ENVIRONMENT: development
      DARKNETRA_DATABASE_URL: postgresql+psycopg://darknetra:darknetra-task5-chat@127.0.0.1:5432/darknetra_plan03_task5_chat
      DARKNETRA_REDIS_URL: redis://127.0.0.1:6379/0
      DARKNETRA_WEB_ORIGIN: http://localhost:3000
      DARKNETRA_EVIDENCE_STORE_PATH: /tmp/darknetra-plan03-task5-chat
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: darknetra_plan03_task5_chat
          POSTGRES_USER: darknetra
          POSTGRES_PASSWORD: darknetra-task5-chat
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U darknetra -d darknetra_plan03_task5_chat"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: testing-codex
          fetch-depth: 0
      - name: Require secure ZIP checkpoint
        run: test -f docs/verification/plan03-task5-archive-safety.md
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: '0.12.4'
      - name: Generate runtime-only keys
        run: |
          python - <<'PY'
          import base64, json, os, secrets
          def key(): return base64.b64encode(secrets.token_bytes(32)).decode("ascii")
          jwt, field, blind = key(), key(), key()
          for value in (jwt, field, blind): print(f"::add-mask::{value}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as out:
              out.write(f"DARKNETRA_JWT_SIGNING_KEY_B64={jwt}\n")
              out.write(f"DARKNETRA_FIELD_KEY_V1_B64={field}\n")
              out.write("DARKNETRA_FIELD_KEYRING_B64_JSON=" + json.dumps({"v1": field}, separators=(",", ":")) + "\n")
              out.write("DARKNETRA_FIELD_ACTIVE_KEY_VERSION=v1\n")
              out.write(f"DARKNETRA_FIELD_BLIND_INDEX_KEY_B64={blind}\n")
          PY
      - name: Install and migrate
        run: |
          uv sync --all-packages --dev --frozen
          uv run alembic -c apps/api/alembic.ini upgrade head

      - name: Write chat and lineage contracts first
        run: |
          cat > apps/api/tests/unit/test_chat_export.py <<'PY'
          from __future__ import annotations

          import importlib
          import importlib.util

          import pytest


          def chat_module():
              spec = importlib.util.find_spec("darknetra_api.parsers.chat_export")
              assert spec is not None, "generic chat export adapter is not implemented"
              return importlib.import_module("darknetra_api.parsers.chat_export")


          def test_json_export_is_structured_without_claiming_a_platform() -> None:
              module = chat_module()
              result = module.parse_chat_export(
                  b'{"messages":[{"id":"1","from":"Alias A","date":"2026-01-01T10:00:00Z","text":"authorized synthetic message"},{"id":"2","from":"Alias B","text":["split ",{"text":"message"}],"file":"photo.jpg"}]}',
                  media_type="application/json",
              )
              assert result.format == "GENERIC_JSON"
              assert result.platform is None
              assert [message.sender for message in result.messages] == ["Alias A", "Alias B"]
              assert result.messages[1].text == "split message"
              assert result.messages[1].attachments == ("photo.jpg",)


          def test_html_export_ignores_active_content_and_extracts_message_fields() -> None:
              module = chat_module()
              data = b'''<html><body>
              <script>stolen()</script><style>.hidden{}</style>
              <div class="message"><div class="from_name">Alias A</div><div class="date">2026-01-01</div><div class="text">Safe &amp; synthetic</div></div>
              </body></html>'''
              result = module.parse_chat_export(data, media_type="text/html")
              assert result.format == "GENERIC_HTML"
              assert len(result.messages) == 1
              assert result.messages[0].sender == "Alias A"
              assert result.messages[0].text == "Safe & synthetic"
              assert "stolen" not in result.normalized_text


          def test_text_export_recognizes_common_timestamp_sender_lines() -> None:
              module = chat_module()
              result = module.parse_chat_export(
                  b"[2026-01-01 10:00] Alias A: first message\n2026-01-01 10:01 - Alias B: second message\ncontinuation\n",
                  media_type="text/plain",
              )
              assert result.format == "GENERIC_TEXT"
              assert len(result.messages) == 2
              assert result.messages[0].sender == "Alias A"
              assert result.messages[1].sender == "Alias B"
              assert result.messages[1].text.endswith("continuation")


          def test_malformed_encoding_json_and_unbounded_records_fail_closed() -> None:
              module = chat_module()
              with pytest.raises(module.ChatExportError):
                  module.parse_chat_export(b"\xff\xfe", media_type="text/plain")
              with pytest.raises(module.ChatExportError):
                  module.parse_chat_export(b"{bad-json", media_type="application/json")
              data = b'{"messages":[{"text":"one"},{"text":"two"}]}'
              with pytest.raises(module.ChatExportLimitExceeded):
                  module.parse_chat_export(
                      data,
                      media_type="application/json",
                      limits=module.ChatExportLimits(max_messages=1),
                  )


          def test_unsupported_media_type_is_not_guessed() -> None:
              module = chat_module()
              with pytest.raises(module.UnsupportedChatExport):
                  module.parse_chat_export(b"PK\x03\x04", media_type="application/zip")
          PY

          cat > apps/api/tests/integration/test_archive_member_lineage.py <<'PY'
          from __future__ import annotations

          import importlib
          import importlib.util
          import io
          import zipfile
          from datetime import UTC, datetime
          from pathlib import Path
          from uuid import uuid4

          import pytest
          import sqlalchemy as sa
          from darknetra_api.db.session import async_session_factory
          from darknetra_api.models.audit import AuditEvent
          from darknetra_api.models.auth_session import AuthSession
          from darknetra_api.models.case import Case
          from darknetra_api.models.case_membership import CaseMembership, CaseMembershipRole
          from darknetra_api.models.custody import CustodyEvent
          from darknetra_api.models.enums import CaseSensitivity
          from darknetra_api.models.evidence import EvidenceArtifact, EvidenceDerivation, EvidenceSourceClass, EvidenceState
          from darknetra_api.models.job import Job
          from darknetra_api.models.user import User
          from darknetra_api.parsers.archive import extract_zip_to_store
          from darknetra_api.security.encryption import SensitiveFieldCrypto
          from darknetra_api.services.evidence import preserve_evidence_manifest
          from darknetra_api.storage.local import LocalObjectStore


          def lineage_module():
              spec = importlib.util.find_spec("darknetra_api.services.archive_ingest")
              assert spec is not None, "archive member lineage service is not implemented"
              return importlib.import_module("darknetra_api.services.archive_ingest")


          async def clean_database() -> None:
              async with async_session_factory() as session:
                  await session.execute(sa.delete(CustodyEvent))
                  await session.execute(sa.delete(EvidenceDerivation))
                  await session.execute(sa.delete(EvidenceArtifact))
                  await session.execute(sa.delete(Job))
                  await session.execute(sa.delete(CaseMembershipRole))
                  await session.execute(sa.delete(CaseMembership))
                  await session.execute(sa.delete(AuditEvent))
                  await session.execute(sa.delete(Case))
                  await session.execute(sa.delete(AuthSession))
                  await session.execute(sa.delete(User))
                  await session.commit()


          @pytest.fixture(autouse=True)
          async def clean() -> None:
              await clean_database()
              yield
              await clean_database()


          async def seed_parent(store: LocalObjectStore) -> tuple[User, Case, EvidenceArtifact, bytes]:
              buffer = io.BytesIO()
              with zipfile.ZipFile(buffer, "w", compression=zipfile.ZIP_DEFLATED) as archive:
                  archive.writestr("chat/result.json", b'{"messages":[{"from":"Alias","text":"safe synthetic"}]}')
                  archive.writestr("notes.txt", b"authorized notes")
                  archive.writestr("payload.bin", b"\x7fELF\x02\x01")
              archive_bytes = buffer.getvalue()
              stored = store.put_verified(io.BytesIO(archive_bytes))

              async with async_session_factory() as session:
                  suffix = uuid4().hex[:10]
                  owner = User(
                      username=f"archive-owner-{suffix}",
                      username_normalized=f"archive-owner-{suffix}",
                      display_name="Archive Owner",
                      password_hash="unused",
                      global_roles=[],
                      is_active=True,
                      must_change_password=False,
                  )
                  session.add(owner)
                  await session.flush()
                  case = Case(
                      case_code=f"ARC-{suffix.upper()}",
                      title="Authorized archive lineage fixture",
                      sensitivity=CaseSensitivity.RESTRICTED,
                      owner_user_id=owner.id,
                      source_authority_summary="Authorized synthetic archive",
                  )
                  session.add(case)
                  await session.flush()
                  parent = EvidenceArtifact(
                      case_id=case.id,
                      source_class=EvidenceSourceClass.SYNTHETIC,
                      source_type="synthetic.zip",
                      acquisition_method="authorized_test_generation",
                      collector_user_id=owner.id,
                      captured_at=datetime.now(UTC),
                      original_timezone="UTC",
                      state=EvidenceState.STAGING,
                  )
                  preserve_evidence_manifest(
                      parent,
                      media_type="application/zip",
                      size_bytes=stored.size_bytes,
                      sha256=stored.sha256,
                      sha512=None,
                      object_key=stored.object_key,
                  )
                  session.add(parent)
                  await session.commit()
                  await session.refresh(owner)
                  await session.refresh(case)
                  await session.refresh(parent)
                  return owner, case, parent, archive_bytes


          @pytest.mark.integration
          @pytest.mark.asyncio
          async def test_archive_members_become_separate_lineage_objects_and_binary_is_quarantined(tmp_path: Path) -> None:
              module = lineage_module()
              store = LocalObjectStore(tmp_path / "vault")
              owner, case, parent, archive_bytes = await seed_parent(store)
              members = extract_zip_to_store(io.BytesIO(archive_bytes), object_store=store)
              boundary = SensitiveFieldCrypto(
                  field_keys={"v1": b"E" * 32},
                  active_key_version="v1",
                  blind_index_key=b"F" * 32,
              )
              async with async_session_factory() as session:
                  result = await module.create_archive_member_evidence(
                      session=session,
                      parent_evidence_id=parent.id,
                      actor=owner,
                      members=members,
                      object_store=store,
                      crypto=boundary,
                      request_id=str(uuid4()),
                      transformer_version="1.0.0",
                  )
                  await session.commit()
                  child_ids = [child.id for child in result.children]

              async with async_session_factory() as session:
                  children = (
                      await session.execute(
                          sa.select(EvidenceArtifact).where(EvidenceArtifact.id.in_(child_ids))
                      )
                  ).scalars().all()
                  derivations = (
                      await session.execute(
                          sa.select(EvidenceDerivation).where(EvidenceDerivation.parent_evidence_id == parent.id)
                      )
                  ).scalars().all()
                  custody = (
                      await session.execute(
                          sa.select(CustodyEvent).where(CustodyEvent.evidence_id.in_(child_ids))
                      )
                  ).scalars().all()
                  assert len(children) == 3
                  assert len(derivations) == 3
                  assert len(custody) == 3
                  assert all(child.case_id == case.id for child in children)
                  assert all(child.source_locator_ciphertext is not None for child in children)
                  assert all(child.object_key and child.object_key.startswith("sha256/") for child in children)
                  assert all("chat" not in (child.object_key or "") for child in children)
                  binary = next(child for child in children if child.source_type.endswith("unsupported"))
                  assert binary.state is EvidenceState.QUARANTINED
                  approved = [child for child in children if child is not binary]
                  assert all(child.state is EvidenceState.PRESERVED for child in approved)
          PY

      - name: Prove RED before implementation
        run: |
          set +e
          uv run pytest -q apps/api/tests/unit/test_chat_export.py apps/api/tests/integration/test_archive_member_lineage.py >/tmp/task5-chat-red.log 2>&1
          code=$?
          set -e
          test "$code" -ne 0
          grep -Eq 'generic chat export adapter is not implemented|archive member lineage service is not implemented' /tmp/task5-chat-red.log

      - name: Implement generic chat export adapter
        run: |
          cat > apps/api/darknetra_api/parsers/chat_export.py <<'PY'
          from __future__ import annotations

          import json
          import re
          from dataclasses import dataclass
          from html.parser import HTMLParser
          from typing import Any


          class ChatExportError(ValueError):
              pass


          class ChatExportLimitExceeded(ChatExportError):
              pass


          class UnsupportedChatExport(ChatExportError):
              pass


          @dataclass(frozen=True, slots=True)
          class ChatExportLimits:
              max_input_bytes: int = 50 * 1024 * 1024
              max_messages: int = 100_000
              max_message_chars: int = 64 * 1024

              def __post_init__(self) -> None:
                  if min(self.max_input_bytes, self.max_messages, self.max_message_chars) <= 0:
                      raise ValueError("chat export limits must be positive")


          @dataclass(frozen=True, slots=True)
          class ChatMessage:
              index: int
              message_id: str | None
              sender: str | None
              timestamp: str | None
              text: str
              attachments: tuple[str, ...] = ()


          @dataclass(frozen=True, slots=True)
          class ChatParseResult:
              format: str
              platform: None
              messages: tuple[ChatMessage, ...]
              warnings: tuple[str, ...] = ()

              @property
              def normalized_text(self) -> str:
                  return "\n".join(message.text for message in self.messages if message.text)


          def _decode(data: bytes, limits: ChatExportLimits) -> str:
              if not isinstance(data, bytes):
                  raise TypeError("chat export data must be bytes")
              if len(data) > limits.max_input_bytes:
                  raise ChatExportLimitExceeded("chat export exceeds the input byte limit")
              try:
                  return data.decode("utf-8")
              except UnicodeDecodeError as exc:
                  raise ChatExportError("chat export is not valid UTF-8") from exc


          def _flatten_text(value: Any) -> str:
              if value is None:
                  return ""
              if isinstance(value, str):
                  return value
              if isinstance(value, (int, float, bool)):
                  return str(value)
              if isinstance(value, list):
                  return "".join(_flatten_text(item) for item in value)
              if isinstance(value, dict):
                  for key in ("text", "content", "value", "caption"):
                      if key in value:
                          return _flatten_text(value[key])
              return ""


          def _bounded_message(message: ChatMessage, limits: ChatExportLimits) -> ChatMessage:
              if len(message.text) > limits.max_message_chars:
                  raise ChatExportLimitExceeded("one message exceeds the character limit")
              return message


          def _parse_json(text: str, limits: ChatExportLimits) -> ChatParseResult:
              try:
                  payload = json.loads(text)
              except (json.JSONDecodeError, RecursionError) as exc:
                  raise ChatExportError("chat JSON is malformed") from exc
              if isinstance(payload, list):
                  records = payload
              elif isinstance(payload, dict):
                  records = payload.get("messages")
                  if records is None:
                      records = payload.get("items") or payload.get("records")
              else:
                  records = None
              if not isinstance(records, list):
                  raise ChatExportError("chat JSON does not contain a message list")
              if len(records) > limits.max_messages:
                  raise ChatExportLimitExceeded("chat export exceeds the message limit")
              messages: list[ChatMessage] = []
              for index, record in enumerate(records):
                  if not isinstance(record, dict):
                      continue
                  text_value = _flatten_text(
                      record.get("text", record.get("message", record.get("body", record.get("content"))))
                  ).strip()
                  attachments: list[str] = []
                  for key in ("file", "file_name", "photo", "media", "attachment"):
                      value = record.get(key)
                      if isinstance(value, str) and value.strip():
                          attachments.append(value.strip())
                      elif isinstance(value, list):
                          attachments.extend(str(item).strip() for item in value if str(item).strip())
                  if not text_value and not attachments:
                      continue
                  message = ChatMessage(
                      index=len(messages),
                      message_id=str(record.get("id")) if record.get("id") is not None else None,
                      sender=_flatten_text(
                          record.get("from", record.get("sender", record.get("author")))
                      ).strip() or None,
                      timestamp=_flatten_text(
                          record.get("date", record.get("timestamp", record.get("time")))
                      ).strip() or None,
                      text=text_value,
                      attachments=tuple(attachments),
                  )
                  messages.append(_bounded_message(message, limits))
                  if len(messages) > limits.max_messages:
                      raise ChatExportLimitExceeded("chat export exceeds the message limit")
              return ChatParseResult(format="GENERIC_JSON", platform=None, messages=tuple(messages))


          class _MessageHTMLParser(HTMLParser):
              _SKIP = {"script", "style", "noscript", "iframe", "object", "embed"}

              def __init__(self) -> None:
                  super().__init__(convert_charrefs=True)
                  self.skip_depth = 0
                  self.stack: list[tuple[str, set[str]]] = []
                  self.current: dict[str, list[str]] | None = None
                  self.message_depth: int | None = None
                  self.messages: list[dict[str, str]] = []

              def handle_starttag(self, tag: str, attrs: list[tuple[str, str | None]]) -> None:
                  lower = tag.casefold()
                  if lower in self._SKIP:
                      self.skip_depth += 1
                  classes = {
                      token.casefold()
                      for key, value in attrs
                      if key.casefold() == "class" and value
                      for token in value.split()
                  }
                  self.stack.append((lower, classes))
                  if self.skip_depth:
                      return
                  if self.current is None and "message" in classes:
                      self.current = {"sender": [], "timestamp": [], "text": []}
                      self.message_depth = len(self.stack)

              def handle_endtag(self, tag: str) -> None:
                  lower = tag.casefold()
                  if self.current is not None and self.message_depth == len(self.stack):
                      self.messages.append(
                          {key: " ".join(value).strip() for key, value in self.current.items()}
                      )
                      self.current = None
                      self.message_depth = None
                  if self.stack:
                      self.stack.pop()
                  if lower in self._SKIP and self.skip_depth:
                      self.skip_depth -= 1

              def handle_data(self, data: str) -> None:
                  if self.skip_depth or self.current is None or not data.strip():
                      return
                  classes = set().union(*(classes for _tag, classes in self.stack))
                  if classes & {"from_name", "sender", "author"}:
                      target = "sender"
                  elif classes & {"date", "time", "timestamp"}:
                      target = "timestamp"
                  elif classes & {"text", "message_text", "body"}:
                      target = "text"
                  else:
                      return
                  self.current[target].append(data.strip())


          def _parse_html(text: str, limits: ChatExportLimits) -> ChatParseResult:
              parser = _MessageHTMLParser()
              try:
                  parser.feed(text)
                  parser.close()
              except (RecursionError, ValueError) as exc:
                  raise ChatExportError("chat HTML is malformed") from exc
              if len(parser.messages) > limits.max_messages:
                  raise ChatExportLimitExceeded("chat export exceeds the message limit")
              result: list[ChatMessage] = []
              for record in parser.messages:
                  if not record["text"]:
                      continue
                  result.append(
                      _bounded_message(
                          ChatMessage(
                              index=len(result),
                              message_id=None,
                              sender=record["sender"] or None,
                              timestamp=record["timestamp"] or None,
                              text=record["text"],
                          ),
                          limits,
                      )
                  )
              return ChatParseResult(format="GENERIC_HTML", platform=None, messages=tuple(result))


          _TEXT_PATTERNS = (
              re.compile(r"^\[(?P<time>[^\]]+)\]\s*(?P<sender>[^:]{1,200}):\s*(?P<text>.*)$"),
              re.compile(r"^(?P<time>\d{4}-\d{2}-\d{2}[^-]{0,30})\s+-\s+(?P<sender>[^:]{1,200}):\s*(?P<text>.*)$"),
          )


          def _parse_text(text: str, limits: ChatExportLimits) -> ChatParseResult:
              messages: list[ChatMessage] = []
              for raw_line in text.splitlines():
                  line = raw_line.strip()
                  if not line:
                      continue
                  match = next((pattern.match(line) for pattern in _TEXT_PATTERNS if pattern.match(line)), None)
                  if match:
                      messages.append(
                          _bounded_message(
                              ChatMessage(
                                  index=len(messages),
                                  message_id=None,
                                  sender=match.group("sender").strip() or None,
                                  timestamp=match.group("time").strip() or None,
                                  text=match.group("text").strip(),
                              ),
                              limits,
                          )
                      )
                  elif messages:
                      previous = messages[-1]
                      combined = f"{previous.text}\n{line}"
                      messages[-1] = _bounded_message(
                          ChatMessage(
                              index=previous.index,
                              message_id=previous.message_id,
                              sender=previous.sender,
                              timestamp=previous.timestamp,
                              text=combined,
                              attachments=previous.attachments,
                          ),
                          limits,
                      )
                  else:
                      messages.append(
                          _bounded_message(
                              ChatMessage(
                                  index=0,
                                  message_id=None,
                                  sender=None,
                                  timestamp=None,
                                  text=line,
                              ),
                              limits,
                          )
                      )
                  if len(messages) > limits.max_messages:
                      raise ChatExportLimitExceeded("chat export exceeds the message limit")
              return ChatParseResult(format="GENERIC_TEXT", platform=None, messages=tuple(messages))


          def parse_chat_export(
              data: bytes,
              *,
              media_type: str,
              limits: ChatExportLimits | None = None,
          ) -> ChatParseResult:
              active = limits or ChatExportLimits()
              text = _decode(data, active)
              normalized = media_type.split(";", 1)[0].strip().casefold()
              if normalized == "application/json":
                  return _parse_json(text, active)
              if normalized in {"text/html", "application/xhtml+xml"}:
                  return _parse_html(text, active)
              if normalized == "text/plain":
                  return _parse_text(text, active)
              raise UnsupportedChatExport(f"unsupported chat export media type {normalized!r}")
          PY

      - name: Implement archive member evidence lineage service
        run: |
          cat > apps/api/darknetra_api/services/archive_ingest.py <<'PY'
          from __future__ import annotations

          from dataclasses import dataclass
          from datetime import UTC, datetime
          from uuid import UUID, uuid4

          from sqlalchemy.ext.asyncio import AsyncSession

          from darknetra_api.models.custody import CustodyEvent
          from darknetra_api.models.evidence import EvidenceArtifact, EvidenceDerivation, EvidenceState
          from darknetra_api.models.user import User
          from darknetra_api.parsers.archive import StoredArchiveMember
          from darknetra_api.policy.ingestion import UnsupportedMediaType, detect_media_type
          from darknetra_api.security.encryption import SensitiveFieldCrypto
          from darknetra_api.services.audit import append_audit_event
          from darknetra_api.services.evidence import preserve_evidence_manifest
          from darknetra_api.storage.base import ObjectStore


          @dataclass(frozen=True, slots=True)
          class ArchiveIngestResult:
              parent: EvidenceArtifact
              children: tuple[EvidenceArtifact, ...]
              derivations: tuple[EvidenceDerivation, ...]


          async def create_archive_member_evidence(
              *,
              session: AsyncSession,
              parent_evidence_id: UUID,
              actor: User,
              members: list[StoredArchiveMember],
              object_store: ObjectStore,
              crypto: SensitiveFieldCrypto,
              request_id: str,
              transformer_version: str,
          ) -> ArchiveIngestResult:
              parent = await session.get(EvidenceArtifact, parent_evidence_id)
              if parent is None or parent.case_id is None:
                  raise ValueError("parent evidence was not found")
              if parent.state not in {EvidenceState.PRESERVED, EvidenceState.PROCESSING, EvidenceState.READY, EvidenceState.PARTIAL}:
                  raise ValueError("parent evidence is not preserved")
              if parent.media_type != "application/zip":
                  raise ValueError("parent evidence is not a ZIP artifact")
              if actor.id != parent.collector_user_id:
                  # Route/worker authorization remains case-scoped; this service also
                  # rejects an unrelated actor when called directly.
                  raise ValueError("actor is not the parent evidence collector")

              children: list[EvidenceArtifact] = []
              derivations: list[EvidenceDerivation] = []
              for extracted in members:
                  child_id = uuid4()
                  with object_store.open(extracted.stored_object.object_key) as source:
                      prefix = source.read(64 * 1024)
                  try:
                      detected = detect_media_type(prefix)
                      state = EvidenceState.PRESERVED
                      source_type = f"archive.member.{detected.parser_family}"
                      quarantine_reason = None
                      media_type = detected.media_type
                  except UnsupportedMediaType:
                      state = EvidenceState.QUARANTINED
                      source_type = "archive.member.unsupported"
                      quarantine_reason = "UNSUPPORTED_ARCHIVE_MEMBER_TYPE"
                      media_type = "application/octet-stream"

                  child = EvidenceArtifact(
                      id=child_id,
                      case_id=parent.case_id,
                      source_class=parent.source_class,
                      source_type=source_type,
                      acquisition_method="derived_from_archive",
                      collector_user_id=actor.id,
                      captured_at=parent.captured_at,
                      original_timezone=parent.original_timezone,
                      state=EvidenceState.STAGING,
                      tool_name="darknetra.archive",
                      tool_version=transformer_version,
                  )
                  protected_path = (
                      f"archive-member://{parent.id}/{extracted.member.normalized_path}"
                  )
                  child.source_locator_ciphertext = crypto.encrypt(
                      protected_path,
                      purpose="evidence.source_locator",
                      resource_id=str(child_id),
                  )
                  child.source_locator_hash = crypto.blind_index(
                      protected_path,
                      purpose="evidence.source_locator",
                  )
                  child.notes_ciphertext = crypto.encrypt(
                      f"Original archive member path: {extracted.member.original_path}",
                      purpose="evidence.notes",
                      resource_id=str(child_id),
                  )
                  preserve_evidence_manifest(
                      child,
                      media_type=media_type,
                      size_bytes=extracted.stored_object.size_bytes,
                      sha256=extracted.stored_object.sha256,
                      sha512=None,
                      object_key=extracted.stored_object.object_key,
                      ingested_at=datetime.now(UTC),
                  )
                  if state is EvidenceState.QUARANTINED:
                      child.state = state
                      child.quarantine_reason = quarantine_reason
                  session.add(child)
                  await session.flush()

                  derivation = EvidenceDerivation(
                      parent_evidence_id=parent.id,
                      child_evidence_id=child.id,
                      transformation="archive_member",
                      transformer_version=transformer_version,
                      parameters_json={
                          "archive_index": extracted.member.archive_index,
                          "media_type": media_type,
                          "size_bytes": extracted.stored_object.size_bytes,
                      },
                  )
                  session.add(derivation)
                  session.add(
                      CustodyEvent(
                          evidence_id=child.id,
                          case_id=parent.case_id,
                          actor_user_id=actor.id,
                          event_type="DERIVED_FROM_ARCHIVE",
                          request_id=request_id,
                          reason="Child artifact preserved from a policy-approved archive member",
                          metadata_json={
                              "parent_evidence_id": str(parent.id),
                              "archive_index": extracted.member.archive_index,
                          },
                      )
                  )
                  append_audit_event(
                      session,
                      actor_user_id=actor.id,
                      event_type="EVIDENCE_DERIVED",
                      resource_type="evidence",
                      resource_id=str(child.id),
                      case_id=parent.case_id,
                      request_id=request_id,
                      metadata={
                          "parent_evidence_id": str(parent.id),
                          "transformation": "archive_member",
                          "state": child.state.value,
                      },
                  )
                  children.append(child)
                  derivations.append(derivation)
              await session.flush()
              return ArchiveIngestResult(
                  parent=parent,
                  children=tuple(children),
                  derivations=tuple(derivations),
              )
          PY

