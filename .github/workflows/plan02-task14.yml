name: Plan 02 Task 14 final verification

# RED diagnostic for the local SameSite hostname contract.
on:
  push:
    branches: [testing-codex]
    paths:
      - .github/workflows/plan02-task14.yml

permissions:
  contents: write

jobs:
  verify-local-origin-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: testing-codex
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: '0.12.4'
      - id: prepare
        continue-on-error: true
        run: uv sync --all-packages --dev --frozen
      - id: compose_test
        if: steps.prepare.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          uv run pytest tests/repo/test_compose_contract.py -q 2>&1 | tee /tmp/task14-origin-red.log
      - name: Record SameSite RED outcome
        if: always()
        env:
          PREPARE: ${{ steps.prepare.outcome }}
          COMPOSE_TEST: ${{ steps.compose_test.outcome }}
        run: |
          {
            echo '# Plan 02 Task 14 preflight'
            echo
            echo "- prepare: ${PREPARE}"
            echo "- local SameSite hostname contract: ${COMPOSE_TEST}"
            echo
            echo '```text'
            cat /tmp/task14-origin-red.log 2>/dev/null || true
            echo '```'
          } > docs/verification/plan02-task14-preflight.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/verification/plan02-task14-preflight.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs: record Plan 02 Task 14 SameSite RED outcome [skip ci]'
            git push origin HEAD:testing-codex
          fi
      - name: Require SameSite RED before example fix
        if: always()
        env:
          PREPARE: ${{ steps.prepare.outcome }}
          COMPOSE_TEST: ${{ steps.compose_test.outcome }}
        run: |
          test "$PREPARE" = success
          test "$COMPOSE_TEST" = failure
