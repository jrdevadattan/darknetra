name: Stabilize DARKNETRA Plans 03 and 04 execution

on:
  push:
    branches: [testing-codex]
    paths:
      - .github/workflows/stabilize-plan34-runs.yml

permissions:
  contents: write
  actions: write

jobs:
  stabilize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: testing-codex
          fetch-depth: 0

      - name: Keep only the newest primary completion run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t PRIMARY_RUNS < <(
            gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/complete-plan03-plan04.yml/runs?branch=testing-codex&per_page=100" \
              --jq '.workflow_runs | map(select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "requested" or .status == "pending")) | sort_by(.created_at) | reverse | .[].id'
          )
          if test "${#PRIMARY_RUNS[@]}" -gt 0; then
            KEEP="${PRIMARY_RUNS[0]}"
            echo "Keeping newest primary run ${KEEP}"
            for RUN_ID in "${PRIMARY_RUNS[@]:1}"; do
              echo "Cancelling superseded primary run ${RUN_ID}"
              gh api --method POST "/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/cancel" || true
            done
          fi

      - name: Cancel temporary monitor and fallback runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for WORKFLOW in monitor-plan03-plan04.yml fallback-plan03-plan04-aider.yml; do
            mapfile -t RUNS < <(
              gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW}/runs?branch=testing-codex&per_page=100" \
                --jq '.workflow_runs | map(select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "requested" or .status == "pending")) | .[].id' \
                2>/dev/null || true
            )
            for RUN_ID in "${RUNS[@]}"; do
              echo "Cancelling ${WORKFLOW} run ${RUN_ID}"
              gh api --method POST "/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/cancel" || true
            done
          done

      - name: Remove temporary orchestration workflows
        run: |
          for FILE in \
            .github/workflows/monitor-plan03-plan04.yml \
            .github/workflows/fallback-plan03-plan04-aider.yml \
            .github/workflows/fix-plan34-bootstrap.yml \
            .github/workflows/stabilize-plan34-runs.yml; do
            if test -f "$FILE"; then git rm "$FILE"; fi
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove temporary Plans 03 and 04 orchestration'
          git pull --rebase origin testing-codex
          git push origin HEAD:testing-codex
