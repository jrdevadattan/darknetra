name: Plan 03a Task 2 encrypted fields GREEN gate

# Final rerun after encrypted-field test import ordering was corrected.
on:
  push:
    branches: [testing-codex]
    paths:
      - .github/workflows/plan03a-task2-green.yml

permissions:
  contents: write

jobs:
  verify-green:
    runs-on: ubuntu-latest
    env:
      DARKNETRA_DATABASE_URL: postgresql+psycopg://darknetra:darknetra-plan03a@127.0.0.1:5432/darknetra_plan03a_test
      DARKNETRA_E2E_DATABASE_URL: postgresql+psycopg://darknetra:darknetra-plan03a@127.0.0.1:5432/darknetra_plan03a_test
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: darknetra_plan03a_test
          POSTGRES_USER: darknetra
          POSTGRES_PASSWORD: darknetra-plan03a
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U darknetra -d darknetra_plan03a_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: testing-codex
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: '0.12.4'
      - id: runtime_keys
        name: Generate runtime-only test keys
        continue-on-error: true
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path
          names = (
              "DARKNETRA_JWT_SIGNING_KEY_B64",
              "DARKNETRA_FIELD_KEY_V1_B64",
              "DARKNETRA_FIELD_BLIND_INDEX_KEY_B64",
          )
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as target:
              for name in names:
                  value = base64.b64encode(os.urandom(32)).decode("ascii")
                  print(f"::add-mask::{value}")
                  target.write(f"{name}={value}\n")
          PY
      - id: prepare
        if: steps.runtime_keys.outcome == 'success'
        continue-on-error: true
        run: uv sync --all-packages --dev --frozen
      - id: migrate
        if: steps.prepare.outcome == 'success'
        continue-on-error: true
        run: uv run alembic -c apps/api/alembic.ini upgrade head
      - id: focused
        name: Encrypted persistence helper tests
        if: steps.prepare.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          uv run pytest apps/api/tests/unit/test_encrypted_fields.py -v 2>&1 | tee /tmp/plan03a-task2-focused.log
      - id: ruff
        name: Ruff encrypted-field helpers
        if: steps.prepare.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          uv run ruff check apps/api/darknetra_api/security/encrypted_fields.py apps/api/tests/unit/test_encrypted_fields.py 2>&1 | tee /tmp/plan03a-task2-ruff.log
      - id: regression
        name: Complete Python regression suite
        if: steps.migrate.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          uv run pytest -q 2>&1 | tee /tmp/plan03a-task2-regression.log
      - name: Record observed verification
        if: always()
        env:
          KEYS: ${{ steps.runtime_keys.outcome }}
          PREPARE: ${{ steps.prepare.outcome }}
          MIGRATE: ${{ steps.migrate.outcome }}
          FOCUSED: ${{ steps.focused.outcome }}
          RUFF: ${{ steps.ruff.outcome }}
          REGRESSION: ${{ steps.regression.outcome }}
        run: |
          mkdir -p docs/verification
          {
            echo '# Plan 03a Task 2 encrypted-field helper verification'
            echo
            echo "- runtime-only keys: ${KEYS}"
            echo "- locked installation: ${PREPARE}"
            echo "- disposable DB migration: ${MIGRATE}"
            echo "- focused helper tests: ${FOCUSED}"
            echo "- Ruff: ${RUFF}"
            echo "- complete Python regression: ${REGRESSION}"
            echo
            echo '## Focused test tail'
            echo '```text'
            tail -n 100 /tmp/plan03a-task2-focused.log 2>/dev/null || true
            echo '```'
            echo
            echo '## Ruff output'
            echo '```text'
            cat /tmp/plan03a-task2-ruff.log 2>/dev/null || true
            echo '```'
            echo
            echo '## Regression tail'
            echo '```text'
            tail -n 45 /tmp/plan03a-task2-regression.log 2>/dev/null || true
            echo '```'
          } > docs/verification/plan03a-task2-encrypted-fields.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/verification/plan03a-task2-encrypted-fields.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs: verify Plan 03a encrypted-field helpers [skip ci]'
            git push origin HEAD:testing-codex
          fi
      - name: Enforce GREEN gate
        if: always()
        env:
          KEYS: ${{ steps.runtime_keys.outcome }}
          PREPARE: ${{ steps.prepare.outcome }}
          MIGRATE: ${{ steps.migrate.outcome }}
          FOCUSED: ${{ steps.focused.outcome }}
          RUFF: ${{ steps.ruff.outcome }}
          REGRESSION: ${{ steps.regression.outcome }}
        run: |
          test "$KEYS" = success
          test "$PREPARE" = success
          test "$MIGRATE" = success
          test "$FOCUSED" = success
          test "$RUFF" = success
          test "$REGRESSION" = success
