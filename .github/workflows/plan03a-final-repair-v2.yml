name: Repair Plan 03a final runtime probe v2

on:
  push:
    branches: [testing-codex]
    paths:
      - .github/workflows/plan03a-final-repair-v2.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: testing-codex
          fetch-depth: 0
      - name: Patch final probe and remove one-shot workflow
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/plan03a-final.yml')
          text = path.read_text(encoding='utf-8')
          old = "          uv run python - <<'PY'\n          from darknetra_api.config import Settings\n"
          new = "          PYTHONPATH=apps/api uv run python - <<'PY'\n          from darknetra_api.config import Settings\n"
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Plan 03a runtime-probe command not found')
          old_marker = '# Rerun after exposing loaded key versions to the runtime probe.\n'
          new_marker = '# Rerun after fixing the API workspace import in the runtime probe.\n'
          text = text.replace(old_marker, new_marker, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/plan03a-final.yml
          git rm .github/workflows/plan03a-final-repair-v2.yml
          git commit -m 'ci: fix Plan 03a runtime probe import'
          git push origin HEAD:testing-codex
