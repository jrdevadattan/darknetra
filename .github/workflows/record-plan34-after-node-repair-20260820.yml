name: Record Plans 03 and 04 status after Node repair

on:
  push:
    branches: [testing-codex]
    paths:
      - .github/workflows/record-plan34-after-node-repair-20260820.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: darknetra-plan34-status-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: testing-codex
          fetch-depth: 0

      - name: Wait for repair dispatch and locate fresh canonical run
        id: locate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASELINE="$(date -u -d '10 minutes ago' +'%Y-%m-%dT%H:%M:%SZ')"
          RUN_ID=''
          for attempt in $(seq 1 90); do
            git fetch origin testing-codex
            git reset --hard origin/testing-codex
            RUN_ID="$(
              gh run list \
                --workflow complete-plan03-plan04.yml \
                --branch testing-codex \
                --limit 10 \
                --json databaseId,createdAt,status \
                --jq ".[] | select(.createdAt >= \"${BASELINE}\") | .databaseId" \
                | head -n 1
            )"
            if test -n "$RUN_ID"; then
              echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo 'No fresh canonical run appeared after the repair.' >&2
          exit 2

      - name: Wait for canonical terminal state
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.locate.outputs.run_id }}
        run: |
          set -euo pipefail
          gh run watch "$RUN_ID" --exit-status || true
          STATUS="$(gh run view "$RUN_ID" --json status --jq .status)"
          test "$STATUS" = completed

      - name: Refresh branch and record authoritative state
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.locate.outputs.run_id }}
        run: |
          set -euo pipefail
          git fetch origin testing-codex
          git reset --hard origin/testing-codex

          RUN_STATUS="$(gh run view "$RUN_ID" --json status --jq .status)"
          RUN_CONCLUSION="$(gh run view "$RUN_ID" --json conclusion --jq .conclusion)"
          RUN_URL="$(gh run view "$RUN_ID" --json url --jq .url)"
          FAILED_STEPS="$(
            gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" \
              --jq '[.jobs[] | .name as $job | .steps[] | select(.conclusion == "failure") | "\($job) :: \(.name)"] | unique | if length == 0 then ["none"] else . end | join(", ")'
          )"

          CERT=false
          PLAN03=false
          PLAN04=false
          RELEASE=false
          README_FINAL=false
          test -f docs/verification/PLANS_03_04_COMPLETE.md && CERT=true
          test -f docs/verification/plan-03-evidence-vault-ingestion.md && PLAN03=true
          test -f docs/verification/plan-04-extraction-indicators.md && PLAN04=true
          test -f docs/verification/plans-03-04-release-gate.md \
            && grep -q 'Outcome: success' docs/verification/plans-03-04-release-gate.md \
            && RELEASE=true
          grep -q '<!-- PLAN34_VERIFIED_START -->' README.md && README_FINAL=true || true

          if test "$RUN_CONCLUSION" = success \
             && test "$CERT" = true \
             && test "$PLAN03" = true \
             && test "$PLAN04" = true \
             && test "$RELEASE" = true \
             && test "$README_FINAL" = true; then
            OUTCOME=COMPLETE
            EXPLANATION='The fresh canonical run passed and every required verification artifact is present.'
          elif test "$RUN_STATUS" = completed; then
            OUTCOME=BLOCKED
            EXPLANATION='The fresh canonical run is terminal, but either it failed or the complete certificate set is absent. No completion claim is valid.'
          else
            OUTCOME=IN_PROGRESS
            EXPLANATION='The canonical run has not reached a terminal state.'
          fi

          mkdir -p docs/verification
          cat > docs/verification/CURRENT_PLAN34_STATUS.md <<EOF
          # DARKNETRA Plans 03 and 04 — authoritative current status

          - **Outcome:** ${OUTCOME}
          - **Observed:** \`$(date -u +'%Y-%m-%dT%H:%M:%SZ')\`
          - **Branch head:** \`$(git rev-parse HEAD)\`
          - **Latest canonical run:** \`${RUN_ID}\`
          - **Run URL:** ${RUN_URL}
          - **Run status:** \`${RUN_STATUS}\`
          - **Run conclusion:** \`${RUN_CONCLUSION}\`
          - **Failed steps:** ${FAILED_STEPS}
          - **Plan 03 record present:** \`${PLAN03}\`
          - **Plan 04 record present:** \`${PLAN04}\`
          - **Canonical release record present:** \`${RELEASE}\`
          - **Independent certificate present:** \`${CERT}\`
          - **Verified README block present:** \`${README_FINAL}\`

          ${EXPLANATION}
          EOF

      - name: Commit status and remove monitor
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/verification/CURRENT_PLAN34_STATUS.md
          git rm .github/workflows/record-plan34-after-node-repair-20260820.yml
          git commit -m 'docs: refresh authoritative Plans 03 and 04 status [skip ci]'
          git fetch origin testing-codex
          git rebase origin/testing-codex
          git push origin HEAD:testing-codex

      - name: Record monitor failure
        if: failure()
        run: |
          set -euo pipefail
          mkdir -p docs/verification
          cat > docs/verification/plan34-status-monitor-failure.md <<EOF
          # Plans 03/04 status monitor failure

          - Source: \`$(git rev-parse HEAD)\`
          - Observed: \`$(date -u +'%Y-%m-%dT%H:%M:%SZ')\`
          - Located canonical run: \`${{ steps.locate.outputs.run_id }}\`

          The monitor could not produce a terminal authoritative status. No completion claim is valid.
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/verification/plan34-status-monitor-failure.md
          git commit -m 'docs: record Plan 03/04 status monitor failure [skip ci]' || true
          git fetch origin testing-codex
          git rebase origin/testing-codex || true
          git push origin HEAD:testing-codex || true
