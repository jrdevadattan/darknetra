name: Plan 03 Task 4 upload policy GREEN gate

on:
  push:
    branches: [testing-codex]
    paths:
      - .github/workflows/plan03-task4-policy-green.yml

permissions:
  contents: write
  statuses: write

jobs:
  green:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DARKNETRA_ENVIRONMENT: development
      DARKNETRA_DATABASE_URL: postgresql+psycopg://darknetra:darknetra-task4-green@127.0.0.1:5432/darknetra_plan03_task4_green
      DARKNETRA_REDIS_URL: redis://127.0.0.1:6379/0
      DARKNETRA_WEB_ORIGIN: http://localhost:3000
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: darknetra_plan03_task4_green
          POSTGRES_USER: darknetra
          POSTGRES_PASSWORD: darknetra-task4-green
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U darknetra -d darknetra_plan03_task4_green"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: testing-codex
          fetch-depth: 0

      - name: Publish run locator
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > /tmp/status.json
          import json, os
          print(json.dumps({
              "state": "pending",
              "context": "plan03/task4-policy",
              "description": f"GitHub Actions run {os.environ['GITHUB_RUN_ID']}",
              "target_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl --fail --silent --show-error --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data @/tmp/status.json \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: '0.12.4'

      - name: Generate runtime-only keys
        run: |
          python - <<'PY'
          import base64, json, os, secrets
          def key() -> str:
              return base64.b64encode(secrets.token_bytes(32)).decode('ascii')
          jwt = key(); field = key(); blind = key()
          for value in (jwt, field, blind):
              print(f'::add-mask::{value}')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write(f'DARKNETRA_JWT_SIGNING_KEY_B64={jwt}\n')
              output.write(f'DARKNETRA_FIELD_KEY_V1_B64={field}\n')
              output.write('DARKNETRA_FIELD_KEYRING_B64_JSON=' + json.dumps({'v1': field}, separators=(',', ':')) + '\n')
              output.write('DARKNETRA_FIELD_ACTIVE_KEY_VERSION=v1\n')
              output.write(f'DARKNETRA_FIELD_BLIND_INDEX_KEY_B64={blind}\n')
          PY

      - name: Require the verified RED contract
        run: |
          set -euo pipefail
          test -f docs/verification/plan03-task4-upload-policy-red.md
          test -f apps/api/tests/unit/test_ingestion_policy.py
          test ! -f apps/api/darknetra_api/policy/ingestion.py

      - name: Install locked workspace and migrate
        run: |
          uv sync --all-packages --dev --frozen
          uv run alembic -c apps/api/alembic.ini upgrade head

      - name: Implement the minimal safe upload policy
        run: |
          mkdir -p apps/api/darknetra_api/policy
          cat > apps/api/darknetra_api/policy/__init__.py <<'PY'
          """Fail-closed policies for evidence ingestion."""
          PY
          cat > apps/api/darknetra_api/policy/ingestion.py <<'PY'
          from __future__ import annotations

          import csv
          import io
          import json
          from collections.abc import BinaryIO, Iterator
          from dataclasses import dataclass
          from enum import StrEnum
          from typing import Self

          from pydantic import BaseModel, ConfigDict, Field, model_validator

          from darknetra_api.models.evidence import EvidenceSourceClass

          DEFAULT_MAX_UPLOAD_BYTES = 100 * 1024 * 1024
          HARD_MAX_UPLOAD_BYTES = 500 * 1024 * 1024
          _STREAM_CHUNK_BYTES = 64 * 1024
          _TEXT_SNIFF_LIMIT = 1024 * 1024


          class IngestionPolicyError(ValueError):
              """An artifact or its metadata violates the ingestion boundary."""


          class SupportedEvidenceType(StrEnum):
              WARC = "WARC"
              WARC_GZ = "WARC_GZ"
              HTML = "HTML"
              TEXT = "TEXT"
              JSON = "JSON"
              CSV = "CSV"
              ZIP = "ZIP"
              PNG = "PNG"
              JPEG = "JPEG"
              WEBP = "WEBP"
              PDF = "PDF"


          @dataclass(frozen=True, slots=True)
          class DetectedEvidenceType:
              evidence_type: SupportedEvidenceType
              media_type: str
              parser_family: str


          @dataclass(frozen=True, slots=True)
          class EvidenceUploadPolicy:
              """Size boundary shared by upload admission and streaming writers.

              Production upload handling should consume :meth:`iter_bounded` directly
              into object-store staging. ``read_bounded`` is a small adapter used by
              deterministic sniffing/tests; it must not be used by the upload route to
              buffer an entire 100 MiB artifact.
              """

              max_upload_bytes: int = DEFAULT_MAX_UPLOAD_BYTES

              def __post_init__(self) -> None:
                  if isinstance(self.max_upload_bytes, bool) or not isinstance(
                      self.max_upload_bytes, int
                  ):
                      raise ValueError("max_upload_bytes must be an integer")
                  if not 1 <= self.max_upload_bytes <= HARD_MAX_UPLOAD_BYTES:
                      raise ValueError(
                          "max_upload_bytes must be between 1 and the hard upload ceiling"
                      )

              def validate_declared_size(self, size_bytes: int | None) -> None:
                  if size_bytes is None:
                      return
                  if isinstance(size_bytes, bool) or not isinstance(size_bytes, int):
                      raise IngestionPolicyError("declared size must be a non-negative integer")
                  if size_bytes <= 0:
                      raise IngestionPolicyError("empty evidence is not accepted")
                  if size_bytes > self.max_upload_bytes:
                      raise IngestionPolicyError("evidence exceeds the configured maximum")

              def iter_bounded(
                  self,
                  stream: BinaryIO,
                  *,
                  chunk_size: int = _STREAM_CHUNK_BYTES,
              ) -> Iterator[bytes]:
                  if isinstance(chunk_size, bool) or not isinstance(chunk_size, int) or chunk_size <= 0:
                      raise ValueError("chunk_size must be a positive integer")
                  consumed = 0
                  while True:
                      remaining = self.max_upload_bytes - consumed
                      chunk = stream.read(min(chunk_size, remaining + 1))
                      if not chunk:
                          break
                      if not isinstance(chunk, bytes):
                          raise TypeError("evidence stream must yield bytes")
                      consumed += len(chunk)
                      if consumed > self.max_upload_bytes:
                          raise IngestionPolicyError("evidence exceeds the configured maximum")
                      yield chunk
                  if consumed == 0:
                      raise IngestionPolicyError("empty evidence is not accepted")

              def read_bounded(self, stream: BinaryIO) -> bytes:
                  return b"".join(self.iter_bounded(stream))


          class EvidenceSourceMetadata(BaseModel):
              model_config = ConfigDict(extra="forbid", str_strip_whitespace=True)

              source_class: EvidenceSourceClass
              source_type: str = Field(min_length=1, max_length=120)
              acquisition_method: str = Field(min_length=1, max_length=160)
              authority_reference: str | None = Field(default=None, min_length=1, max_length=500)

              @model_validator(mode="after")
              def require_external_authority(self) -> Self:
                  if self.source_class in {
                      EvidenceSourceClass.PUBLIC_OBSERVATION,
                      EvidenceSourceClass.AUTHORIZED_IMPORT,
                  } and not self.authority_reference:
                      raise ValueError(
                          "authority_reference is required for public observation or authorized import"
                      )
                  return self


          _PNG = DetectedEvidenceType(SupportedEvidenceType.PNG, "image/png", "image")
          _JPEG = DetectedEvidenceType(SupportedEvidenceType.JPEG, "image/jpeg", "image")
          _WEBP = DetectedEvidenceType(SupportedEvidenceType.WEBP, "image/webp", "image")
          _PDF = DetectedEvidenceType(SupportedEvidenceType.PDF, "application/pdf", "pdf")
          _ZIP = DetectedEvidenceType(SupportedEvidenceType.ZIP, "application/zip", "archive")
          _WARC = DetectedEvidenceType(SupportedEvidenceType.WARC, "application/warc", "warc")
          _WARC_GZ = DetectedEvidenceType(
              SupportedEvidenceType.WARC_GZ,
              "application/gzip",
              "warc",
          )
          _HTML = DetectedEvidenceType(SupportedEvidenceType.HTML, "text/html", "html")
          _JSON = DetectedEvidenceType(SupportedEvidenceType.JSON, "application/json", "json")
          _CSV = DetectedEvidenceType(SupportedEvidenceType.CSV, "text/csv", "csv")
          _TEXT = DetectedEvidenceType(SupportedEvidenceType.TEXT, "text/plain", "text")


          def _looks_like_html(text: str) -> bool:
              lowered = text.lstrip().casefold()
              return lowered.startswith(("<!doctype html", "<html", "<head", "<body", "<?xml"))


          def _looks_like_json(text: str) -> bool:
              stripped = text.lstrip()
              if not stripped.startswith(("{", "[")):
                  return False
              try:
                  json.loads(stripped)
              except (json.JSONDecodeError, RecursionError):
                  return False
              return True


          def _looks_like_csv(text: str) -> bool:
              sample = text[:64 * 1024]
              lines = [line for line in sample.splitlines() if line.strip()]
              if len(lines) < 2 or not any(delimiter in lines[0] for delimiter in (",", ";", "\t")):
                  return False
              try:
                  dialect = csv.Sniffer().sniff(sample, delimiters=",;\t")
                  rows = list(csv.reader(io.StringIO(sample), dialect=dialect))
              except (csv.Error, UnicodeError):
                  return False
              if len(rows) < 2 or len(rows[0]) < 2:
                  return False
              width = len(rows[0])
              return all(len(row) == width for row in rows[:20])


          def detect_evidence_type(
              payload: bytes,
              *,
              declared_filename: str | None = None,
          ) -> DetectedEvidenceType:
              """Classify from bytes; the untrusted caller filename is advisory only."""

              del declared_filename
              if not isinstance(payload, bytes):
                  raise TypeError("payload must be bytes")
              if not payload:
                  raise IngestionPolicyError("empty evidence is not accepted")

              if payload.startswith((b"MZ", b"\x7fELF")):
                  raise IngestionPolicyError("unsupported executable evidence type")
              if payload.startswith(b"\x89PNG\r\n\x1a\n"):
                  return _PNG
              if payload.startswith(b"\xff\xd8\xff"):
                  return _JPEG
              if len(payload) >= 12 and payload.startswith(b"RIFF") and payload[8:12] == b"WEBP":
                  return _WEBP
              if payload.startswith(b"%PDF-"):
                  return _PDF
              if payload.startswith((b"PK\x03\x04", b"PK\x05\x06", b"PK\x07\x08")):
                  return _ZIP
              if payload.startswith(b"\x1f\x8b"):
                  return _WARC_GZ
              if payload.startswith(b"WARC/"):
                  return _WARC
              if len(payload) > _TEXT_SNIFF_LIMIT:
                  sample = payload[:_TEXT_SNIFF_LIMIT]
              else:
                  sample = payload
              if b"\x00" in sample:
                  raise IngestionPolicyError("unsupported binary evidence type")
              try:
                  text = sample.decode("utf-8")
              except UnicodeDecodeError as exc:
                  raise IngestionPolicyError("unsupported binary evidence type") from exc
              if _looks_like_html(text):
                  return _HTML
              if _looks_like_json(text):
                  return _JSON
              if _looks_like_csv(text):
                  return _CSV
              if any(character.isprintable() or character in "\r\n\t" for character in text):
                  return _TEXT
              raise IngestionPolicyError("unsupported evidence type")
          PY

      - name: Run focused GREEN tests
        run: uv run pytest -q apps/api/tests/unit/test_ingestion_policy.py | tee /tmp/task4-policy-focused.txt

      - name: Run Ruff
        run: uv run ruff check .

      - name: Run complete Python regression suite
        run: uv run pytest -q | tee /tmp/task4-policy-python.txt

      - name: Commit verified policy implementation
        if: success()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/darknetra_api/policy/__init__.py apps/api/darknetra_api/policy/ingestion.py
          git commit -m 'feat: add safe evidence upload policy'
          VERIFIED_SHA="$(git rev-parse HEAD)"

          mkdir -p docs/verification
          cat > docs/verification/plan03-task4-upload-policy-green.md <<EOF
          # Plan 03 Task 4 — upload policy GREEN verification

          - **Verified code commit:** \`$VERIFIED_SHA\`
          - **Observed at (UTC):** \`$(date -u +'%Y-%m-%dT%H:%M:%SZ')\`
          - **Runner:** GitHub Actions \`ubuntu-latest\`

          | Gate | Outcome |
          |---|---|
          | Previously recorded RED contract | confirmed |
          | Focused upload-policy contract | success |
          | Ruff | success |
          | Complete Python regression suite | success |

          ## Implemented boundary

          - 100 MiB default and 500 MiB hard upload ceilings.
          - Declared-size and streamed-size enforcement with empty-input rejection.
          - Streaming iterator intended for object-store staging; the route must not buffer whole uploads.
          - Required authority references for \`PUBLIC_OBSERVATION\` and \`AUTHORIZED_IMPORT\`.
          - Byte-first detection for approved WARC/GZip, HTML, text, JSON, CSV, ZIP, PNG, JPEG, WebP, and PDF families.
          - Caller filenames do not control classification.
          - PE/ELF signatures and unknown binary inputs fail closed.

          Task 4 remains in progress: multipart routing, transactional preservation, encrypted metadata persistence, custody/audit creation, and post-commit job dispatch are not yet implemented.
          EOF

          git add docs/verification/plan03-task4-upload-policy-green.md
          git rm .github/workflows/plan03-task4-policy-green.yml
          if test -f .github/workflows/plan03-task4-red.yml; then
            git rm .github/workflows/plan03-task4-red.yml
          fi
          git commit -m 'docs: verify Task 4 upload policy boundary [skip ci]'
          git push origin HEAD:testing-codex

      - name: Publish terminal status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python - <<'PY' > /tmp/status.json
          import json, os
          success = os.environ['JOB_STATUS'] == 'success'
          print(json.dumps({
              "state": "success" if success else "failure",
              "context": "plan03/task4-policy",
              "description": "Task 4 policy gate passed" if success else "Task 4 policy gate failed",
              "target_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl --fail --silent --show-error --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data @/tmp/status.json \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null
