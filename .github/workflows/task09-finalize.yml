name: Task 09 finalize Plan 01

on:
  push:
    branches: [testing-codex]
    paths:
      - .github/workflows/task09-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: testing-codex
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: '0.12.4'

      - name: Prepare locked workspaces
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          uv sync --all-packages --dev
          pnpm install --frozen-lockfile
          pnpm --filter @darknetra/web exec playwright install --with-deps chromium

      - name: Write E2E specs and confirm red before Playwright server configuration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apps/web/e2e/online apps/web/e2e/offline

          cat > apps/web/e2e/online/investigator-workspace.spec.ts <<'EOF'
          import { expect, test } from '@playwright/test';

          const CASE_TABS = [
            'Overview',
            'Evidence',
            'Entities',
            'Activity Candidates',
            'Link Analysis',
            'NarcoGraph',
            'Timeline',
            'Alerts',
            'Reports',
          ];

          const REMOVED_SHOWCASES = [
            'Ecommerce',
            'CRM',
            'Finance',
            'Academy',
            'Demo Chat',
            'Mail Dashboard',
          ];

          test('desktop and mobile navigation expose only DARKNETRA workspaces', async ({ page }, testInfo) => {
            await page.goto('/dashboard');
            await expect(page.getByRole('heading', { name: 'Investigator overview' })).toBeVisible();

            if (testInfo.project.name.includes('mobile')) {
              await page.getByRole('button', { name: 'Toggle Sidebar' }).click();
            }

            await expect(page.getByRole('link', { name: 'Cases', exact: true }).first()).toBeVisible();
            const body = page.locator('body');
            for (const label of REMOVED_SHOWCASES) {
              await expect(body).not.toContainText(label);
            }
          });

          test('fixture case exposes all nine investigation tabs', async ({ page }) => {
            await page.goto('/cases/SYN-DEMO-001');
            await expect(page.getByRole('heading', { name: 'Alias correlation training case' })).toBeVisible();
            for (const label of CASE_TABS) {
              await expect(page.getByRole('link', { name: label, exact: true })).toBeVisible();
            }
            await page.getByRole('link', { name: 'Evidence', exact: true }).click();
            await expect(page).toHaveURL(/\/cases\/SYN-DEMO-001\/evidence$/);
            await expect(page.getByText('Evidence Vault begins in Plan 03')).toBeVisible();
          });

          test('System Health reports a measured reachable API', async ({ page }) => {
            await page.goto('/system/health');
            await expect(page.getByRole('heading', { name: 'System Health' })).toBeVisible();
            await expect(page.getByText('DARKNETRA API', { exact: true })).toBeVisible();
            await expect(page.getByText('Verified', { exact: true })).toBeVisible();
            await expect(page.getByText('ready', { exact: true })).toBeVisible();
          });
          EOF

          cat > apps/web/e2e/offline/system-health-offline.spec.ts <<'EOF'
          import { expect, test } from '@playwright/test';

          test('System Health reports an unavailable API without a false green state', async ({ page }) => {
            await page.goto('/system/health');
            await expect(page.getByRole('heading', { name: 'System Health' })).toBeVisible();
            await expect(page.getByText('DARKNETRA API unreachable', { exact: true })).toBeVisible();
            await expect(page.getByText('Offline', { exact: true })).toBeVisible();
            await expect(page.getByText('Verified', { exact: true })).toHaveCount(0);
          });
          EOF

          set +e
          pnpm --filter @darknetra/web test:e2e > /tmp/task09-red.log 2>&1
          status=$?
          set -e
          cat /tmp/task09-red.log
          if [ "$status" -eq 0 ]; then
            echo 'Task 09 E2E unexpectedly passed before server/config implementation.' >&2
            exit 1
          fi

      - name: Configure online and offline Playwright modes
        shell: bash
        run: |
          set -euo pipefail
          cat > apps/web/playwright.config.ts <<'EOF'
          import path from 'node:path';
          import { defineConfig, devices } from '@playwright/test';

          const ROOT = path.resolve(__dirname, '../..');

          export default defineConfig({
            testDir: './e2e/online',
            fullyParallel: false,
            timeout: 30_000,
            expect: { timeout: 8_000 },
            reporter: [['list']],
            use: {
              baseURL: 'http://127.0.0.1:3000',
              trace: 'retain-on-failure',
              screenshot: 'only-on-failure',
            },
            projects: [
              { name: 'desktop-chromium', use: { ...devices['Desktop Chrome'] } },
              { name: 'mobile-chromium', use: { ...devices['Pixel 7'] } },
            ],
            webServer: [
              {
                command:
                  'uv run uvicorn --app-dir apps/api darknetra_api.main:app --host 127.0.0.1 --port 8000',
                cwd: ROOT,
                url: 'http://127.0.0.1:8000/api/v1/health/live',
                reuseExistingServer: false,
                timeout: 120_000,
                env: { ...process.env, DARKNETRA_BUILD_VERSION: 'e2e' },
              },
              {
                command:
                  'pnpm --filter @darknetra/web exec next start --hostname 127.0.0.1 --port 3000',
                cwd: ROOT,
                url: 'http://127.0.0.1:3000/dashboard',
                reuseExistingServer: false,
                timeout: 120_000,
                env: {
                  ...process.env,
                  DARKNETRA_API_BASE_URL: 'http://127.0.0.1:8000',
                  NEXT_PUBLIC_DARKNETRA_API_BASE_URL: 'http://127.0.0.1:8000',
                },
              },
            ],
          });
          EOF

          cat > apps/web/playwright.offline.config.ts <<'EOF'
          import path from 'node:path';
          import { defineConfig, devices } from '@playwright/test';

          const ROOT = path.resolve(__dirname, '../..');

          export default defineConfig({
            testDir: './e2e/offline',
            fullyParallel: false,
            timeout: 30_000,
            expect: { timeout: 8_000 },
            reporter: [['list']],
            use: {
              baseURL: 'http://127.0.0.1:3001',
              trace: 'retain-on-failure',
            },
            projects: [{ name: 'offline-chromium', use: { ...devices['Desktop Chrome'] } }],
            webServer: {
              command:
                'pnpm --filter @darknetra/web exec next start --hostname 127.0.0.1 --port 3001',
              cwd: ROOT,
              url: 'http://127.0.0.1:3001/system/health',
              reuseExistingServer: false,
              timeout: 120_000,
              env: {
                ...process.env,
                DARKNETRA_API_BASE_URL: 'http://127.0.0.1:65534',
                NEXT_PUBLIC_DARKNETRA_API_BASE_URL: 'http://127.0.0.1:65534',
              },
            },
          });
          EOF

          node <<'NODE'
          const fs = require('fs');
          const path = 'apps/web/package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.scripts['test:e2e:online'] = 'playwright test --config playwright.config.ts';
          pkg.scripts['test:e2e:offline'] = 'playwright test --config playwright.offline.config.ts';
          pkg.scripts['test:e2e'] = 'pnpm test:e2e:online && pnpm test:e2e:offline';
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          NODE

      - name: Remove last known showcase-only dependency with a contract guard
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path('.')
          path = root / 'tests' / 'repo' / 'test_frontend_surface.py'
          text = path.read_text(encoding='utf-8')
          addition = '''\n\ndef test_calendar_showcase_dependency_is_not_retained() -> None:\n    package = json.loads((WEB / "package.json").read_text(encoding="utf-8"))\n    assert "@fullcalendar/react" not in package.get("dependencies", {})\n'''
          if 'test_calendar_showcase_dependency_is_not_retained' not in text:
              text = 'import json\n' + text + addition
              path.write_text(text, encoding='utf-8')
          PY

          set +e
          uv run pytest tests/repo/test_frontend_surface.py::test_calendar_showcase_dependency_is_not_retained -v > /tmp/calendar-red.log 2>&1
          status=$?
          set -e
          cat /tmp/calendar-red.log
          if [ "$status" -eq 0 ]; then
            echo 'Expected calendar dependency guard to be red before cleanup.' >&2
            exit 1
          fi

          if grep -R --include='*.ts' --include='*.tsx' -F '@fullcalendar/react' apps/web/src >/dev/null 2>&1; then
            echo 'Cannot remove @fullcalendar/react; source still imports it.' >&2
            exit 1
          fi
          pnpm --filter @darknetra/web remove @fullcalendar/react
          uv run pytest tests/repo/test_frontend_surface.py::test_calendar_showcase_dependency_is_not_retained -v

      - name: Add permanent CI and dependency update policy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/workflows docs/architecture docs/verification

          cat > .github/workflows/ci.yml <<'EOF'
          name: CI

          on:
            push:
              branches: [main, testing-codex]
            pull_request:
              branches: [main, testing-codex]

          permissions:
            contents: read

          jobs:
            python:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-python@v5
                  with:
                    python-version: '3.12'
                - uses: astral-sh/setup-uv@v10.0.1
                  with:
                    version: '0.12.4'
                - run: uv sync --all-packages --dev --frozen
                - run: uv run ruff check .
                - run: uv run pytest -q

            web:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: '24'
                - run: corepack enable && corepack prepare pnpm@10.15.0 --activate
                - run: pnpm install --frozen-lockfile
                - run: pnpm --filter @darknetra/web lint
                - run: pnpm --filter @darknetra/web typecheck
                - run: pnpm --filter @darknetra/web test
                - run: pnpm --filter @darknetra/web build

            e2e:
              runs-on: ubuntu-latest
              needs: [python, web]
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-python@v5
                  with:
                    python-version: '3.12'
                - uses: astral-sh/setup-uv@v10.0.1
                  with:
                    version: '0.12.4'
                - uses: actions/setup-node@v4
                  with:
                    node-version: '24'
                - run: uv sync --all-packages --dev --frozen
                - run: corepack enable && corepack prepare pnpm@10.15.0 --activate
                - run: pnpm install --frozen-lockfile
                - run: pnpm --filter @darknetra/web build
                - run: pnpm --filter @darknetra/web exec playwright install --with-deps chromium
                - run: pnpm --filter @darknetra/web test:e2e

            docker:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - run: docker compose -f docker-compose.yml -f docker-compose.dev.yml config >/dev/null
                - run: docker compose -f docker-compose.yml -f docker-compose.dev.yml build
          EOF

          cat > .github/dependabot.yml <<'EOF'
          version: 2
          updates:
            - package-ecosystem: npm
              directory: /
              schedule:
                interval: weekly
            - package-ecosystem: pip
              directory: /
              schedule:
                interval: weekly
            - package-ecosystem: pip
              directory: /apps/api
              schedule:
                interval: weekly
            - package-ecosystem: docker
              directory: /infrastructure/docker
              schedule:
                interval: weekly
            - package-ecosystem: github-actions
              directory: /
              schedule:
                interval: weekly
          EOF

      - name: Add exact development documentation
        shell: bash
        run: |
          cat > docs/architecture/development.md <<'EOF'
          # DARKNETRA development environment

          ## Required local tools

          - Node.js 24.x
          - pnpm 10.15.0 through Corepack
          - Python 3.12.x
          - uv 0.12.4
          - Docker with Compose v2 for the container workflow

          ## Bootstrap

          ```bash
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          pnpm install --frozen-lockfile
          uv sync --all-packages --dev --frozen
          ```

          ## Native API

          ```bash
          uv run uvicorn --app-dir apps/api darknetra_api.main:app --reload
          ```

          The API listens on `http://127.0.0.1:8000`; live health is `/api/v1/health/live` and readiness is `/api/v1/health/ready`.

          ## Native web

          In a second terminal:

          ```bash
          DARKNETRA_API_BASE_URL=http://127.0.0.1:8000 \
          NEXT_PUBLIC_DARKNETRA_API_BASE_URL=http://127.0.0.1:8000 \
          pnpm --filter @darknetra/web dev
          ```

          Open `http://127.0.0.1:3000/dashboard`.

          ## Docker workflow

          ```bash
          docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build -d --wait
          ```

          The base Compose file keeps services on an internal application bridge; the development overlay publishes only loopback ports `3000` and `8000`.

          Shut down with:

          ```bash
          docker compose -f docker-compose.yml -f docker-compose.dev.yml down -v --remove-orphans
          ```

          Run the complete container smoke check with:

          ```bash
          bash scripts/smoke.sh
          ```

          ## Verification commands

          ```bash
          uv run ruff check .
          uv run pytest -q
          pnpm --filter @darknetra/web lint
          pnpm --filter @darknetra/web typecheck
          pnpm --filter @darknetra/web test
          pnpm --filter @darknetra/web build
          pnpm --filter @darknetra/web exec playwright install chromium
          pnpm --filter @darknetra/web test:e2e
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config >/dev/null
          bash scripts/smoke.sh
          ```

          ## Plan 01 limitations

          - Authentication, persistent users, case membership, and server-enforced RBAC begin in Plan 02.
          - Case records shown in Plan 01 are explicitly synthetic/research fixtures.
          - Evidence Vault, extraction, correlation, graph, trends, and reports remain honest interface boundaries until their dedicated plans.
          - Tor, a cloud LLM, GPU access, and external services are not required for Plan 01 startup or verification.
          EOF

      - name: Build before browser verification
        run: pnpm --filter @darknetra/web build

      - name: Run online and offline Playwright regression
        run: pnpm --filter @darknetra/web test:e2e

      - name: Run final native verification gate
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff check .
          uv run pytest -q
          pnpm --filter @darknetra/web lint
          pnpm --filter @darknetra/web typecheck
          pnpm --filter @darknetra/web test
          pnpm --filter @darknetra/web build
          pnpm --filter @darknetra/web test:e2e
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config >/dev/null
          bash scripts/smoke.sh
          if command -v rg >/dev/null 2>&1; then
            if rg -n 'Ecommerce|CRM|Finance|Academy|Demo Chat|Mail Dashboard' apps/web/src; then
              echo 'Unrelated showcase labels remain.' >&2
              exit 1
            fi
          else
            if grep -R -n -E 'Ecommerce|CRM|Finance|Academy|Demo Chat|Mail Dashboard' apps/web/src; then
              echo 'Unrelated showcase labels remain.' >&2
              exit 1
            fi
          fi

      - name: Create verification record from the verified commit
        shell: bash
        run: |
          set -euo pipefail
          verified_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          verified_sha="$(git rev-parse HEAD)"
          mkdir -p docs/verification
          cat > docs/verification/plan-01-foundation-dashboard.md <<EOF
          # Plan 01 — Foundation and Investigator Dashboard Verification

          - Verified at (UTC): \`${verified_at}\`
          - Verified commit: \`${verified_sha}\`
          - Branch: \`testing-codex\`

          ## Fresh verification results

          The following commands were executed on the verified commit and exited successfully:

          - \`uv run ruff check .\`
          - \`uv run pytest -q\`
          - \`pnpm --filter @darknetra/web lint\`
          - \`pnpm --filter @darknetra/web typecheck\`
          - \`pnpm --filter @darknetra/web test\`
          - \`pnpm --filter @darknetra/web build\`
          - \`pnpm --filter @darknetra/web test:e2e\` (reachable API plus separate unavailable-API mode)
          - \`docker compose -f docker-compose.yml -f docker-compose.dev.yml config\`
          - \`bash scripts/smoke.sh\` (non-root API/web containers, API health, dashboard response)
          - showcase-label regression scan over \`apps/web/src\`

          ## Architecture deviations observed during implementation

          - The web runtime image copies the built pnpm workspace \`node_modules\` in addition to Next standalone output because the pinned Next/pnpm build retained runtime references into the pnpm store. This favors deterministic hackathon reliability over minimum image size; image slimming is deferred.
          - The implementation uses uv \`0.12.4\`, explicitly pinned in workflow/Docker setup instead of the older example version in the planning document.
          - The imported template had no \`apps/web/public\` directory, so the runtime image does not copy a nonexistent asset directory.

          ## Known Plan 01 limitations

          - User/session persistence, case-scoped RBAC, PostgreSQL, and audit persistence begin in Plan 02.
          - Cases and overview metrics are controlled fixtures and are labeled as such.
          - Evidence, extraction, identity correlation, graph, trends, and report pages are truthful interface boundaries for later plans and do not fabricate production results.
          - The optional lawful collector is not enabled or required.
          EOF

      - name: Replace temporary implementation workflows with permanent CI
        shell: bash
        run: |
          rm -f \
            .github/workflows/task05-cleanup.yml \
            .github/workflows/task06-investigator-shell.yml \
            .github/workflows/task07-api-health.yml \
            .github/workflows/verify-task07.yml \
            .github/workflows/task08-docker.yml \
            .github/workflows/task09-finalize.yml

      - name: Commit verified Plan 01 milestone
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: verify DARKNETRA foundation milestone [skip ci]'
          git push origin HEAD:testing-codex
