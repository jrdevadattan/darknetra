name: Plan 03 Task 2 GREEN gate

on:
  push:
    branches: [testing-codex]
    paths:
      - .github/workflows/plan03-task2-red.yml
      - apps/api/darknetra_api/models/evidence.py
      - apps/api/darknetra_api/models/custody.py
      - apps/api/darknetra_api/models/__init__.py
      - apps/api/darknetra_api/schemas/evidence.py
      - apps/api/darknetra_api/services/evidence.py
      - apps/api/alembic/versions/8a7f2d91c402_create_evidence_provenance.py
      - apps/api/tests/integration/test_evidence_provenance.py

permissions:
  contents: read
  statuses: write

jobs:
  green:
    runs-on: ubuntu-latest
    env:
      DARKNETRA_ENVIRONMENT: development
      DARKNETRA_DATABASE_URL: postgresql+psycopg://darknetra:darknetra-task2-green@127.0.0.1:5432/darknetra_plan03_task2_green
      DARKNETRA_REDIS_URL: redis://127.0.0.1:6379/0
      DARKNETRA_WEB_ORIGIN: http://localhost:3000
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: darknetra_plan03_task2_green
          POSTGRES_USER: darknetra
          POSTGRES_PASSWORD: darknetra-task2-green
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U darknetra -d darknetra_plan03_task2_green"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: testing-codex
      - name: Publish run locator
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > /tmp/status.json
          import json, os
          print(json.dumps({
              "state": "pending",
              "context": "plan03/task2-green",
              "description": f"GitHub Actions run {os.environ['GITHUB_RUN_ID']}",
              "target_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl --fail --silent --show-error --request POST --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" --header "X-GitHub-Api-Version: 2022-11-28" --data @/tmp/status.json "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: '0.12.4'
      - name: Generate runtime-only keys
        run: |
          python - <<'PY'
          import base64, json, os, secrets
          def key(): return base64.b64encode(secrets.token_bytes(32)).decode('ascii')
          jwt = key(); field = key(); blind = key()
          for value in (jwt, field, blind): print(f'::add-mask::{value}')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as out:
              out.write(f'DARKNETRA_JWT_SIGNING_KEY_B64={jwt}\n')
              out.write(f'DARKNETRA_FIELD_KEY_V1_B64={field}\n')
              out.write(f'DARKNETRA_FIELD_KEYRING_B64_JSON={json.dumps({"v1": field}, separators=(",", ":"))}\n')
              out.write('DARKNETRA_FIELD_ACTIVE_KEY_VERSION=v1\n')
              out.write(f'DARKNETRA_FIELD_BLIND_INDEX_KEY_B64={blind}\n')
          PY
      - name: Install locked workspace
        run: uv sync --all-packages --dev --frozen
      - name: Verify migrations
        run: |
          uv run alembic -c apps/api/alembic.ini upgrade head
          uv run alembic -c apps/api/alembic.ini downgrade 3f21c6d4a901
          uv run alembic -c apps/api/alembic.ini upgrade head
          uv run alembic -c apps/api/alembic.ini current
      - name: Ruff
        run: uv run ruff check .
      - name: Focused Task 2 suite
        run: uv run pytest -q apps/api/tests/integration/test_evidence_provenance.py
      - name: Complete Python suite
        run: uv run pytest -q
      - name: Publish terminal status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python - <<'PY' > /tmp/status.json
          import json, os
          ok = os.environ['JOB_STATUS'] == 'success'
          print(json.dumps({
              "state": "success" if ok else "failure",
              "context": "plan03/task2-green",
              "description": "Task 2 provenance schema and regression gates passed" if ok else "Task 2 GREEN gate failed",
              "target_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl --fail --silent --show-error --request POST --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" --header "X-GitHub-Api-Version: 2022-11-28" --data @/tmp/status.json "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null
