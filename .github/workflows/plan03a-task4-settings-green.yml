name: Plan 03a Task 4 settings integration GREEN gate

on:
  push:
    branches: [testing-codex]
    paths:
      - .github/workflows/plan03a-task4-settings-green.yml

permissions:
  contents: write

jobs:
  verify-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: testing-codex
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: '0.12.4'
      - id: prepare
        continue-on-error: true
        run: uv sync --all-packages --dev --frozen
      - id: tests
        if: steps.prepare.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          uv run pytest apps/api/tests/unit/test_sensitive_field_keyring.py -v 2>&1 | tee /tmp/keyring-settings-green.log
      - id: ruff
        if: steps.prepare.outcome == 'success'
        continue-on-error: true
        run: uv run ruff check apps/api/darknetra_api/security/encryption.py apps/api/darknetra_api/security/keyring.py apps/api/tests/unit/test_sensitive_field_keyring.py
      - name: Record observed GREEN
        if: always()
        env:
          PREPARE: ${{ steps.prepare.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          RUFF: ${{ steps.ruff.outcome }}
        run: |
          mkdir -p docs/verification
          {
            echo '# Plan 03a keyring settings GREEN verification'
            echo
            echo "- preparation: ${PREPARE}"
            echo "- versioned settings tests: ${TESTS}"
            echo "- Ruff: ${RUFF}"
            echo '```text'
            tail -n 120 /tmp/keyring-settings-green.log 2>/dev/null || true
            echo '```'
          } > docs/verification/plan03a-task4-settings-green.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/verification/plan03a-task4-settings-green.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs: verify keyring settings integration [skip ci]'
            git push origin HEAD:testing-codex
          fi
      - name: Enforce GREEN
        if: always()
        env:
          PREPARE: ${{ steps.prepare.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          RUFF: ${{ steps.ruff.outcome }}
        run: |
          test "$PREPARE" = success
          test "$TESTS" = success
          test "$RUFF" = success
