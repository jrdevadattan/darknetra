name: Plan 03 Task 3 RED gate

on:
  push:
    branches: [testing-codex]
    paths:
      - .github/workflows/plan03-task3-red.yml

permissions:
  contents: read
  statuses: write

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: testing-codex
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: '0.12.4'
      - name: Install locked workspace
        run: uv sync --all-packages --dev --frozen
      - id: focused
        name: Execute Task 3 storage contracts
        continue-on-error: true
        run: uv run pytest -q apps/api/tests/unit/test_local_object_store.py
      - name: Assert RED failure is real
        run: test "${{ steps.focused.outcome }}" = "failure"
      - name: Publish RED confirmation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > /tmp/status.json
          import json, os
          print(json.dumps({
              "state": "success",
              "context": "plan03/task3-red",
              "description": "Task 3 storage contracts fail before implementation as expected",
              "target_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl --fail --silent --show-error --request POST --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" --header "X-GitHub-Api-Version: 2022-11-28" --data @/tmp/status.json "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null
