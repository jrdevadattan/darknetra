name: Plan 03a Task 2 encrypted fields RED gate

on:
  push:
    branches: [testing-codex]
    paths:
      - .github/workflows/plan03a-task2-red.yml

permissions:
  contents: write

jobs:
  verify-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: testing-codex
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: '0.12.4'
      - id: prepare
        name: Install locked workspace
        continue-on-error: true
        run: uv sync --all-packages --dev --frozen
      - id: tests
        name: Run missing encrypted-field helper contract
        if: steps.prepare.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          uv run pytest apps/api/tests/unit/test_encrypted_fields.py -v 2>&1 | tee /tmp/plan03a-task2-red.log
      - name: Record observed RED result
        if: always()
        env:
          PREPARE: ${{ steps.prepare.outcome }}
          TESTS: ${{ steps.tests.outcome }}
        run: |
          mkdir -p docs/verification
          {
            echo '# Plan 03a Task 2 RED verification'
            echo
            echo "- workspace preparation: ${PREPARE}"
            echo "- focused helper contract: ${TESTS}"
            echo
            echo '```text'
            tail -n 120 /tmp/plan03a-task2-red.log 2>/dev/null || true
            echo '```'
          } > docs/verification/plan03a-task2-red.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/verification/plan03a-task2-red.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs: record Plan 03a Task 2 RED outcome [skip ci]'
            git push origin HEAD:testing-codex
          fi
      - name: Require RED before implementation
        if: always()
        env:
          PREPARE: ${{ steps.prepare.outcome }}
          TESTS: ${{ steps.tests.outcome }}
        run: |
          test "$PREPARE" = success
          test "$TESTS" = failure
