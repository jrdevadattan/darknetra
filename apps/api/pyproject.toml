[project]
name = "darknetra-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.135,<0.136",
  "pydantic-settings>=2.10,<3",
  "uvicorn[standard]>=0.35,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "alembic>=1.16,<2",
  "psycopg[binary,pool]>=3.2,<4",
]

[dependency-groups]
dev = ["pytest>=8.4,<9", "httpx>=0.28,<1", "pytest-asyncio>=0.24,<1"]
