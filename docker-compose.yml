name: darknetra

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: darknetra
      POSTGRES_USER: darknetra
      POSTGRES_PASSWORD: ${DARKNETRA_POSTGRES_PASSWORD:-darknetra-dev-only}
      DARKNETRA_POSTGRES_RUNTIME_PASSWORD: ${DARKNETRA_POSTGRES_RUNTIME_PASSWORD:?runtime PostgreSQL password required}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infrastructure/docker/postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - app
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  db-bootstrap:
    image: postgres:18
    command: ["/bin/sh", "/opt/darknetra/001-runtime-role.sh"]
    environment:
      POSTGRES_DB: darknetra
      POSTGRES_USER: darknetra
      PGPASSWORD: ${DARKNETRA_POSTGRES_PASSWORD:-darknetra-dev-only}
      PGHOST: postgres
      DARKNETRA_POSTGRES_RUNTIME_PASSWORD: ${DARKNETRA_POSTGRES_RUNTIME_PASSWORD:?runtime PostgreSQL password required}
    volumes:
      - ./infrastructure/docker/postgres-init/001-runtime-role.sh:/opt/darknetra/001-runtime-role.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    environment: &api-environment
      DARKNETRA_ENVIRONMENT: development
      DARKNETRA_BUILD_VERSION: docker-dev
      DARKNETRA_DATABASE_URL: postgresql+psycopg://darknetra_runtime:${DARKNETRA_POSTGRES_RUNTIME_PASSWORD:?runtime PostgreSQL password required}@postgres:5432/darknetra
      DARKNETRA_REDIS_URL: redis://redis:6379/0
      DARKNETRA_EVIDENCE_STORE_ROOT: /var/lib/darknetra/evidence
      DARKNETRA_EVIDENCE_STORE_ALLOW_TRUSTED_VOLUME_FALLBACK: "false"
      DARKNETRA_EVIDENCE_UPLOAD_MAX_BYTES: ${DARKNETRA_EVIDENCE_UPLOAD_MAX_BYTES:-104857600}
      DARKNETRA_EVIDENCE_INGEST_PIPELINE_VERSION: ${DARKNETRA_EVIDENCE_INGEST_PIPELINE_VERSION:-v1}
      DARKNETRA_WEB_ORIGIN: ${DARKNETRA_WEB_ORIGIN:-http://localhost:3000}
      DARKNETRA_JWT_SIGNING_KEY_B64: ${DARKNETRA_JWT_SIGNING_KEY_B64:-}
      DARKNETRA_FIELD_KEY_V1_B64: ${DARKNETRA_FIELD_KEY_V1_B64:-}
      DARKNETRA_FIELD_KEYRING_B64_JSON: ${DARKNETRA_FIELD_KEYRING_B64_JSON:-}
      DARKNETRA_FIELD_BLIND_INDEX_KEY_B64: ${DARKNETRA_FIELD_BLIND_INDEX_KEY_B64:-}
      DARKNETRA_FIELD_ACTIVE_KEY_VERSION: ${DARKNETRA_FIELD_ACTIVE_KEY_VERSION:-v1}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - app
    volumes:
      - evidence_store:/var/lib/darknetra/evidence
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready',timeout=3)); assert data['status']=='ready'"
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 5s

  migrate:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    command:
      - uv
      - run
      - --no-sync
      - alembic
      - -c
      - apps/api/alembic.ini
      - upgrade
      - head
    environment:
      DARKNETRA_DATABASE_URL: postgresql+psycopg://darknetra_runtime:${DARKNETRA_POSTGRES_RUNTIME_PASSWORD:?runtime PostgreSQL password required}@postgres:5432/darknetra
      DARKNETRA_DATABASE_OWNER_URL: postgresql+psycopg://darknetra:${DARKNETRA_POSTGRES_PASSWORD:-darknetra-dev-only}@postgres:5432/darknetra
    depends_on:
      postgres:
        condition: service_healthy
      db-bootstrap:
        condition: service_completed_successfully
    networks:
      - app

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    command:
      - uv
      - run
      - --no-sync
      - celery
      - -A
      - darknetra_api.jobs.celery_app:celery_app
      - worker
      - --loglevel=INFO
      - --queues=ingest
      - --concurrency=1
      - --hostname=ingest@%h
    environment: *api-environment
    volumes:
      - evidence_store:/var/lib/darknetra/evidence
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - app
    healthcheck:
      test:
        - CMD-SHELL
        - "uv run --no-sync celery -A darknetra_api.jobs.celery_app:celery_app inspect ping --destination ingest@$$HOSTNAME --timeout=5 | grep -q pong"
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_DARKNETRA_API_BASE_URL: http://localhost:8000
    environment:
      DARKNETRA_API_BASE_URL: http://api:8000
      NEXT_PUBLIC_DARKNETRA_API_BASE_URL: http://localhost:8000
    depends_on:
      api:
        condition: service_healthy
    networks:
      - app

networks:
  app:
    driver: bridge

volumes:
  postgres-data:
  evidence_store:
