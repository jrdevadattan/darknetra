[project]
name = "darknetra"
version = "0.1.0"
description = "Evidence-first, case-isolated investigation workspace backend"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.141,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0.37,<2.1",
  "psycopg[binary,pool]>=3.2,<4",
  "alembic>=1.14,<2",
  "pgvector>=0.3,<1",
  "argon2-cffi>=23.1",
  "pyjwt>=2.10,<3",
  "cryptography>=44",
  "python-multipart>=0.0.20",
  "structlog>=25",
  "httpx>=0.28,<1",
  "sse-starlette>=2.2,<4",
  "apscheduler>=3.11,<4",
  "pypdf>=5,<7",
  "selectolax>=0.3",
  "nh3>=0.2",
  "pillow>=11,<13",
  "imagehash>=4.3,<5",
  "filetype>=1.2,<2",
  "warcio>=1.7,<2",
  "base58>=2.1,<3",
  "bech32>=1.2,<2",
  "eth-utils>=5,<6",
  "pgpy>=0.6,<1",
  "phonenumbers>=8.13",
  "rapidfuzz>=3.11,<4",
  "indic-transliteration>=2.3,<3",
  "pyyaml>=6,<7",
  "jinja2>=3.1,<4",
  "markdown-it-py>=3,<5",
  "fpdf2>=2.8,<3",
  "networkx>=3.4,<4",
  "numpy>=2.2,<3",
  "scikit-learn>=1.6,<2",
  "ollama>=0.4,<1",
  "claude-agent-sdk>=0.1,<1",
  "prometheus-client>=0.21,<1",
  "feedparser==6.0.14",
  "trafilatura==2.2.0",
  "mcp>=2.1.1,<3",
  "agent-reach",
]

[project.optional-dependencies]
ner = ["gliner>=0.2,<1"]
embed = ["FlagEmbedding>=1.3,<2", "sentence-transformers>=3,<6"]
gnn = ["torch>=2.6,<3", "torch-geometric>=2.6,<3"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "pytest-cov>=6,<8", "hypothesis>=6", "ruff>=0.11", "mypy>=1.15,<2", "respx>=0.22,<1", "freezegun>=1.5,<2", "asgi-lifespan>=2.1,<3", "types-PyYAML", "types-passlib"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["darknetra"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["unit: pure functions", "integration: real Postgres", "contract: API invariants", "scenario: documented scenario", "live: external dependency required", "gnn: optional model required", "slow: extended integration"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
strict = true
follow_imports = "silent"
ignore_missing_imports = true

[tool.uv.sources]
agent-reach = { url = "https://github.com/Panniantong/Agent-Reach/archive/da5044d26fc6adddb6554d5679c94ac22e76e428.tar.gz" }
